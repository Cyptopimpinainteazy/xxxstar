[package]
name = "x3-chain-node"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["X3 Chain Core Engineering <engineering@x3-chain.io>"]
license = "Apache-2.0"
description = "X3 Chain L1 Substrate node binary with dual-VM readiness."
repository = "https://github.com/x3-chain/core"
default-run = "x3-chain-node"

[[bin]]
name = "x3-chain-node"
path = "src/main.rs"

[dependencies]
x3-chain-runtime = { path = "../runtime", features = ["std"] }
pallet-x3-kernel = { path = "../pallets/x3-kernel", features = ["std"] }
pallet-atomic-trade-engine = { path = "../pallets/atomic-trade-engine", features = ["std"] }
pallet-evolution-core = { path = "../pallets/evolution-core", features = ["std"] }
pallet-x3-verifier = { path = "../pallets/x3-verifier", features = ["std"] }
pallet-x3-domain-registry = { path = "../pallets/x3-domain-registry", features = ["std"] }
flash-finality = { package = "x3-flash-finality", path = "../crates/flash-finality" }
poh-generator = { package = "x3-poh-generator", path = "../crates/poh-generator" }
x3-bridge-adapters = { path = "../crates/x3-bridge-adapters" }
x3-rpc = { path = "../crates/x3-rpc" }
x3-atomic-trade = { path = "../crates/x3-atomic-trade" }
x3-atomic-swap = { path = "../crates/x3-atomic-swap", features = ["std"] }
x3-runtime-signer = { path = "../crates/x3-runtime-signer" }
atomic-swap-orchestrator = { path = "../crates/atomic-swap-orchestrator" }
x3-cross-vm-bridge = { path = "../crates/cross-vm-bridge" }
x3-vm = { path = "../crates/x3-vm" }
pallet-x3-settlement-engine = { path = "../pallets/x3-settlement-engine", default-features = false, features = ["std"] }
pallet-x3-cross-vm-router = { path = "../pallets/x3-cross-vm-router", default-features = false, features = ["std"] }
pallet-agent-memory = { path = "../pallets/agent-memory", default-features = false, features = ["std"] }
x3-finality-oracle = { path = "../crates/x3-finality-oracle" }
x3-verification-router = { path = "../crates/x3-verification-router" }
x3-validator-attestation = { path = "../crates/x3-validator-attestation" }
x3-proof-dispute = { path = "../crates/x3-proof-dispute" }
x3-gateway-risk-engine = { path = "../crates/x3-gateway-risk-engine" }
parallel-proposer = { path = "../crates/parallel-proposer" }
contention-predictor = { path = "../crates/contention-predictor" }
x3-gpu-validator-swarm = { path = "../crates/x3-gpu-validator-swarm", optional = true }
cross-chain-gpu-validator = { path = "../crates/cross-chain-gpu-validator", optional = true }
async-trait = "0.1"

clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
bs58 = "0.5"
log = "0.4"
env_logger = "0.10"
fs2 = "0.4"
serde = { workspace = true }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
pallet-x3-wrapped = { path = "../pallets/x3-wrapped", default-features = false, features = ["std"] }
codec = { package = "parity-scale-codec", version = "3.6", default-features = false, features = ["derive"] }
x3-common = { path = "../crates/x3-common" }
jsonrpsee = { workspace = true }
tokio = { version = "1.37", features = ["rt", "rt-multi-thread", "time"] }
pallet-evm = { workspace = true, default-features = false, features = ["std"] }
pallet-collective = { workspace = true, default-features = false, features = ["std"] }
pallet-cross-chain-validator = { path = "../pallets/cross-chain-validator", default-features = false, features = ["std"] }
pallet-transaction-payment = { workspace = true, default-features = false, features = ["std"] }
pallet-x3-agent-law = { path = "../pallets/x3-agent-law", default-features = false, features = ["std"] }
pallet-x3-invariants = { path = "../pallets/x3-invariants", default-features = false, features = ["std"] }
pallet-x3-atomic-kernel = { path = "../pallets/x3-atomic-kernel", default-features = false, features = ["std"] }
pallet-x3-custody = { path = "../pallets/x3-custody", default-features = false, features = ["std"] }
pallet-session = { workspace = true, default-features = false, features = ["std"] }
frame-support = { workspace = true, default-features = false, features = ["std"] }

sc-basic-authorship = { workspace = true }
sc-block-builder = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = false }
sc-cli = { workspace = true }
sc-client-api = { workspace = true }
sc-keystore = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-aura = { workspace = true }
sc-consensus-grandpa = { workspace = true }
sc-executor = { workspace = true }
sc-network = { workspace = true }
sc-network-gossip = { workspace = true }
sc-rpc = { workspace = true }
sc-rpc-api = { workspace = true }
sc-service = { workspace = true }
sc-telemetry = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }
substrate-prometheus-endpoint = { path = "../patches/substrate-prometheus-endpoint" }

frame-system = { workspace = true, default-features = false, features = ["std"] }

sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-blockchain = { workspace = true }
sp-consensus = { workspace = true }
sp-consensus-aura = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-core = { workspace = true }
sp-inherents = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }
sp-timestamp = { workspace = true }
sp-keystore = { workspace = true }

substrate-frame-rpc-system = { workspace = true }
pallet-transaction-payment-rpc = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = false }

frame-benchmarking-cli = { workspace = true, optional = true, default-features = false }

[features]
default = ["cli"]
cli = []

# The development runtime: `pallet-sudo` in the runtime, dev defaults in the specs, and
# this network's `powLimit` at Bitcoin regtest's (`0x207fffff`) rather than mainnet's, so a
# local chain can anchor a header it just mined.
#
# This existed as a runtime feature (`x3-chain-runtime/dev`) and as a chain name (`--chain
# dev`) but not as a *node* feature, which meant `--chain dev` ran the default runtime: a
# spec that called itself dev, a runtime with no `Sudo`, and a proof-of-work limit that
# refuses every regtest header. Building with `--features dev` is what makes the dev spec
# and the dev runtime the same thing.
dev = ["x3-chain-runtime/dev"]

testnet = ["x3-chain-runtime/testnet"]
mainnet-rc1 = ["x3-chain-runtime/mainnet-rc1"]

gpu-validator = [
    "x3-gpu-validator-swarm",
    "cross-chain-gpu-validator",
    "x3-chain-runtime/gpu-validator",
]

frontier = ["x3-chain-runtime/frontier", "x3-chain-runtime/native-real-vm-adapters"]
native = ["x3-chain-runtime/native"]

runtime-benchmarks = [
    "x3-chain-runtime/runtime-benchmarks",
    "frame-benchmarking-cli/runtime-benchmarks",
]

try-runtime = [
    "x3-chain-runtime/try-runtime",
]

[dev-dependencies]
# The live tests compile real `.x3` source with the same bridge the node uses, so a
# program under test is an artifact the compiler produced rather than a fixture.
x3-x3-integration = { path = "../crates/x3-integration", features = ["std", "compile"] }
# `supply_invariant_distributed` reads `System::Account` back out of chain state, so it decodes the
# runtime's real `frame_system::AccountInfo<Nonce, pallet_balances::AccountData<Balance>>` instead
# of a hand-copied byte layout. Same crate the runtime already links.
pallet-balances = { workspace = true, features = ["std"] }
# The per-asset half of `supply_invariant_distributed` decodes the pallet's own
# `SupplyLedger` out of `AtlasKernelRuntimeApi_get_asset_supply_ledger`, so it names the
# ledger's type rather than a hand-copied field order. Same crate the runtime already links.
x3-asset-kernel-types = { path = "../crates/x3-asset-kernel-types", features = ["std"] }
# The per-asset half also *creates* the record it checks (`X3TokenFactory::create_token`, the
# only signed path that gives the supply ledger an asset), so the test names the pallet's own
# `TokenFactoryConfig` rather than restating its fields.
pallet-x3-token-factory = { path = "../pallets/x3-token-factory", default-features = false, features = ["std"] }
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = { workspace = true }
# The producer: this test boots an anvil, has the relayer build the receipt
# proof for a transaction in a real block, and submits it to the engine.
x3-relayer = { path = "../crates/x3-relayer" }
