SPECIFICATION Spec

\* Deliberately broken fixture: both pre-#558 defects enabled at once, the
\* state the coordinator actually shipped before 31eed9086. TLC MUST find a
\* counterexample here. A green run means the negative control has stopped
\* controlling. Attribution of the two defects, one flag at a time:
\*   LegacyAbortSkipsTable = TRUE     -> NoLegBothClaimedAndRefunded
\*                                       (Complete -> Aborting -> Refunded
\*                                       pays both sides twice)
\*   LegacySlowClaimGuard  = TRUE     -> CompleteImpliesBothClaimed
\*                                       (Complete from ClaimingFast with
\*                                       the fast leg never claimed)
\* PROPERTIES is intentionally omitted so the run reaches a money invariant
\* rather than tripping TerminalPhasesAbsorbing on the way.
\* Not run by the S0 gate - the gate runs <Module>.cfg - but kept in-tree so
\* the check can be reproduced:
\*   cd formal-proofs/tla/atomic_settlement
\*   java -cp ../../../tools/tla2tools.jar tlc2.TLC -deadlock \
\*     -metadir "$(mktemp -d)" -config AtomicSettlement.legacy.cfg \
\*     AtomicSettlement
CONSTANTS
    LegacyAbortSkipsTable = TRUE
    LegacySlowClaimGuard  = TRUE

INVARIANTS
    TypeOK
    NoLegBothClaimedAndRefunded
    ClaimsRequireLocks
    CompleteImpliesBothClaimed
    RefundedImpliesNothingClaimed
    RefundedAccountsForLockedLegs

CHECK_DEADLOCK FALSE
