SPECIFICATION Spec

CONSTANTS
    \* Digests modelled as small integers — TLC only needs equality, not
    \* the actual 256-bit values. Flipping any number in CpuGpuParity.tla
    \* surfaces a counter-example pinpointing the divergent vector.
    \* The TLC config parser understands only literal values or `X <- Impl`
    \* operator references — not `:>`/`@@` function construction.
    Vectors    = {"v_sha256_empty", "v_sha256_abc", "v_blake3_empty", "v_keccak256_empty"}
    SpecDigest <- SpecDigestImpl
    CpuDigest  <- CpuDigestImpl
    GpuDigest  <- GpuDigestImpl

INVARIANTS
    Invariant
    CpuMatchesSpec
    GpuMatchesSpec
    PathsAgree

CHECK_DEADLOCK FALSE
