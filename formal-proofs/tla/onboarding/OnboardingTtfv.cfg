SPECIFICATION Spec

CONSTANTS
    \* Mirrors the actual ttfv_benchmark.json step order. The TLC config
    \* parser understands only literal values or `X <- Impl` operator
    \* references — not `:>`/`@@` function construction — so the maps are
    \* defined in OnboardingTtfv.tla.
    Steps        = {"build", "verify_flashloans", "verify_evm_svm"}
    StepOrder    <- StepOrderImpl
    \* Durations in seconds (rounded up from the recorded benchmark:
    \* 22.924s + 1.214s + 0.092s = 24.230s; using 23/2/1 = 26 keeps TLC
    \* in integer arithmetic and stays well under Budget=600).
    StepDuration <- StepDurationImpl
    StepOutcome  <- StepOutcomeImpl
    Budget       = 600

INVARIANTS
    Invariant
    NoStepFailed
    WithinBudget

CHECK_DEADLOCK FALSE
