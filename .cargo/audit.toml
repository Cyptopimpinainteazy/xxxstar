[advisories]
# Ignored advisories for `cargo audit`. This file is read by cargo-audit only;
# `cargo deny` reads deny.toml, and neither tool reads the other's config.
#
# THE TWO IGNORE LISTS MUST BE IDENTICAL. `scripts/check-advisory-scope.py` fails when
# they differ -- a comment asking for them to be kept in sync was the entire mechanism
# before that, and they had drifted to 35 and 51 entries with 11 and 12 of them
# respectively suppressing anything at all.
#
# Every entry must be an advisory that is BOTH present in the built graph and one this
# project has decided to accept, with the reason stated. `dependency audit` runs
# cargo-deny with `-D advisory-not-detected`, so an entry that stops matching -- because
# the crate was upgraded, removed, or the advisory was withdrawn -- fails the build
# instead of sitting here looking like coverage. 39 entries were removed on 2026-09-25
# for exactly that reason: the whole wasmtime 8.x/35.x cluster, the tokio-postgres,
# rkyv, tracing-subscriber and rsa pins (all of whose crates are now on non-affected
# versions) and the unmaintained advisories, which deny.toml now declines wholesale.
# Re-add one, with a reason, if the affected version comes back.
#
# Advisories that live only in the GitHub Advisory Database have no RustSec id and
# cannot be represented here at all; those are recorded in security/advisory-scope.toml.
ignore = [
    # ---- Substrate / polkadot-sdk stable2512 pins ------------------------------
    "RUSTSEC-2022-0093",   # ed25519-dalek 1.0.1 via ed25519-zebra -> sp-core; 2.2.0 also resolved
    "RUSTSEC-2024-0344",   # curve25519-dalek 3.2.0, same Substrate path; timing side channel
    "RUSTSEC-2024-0437",   # protobuf 2.28.0 via prometheus 0.13.4 (cross-chain-gpu-validator, sc-utils)

    # ---- legacy JSON-RPC / ethers 2.x path ------------------------------------
    "RUSTSEC-2024-0421",   # idna 0.1.5 via url 1.7.2 -> jsonrpc-core-client 18 -> ethers 2.x
    "RUSTSEC-2025-0009",   # ring 0.16.20 via jsonwebtoken 8 -> ethers 2.x -> x3-bot

    # ---- rustls 0.21 / hyper-rustls 0.24 (reqwest 0.11) -----------------------
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",   # rustls-webpki 0.101.7; 0.103.15 is also resolved and clean

    # ---- hickory-proto 0.24.4 / 0.25.2 ----------------------------------------
    # Reachability per consumer: docs/security/GHSA-3v94-mw7p-v465.md and
    # docs/security/GHSA-q2qq-hmj6-3wpp.md, enforced by the `advisory scope` gate.
    "RUSTSEC-2026-0118",   # NSEC3 loop - not compiled here (no dnssec feature is enabled)
    "RUSTSEC-2026-0119",   # O(n^2) encoding - accepted; nothing here encodes attacker-shaped records

    # ---- advisories cargo-audit sees in Cargo.lock but cargo-deny's graph does not
    # These are entries for packages that no configured target builds -- stale
    # lock entries rather than live dependencies (`sqlx-mysql` is in the lock, and no
    # crate in this workspace enables sqlx's mysql feature). cargo-audit audits every
    # package in Cargo.lock, so it still fires on them; cargo-deny builds a graph for
    # the four configured targets and reports "advisory not encountered" if they are
    # listed there. They therefore belong in this file and NOT in deny.toml, and
    # `advisory scope` enforces that split: an id may be absent from deny.toml only if
    # it is named in scripts/check-advisory-scope.py's LOCK_ONLY_ADVISORIES.
    "RUSTSEC-2023-0071",   # rsa 0.9.10 via sqlx-mysql, which nothing here enables

    # ---- h2 0.3.27 ------------------------------------------------------------
    "RUSTSEC-2026-0258",   # server-side DoS; this tree only runs the client half

    # ---- stale 2026 lock entries no configured target builds ------------------
    # cargo tree --target all --all-features resolves none of these; cargo-deny's
    # graph therefore cannot encounter them. LOCK_ONLY_ADVISORIES in
    # scripts/check-advisory-scope.py enforces the audit-only split.
    "RUSTSEC-2026-0344",   # ruzstd 0.8.3
    "RUSTSEC-2026-0346",   # rustls 0.21.12
    "RUSTSEC-2026-0349",   # rustls 0.21.12
    "RUSTSEC-2026-0367",   # zip 0.6.7 (vendored from 0.6.6; Windows-only target)
    "RUSTSEC-2026-0368",   # zip 0.6.7 (vendored from 0.6.6; Windows-only target)
    "RUSTSEC-2026-0369",   # zip 0.6.7 (vendored from 0.6.6; Windows-only target)
    "RUSTSEC-2026-0381",   # webpki-roots 0.24.0
    "RUSTSEC-2026-0382",   # rustls-webpki 0.101.7

    # ---- crypto-bigint 0.5.5 pinned by Substrate/Frontier ---------------------
    # X3-owned k256 consumers are on 0.14 / crypto-bigint 0.7.8. The remaining
    # 0.5.5 copy is upstream public-input verification/recovery; the accepted
    # exposure and re-review trigger are recorded in security/advisory-scope.toml.
    "RUSTSEC-2026-0387",

    # ---- unsound, with no upgrade path from this tree -------------------------
    # cargo-deny treats `unsound` as an error and offers no policy switch for it, so
    # these are named individually instead of waved through: a *new* unsound advisory
    # still fails the gate.
    "RUSTSEC-2022-0034",   # pkcs11 0.5.0 via custody-service; the advisory says no safe upgrade exists
    "RUSTSEC-2026-0002",   # lru 0.12.5 IterMut aliasing; 0.12 is pinned by libp2p-identify 0.44/0.45
    "RUSTSEC-2026-0253",   # lru LruCache::pop panic safety; same pin
    "RUSTSEC-2026-0191",   # solana_rbpf 0.8.5 EbpfVm::invoke_function; dev/test-only path

    # ---- ethers 2.x / solana 3.0.14 / stable2512 transitives, 2026-10-26 -------
    # Accepted risk, recorded rather than fixed: every patched version below is a
    # breaking major held by an upstream crate this workspace does not own, so the
    # remedy is an upstream release or leaving ethers 2.x, not a version bump here.
    # Each entry names the path found by `cargo tree -e all -i <crate>` and what
    # bounds the exposure. Remove an entry the moment it stops matching; `-D
    # advisory-not-detected` is what makes that happen automatically.
    "RUSTSEC-2026-0344",   # ruzstd 0.8.3 (>=0.9.1) DoS via smoldot wasm decode; that caller caps output with BlockDecodingStrategy::UptoBytes(max_allowed), so the bomb is bounded where it is used
    "RUSTSEC-2026-0346",   # rustls 0.21.12 (>=0.23.46) Debug leaks session secrets; only via reqwest 0.11 / hyper-rustls 0.24 (ethers 2.x, solana); needs the app to Debug-format a client session, which nothing here does
    "RUSTSEC-2026-0349",   # rustls 0.21.12 (>=0.23.46) ServerHello can downgrade later connections to classical key exchange; same legacy client path, and TLS auth itself still holds (C:L, not a confidentiality break)
    "RUSTSEC-2026-0367",   # zip 0.6.6 (>=9.0.0) SUID/SGID preserved on extract; zip reaches only x3-bot and x3-foundry-core via svm-rs, which extracts official solc archives fetched over HTTPS
    "RUSTSEC-2026-0368",   # zip 0.6.6 (>=9.0.0) symlink target escapes destination on extract; same single svm-rs caller; ethers-solc never calls extract
    "RUSTSEC-2026-0369",   # zip 0.6.6 (>=9.0.0) permissions applied through symlink; same caller and same bound
    "RUSTSEC-2026-0381",   # webpki-roots 0.24.0/0.25.4 (>=1.0.10) bundled roots trust distrusted emSign intermediates; these two versions reach only tungstenite 0.20 / reqwest 0.11, while the current reqwest 0.12 and hyper-rustls 0.27 paths already use 1.0.10
    "RUSTSEC-2026-0382",   # rustls-webpki 0.101.7 (>=0.103.16) may accept distrusted intermediates; reached through rustls 0.21.12 and libp2p-tls 0.4/0.5; 0.103.16 is already resolved alongside and is the version the 0.23 chain verifies with
    "RUSTSEC-2026-0387",   # crypto-bigint 0.5.5 (>=0.7.6) timing variability in constant-time ops; via elliptic-curve 0.13.8 -> ethers-signers secp256k1 signing, so it is a local side channel against key operations, not a remote break
    "RUSTSEC-2026-0391",   # zstd 0.13.3 (>=0.14.3) abandoned stream leaks into the next on a reused context; via actix-http, solana-runtime and wasmtime-internal-cache
    "RUSTSEC-2026-0398",   # zstd-safe 7.3.0 (>=8.2.0) Seekable::decompress sets a Vec length past capacity for an out-of-range offset; no workspace caller uses Seekable
    "RUSTSEC-2026-0403",   # zstd-safe 5.0.2/6.0.6/7.3.0 (>=8.2.0) uninitialized memory on a failed legacy-frame stream; requires a deliberately malformed zstd v0.4-v0.7 frame and the legacy path
]
