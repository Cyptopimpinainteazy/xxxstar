[advisories]
# Ignored advisories for `cargo audit`. This file is read by cargo-audit only;
# `cargo deny` reads deny.toml, and neither tool reads the other's config.
#
# THE TWO IGNORE LISTS MUST BE IDENTICAL. `scripts/check-advisory-scope.py` fails when
# they differ -- a comment asking for them to be kept in sync was the entire mechanism
# before that, and they had drifted to 35 and 51 entries with 11 and 12 of them
# respectively suppressing anything at all.
#
# Every entry must be an advisory that is BOTH present in the built graph and one this
# project has decided to accept, with the reason stated. `dependency audit` runs
# cargo-deny with `-D advisory-not-detected`, so an entry that stops matching -- because
# the crate was upgraded, removed, or the advisory was withdrawn -- fails the build
# instead of sitting here looking like coverage. 39 entries were removed on 2026-09-25
# for exactly that reason: the whole wasmtime 8.x/35.x cluster, the tokio-postgres,
# rkyv, tracing-subscriber and rsa pins (all of whose crates are now on non-affected
# versions) and the unmaintained advisories, which deny.toml now declines wholesale.
# Re-add one, with a reason, if the affected version comes back.
#
# Advisories that live only in the GitHub Advisory Database have no RustSec id and
# cannot be represented here at all; those are recorded in security/advisory-scope.toml.
ignore = [
    # ---- Substrate / polkadot-sdk stable2512 pins ------------------------------
    "RUSTSEC-2022-0093",   # ed25519-dalek 1.0.1 via ed25519-zebra -> sp-core; 2.2.0 also resolved
    "RUSTSEC-2024-0344",   # curve25519-dalek 3.2.0, same Substrate path; timing side channel
    "RUSTSEC-2024-0437",   # protobuf 2.28.0 via prometheus 0.13.4 (cross-chain-gpu-validator, sc-utils)

    # ---- legacy JSON-RPC / ethers 2.x path ------------------------------------
    "RUSTSEC-2024-0421",   # idna 0.1.5 via url 1.7.2 -> jsonrpc-core-client 18 -> ethers 2.x
    "RUSTSEC-2025-0009",   # ring 0.16.20 via jsonwebtoken 8 -> ethers 2.x -> x3-bot

    # ---- rustls 0.21 / hyper-rustls 0.24 (reqwest 0.11) -----------------------
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",   # rustls-webpki 0.101.7; 0.103.15 is also resolved and clean

    # ---- hickory-proto 0.24.4 / 0.25.2 ----------------------------------------
    # Reachability per consumer: docs/security/GHSA-3v94-mw7p-v465.md and
    # docs/security/GHSA-q2qq-hmj6-3wpp.md, enforced by the `advisory scope` gate.
    "RUSTSEC-2026-0118",   # NSEC3 loop - not compiled here (no dnssec feature is enabled)
    "RUSTSEC-2026-0119",   # O(n^2) encoding - accepted; nothing here encodes attacker-shaped records

    # ---- advisories cargo-audit sees in Cargo.lock but cargo-deny's graph does not
    # These are entries for packages that no configured target builds -- stale
    # lock entries rather than live dependencies (`sqlx-mysql` is in the lock, and no
    # crate in this workspace enables sqlx's mysql feature). cargo-audit audits every
    # package in Cargo.lock, so it still fires on them; cargo-deny builds a graph for
    # the four configured targets and reports "advisory not encountered" if they are
    # listed there. They therefore belong in this file and NOT in deny.toml, and
    # `advisory scope` enforces that split: an id may be absent from deny.toml only if
    # it is named in scripts/check-advisory-scope.py's LOCK_ONLY_ADVISORIES.
    "RUSTSEC-2023-0071",   # rsa 0.9.10 via sqlx-mysql, which nothing here enables

    # ---- h2 0.3.27 ------------------------------------------------------------
    "RUSTSEC-2026-0258",   # server-side DoS; this tree only runs the client half

    # ---- unsound, with no upgrade path from this tree -------------------------
    # cargo-deny treats `unsound` as an error and offers no policy switch for it, so
    # these are named individually instead of waved through: a *new* unsound advisory
    # still fails the gate.
    "RUSTSEC-2022-0034",   # pkcs11 0.5.0 via custody-service; the advisory says no safe upgrade exists
    "RUSTSEC-2026-0002",   # lru 0.12.5 IterMut aliasing; 0.12 is pinned by libp2p-identify 0.44/0.45
    "RUSTSEC-2026-0253",   # lru LruCache::pop panic safety; same pin
    "RUSTSEC-2026-0191",   # solana_rbpf 0.8.5 EbpfVm::invoke_function; dev/test-only path
]
