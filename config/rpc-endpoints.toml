# X3 Bridge Adapter RPC Endpoints
# Map each supported chain to its JSON-RPC endpoint.
# Set the X3_CHAIN_RPC_<NAME> env var to override at runtime.

[ethereum]
chain_id = 1
rpc_url = "https://eth.llamarpc.com"
env_var = "X3_RPC_ETHEREUM"

[ethereum-sepolia]
chain_id = 11155111
rpc_url = "https://sepolia.drpc.org"
env_var = "X3_RPC_ETHEREUM_SEPOLIA"

[arbitrum-one]
chain_id = 42161
rpc_url = "https://arb1.arbitrum.io/rpc"
env_var = "X3_RPC_ARBITRUM"

[arbitrum-nova]
chain_id = 42170
rpc_url = "https://nova.arbitrum.io/rpc"
env_var = "X3_RPC_ARBITRUM_NOVA"

[bsc]
chain_id = 56
rpc_url = "https://bsc-dataseed.binance.org"
env_var = "X3_RPC_BSC"

[bsc-testnet]
chain_id = 97
rpc_url = "https://data-seed-prebsc-1-s1.binance.org:8545"
env_var = "X3_RPC_BSC_TESTNET"

[optimism]
chain_id = 10
rpc_url = "https://mainnet.optimism.io"
env_var = "X3_RPC_OPTIMISM"

[base]
chain_id = 8453
rpc_url = "https://mainnet.base.org"
env_var = "X3_RPC_BASE"

[polygon]
chain_id = 137
rpc_url = "https://polygon-rpc.com"
env_var = "X3_RPC_POLYGON"

[avalanche]
chain_id = 43114
rpc_url = "https://api.avax.network/ext/bc/C/rpc"
env_var = "X3_RPC_AVALANCHE"

[solana]
chain_id = 1399811149
rpc_url = "https://api.mainnet-beta.solana.com"
env_var = "X3_RPC_SOLANA"

[bitcoin]
# Bitcoin does not use JSON-RPC; uses Electrum or Bitcoin Core REST API.
# Set X3_BTC_RPC_URL to an Electrum server or Bitcoin Core RPC URL.
chain_id = 0
rpc_url = ""
env_var = "X3_RPC_BITCOIN"

[sui]
chain_id = 21
