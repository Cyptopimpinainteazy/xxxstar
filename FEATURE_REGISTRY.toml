[atomic_kernel]
mode = "LIVE_TESTNET"
crate_or_service = "pallets/x3-atomic-kernel"
tauri_app = "AtomicLock"
required_tests = [
  "canonical_supply_invariant_holds",
  "represented_total_equals_canonical_supply",
  "pending_supply_returns_to_zero",
  "invariant_break_triggers_economic_halt",
  "halt_blocks_new_mint",
  "halt_blocks_new_transfer",
  "halt_blocks_new_swap",
  "halt_allows_refund",
  "halt_allows_recovery"
]
health_endpoint = "/health/atomic-kernel"
proof_report = "reports/six_route_invariants.md"
readiness_score = 85
blockers = [
  "Economic halt path is tested but has never been triggered in a multi-validator network"
]
dangerous_paths = ["runtime", "pallets/x3-atomic-kernel", "genesis", "tokenomics"]

[triforge_runtime]
mode = "GUARDED_TESTNET"
crate_or_service = "pallets/evolution-core"
tauri_app = "LaunchGate"
required_tests = ["runtime_upgrade_rehearsal"]
health_endpoint = "/health/runtime"
proof_report = "reports/mainnet_readiness_report.md"
readiness_score = 65
blockers = [
  "No automated migration-dry-run across all 6 construct_runtime! variants"
]
dangerous_paths = ["runtime", "chain-specs", "validator keys"]

[atomic_router]
mode = "LIVE_TESTNET"
crate_or_service = "pallets/x3-cross-vm-router"
tauri_app = "Gateway"
required_tests = [
  "test_x3_native_evm_svm_roundtrip_preserves_supply",
  "test_all_six_internal_routes_succeed",
  "test_duplicate_nonce_rejected",
  "test_failed_destination_credit_refunds_pending_supply",
  "test_canonical_supply_never_breaks",
  "test_duplicate_message_replay_rejected",
  "test_expired_transfer_refunds_to_source",
  "external_bridges_are_paused_at_genesis"
]
health_endpoint = "/health/atomic-router"
proof_report = "reports/six_route_invariants.md"
readiness_score = 88
blockers = [
  "External-bridge path disabled at genesis — governance gate, not code gap"
]
dangerous_paths = ["pallets/x3-cross-vm-router", "bridge code", "message routing"]

[atomic_gateway]
mode = "GUARDED_TESTNET"
crate_or_service = "crates/x3-gateway"
tauri_app = "Gateway"
required_tests = ["audit_gate_enabled", "revoke_disables_gateway"]
health_endpoint = "/health/atomic-gateway"
proof_report = "reports/btc_gateway_report.md"
readiness_score = 65
blockers = [
  "Gateway is guarded — ExternalBridgesEnabled = false at genesis (governance gate)"
]
dangerous_paths = ["external bridges", "gateway enablement", "audit gate"]

[btc_fortress_gateway]
mode = "SIM_TESTNET"
crate_or_service = "crates/x3-gateway"
tauri_app = "BTCGateway"
required_tests = [
  "btc_regtest_deposit_detected",
  "btc_requires_confirmations",
  "btc_xbtc_mint_updates_kernel_accounting",
  "btc_mainnet_disabled_by_feature_flag"
]
health_endpoint = "/health/btc-gateway"
proof_report = "reports/btc_gateway_report.md"
readiness_score = 25
blockers = [
  "SIM_TESTNET only — regtest Bitcoin, not mainnet",
  "BTC mainnet disabled by feature flag; no real BTC signer quorum"
]
dangerous_paths = ["btc mainnet", "withdrawal broadcast", "signer quorum"]

[axe]
