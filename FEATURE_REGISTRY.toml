# Rebuilt 2026-09-27. The old script dumped every `TODO|FIXME|unwrap(` line plus a list of filenames
# whose name contained a subsystem word: no severity, no symbol, no fix, no gate, no test — and the
# row above cited `swarm_scan_generates_report`, a test that existed nowhere. Nothing caught that,
# because the readiness gate only resolves citations whose `crate_or_service` is a directory of `.rs`
# files, and this row points at a script. That is now the scanner's own first finding class.
#
# What it is now (`scripts/swarm/x3_repo_scan.py`, wrapped by `scripts/swarm/swarm_scan.sh`):
#   * every finding carries id, severity, kind, path, line, symbol, why, suggested_fix,
#     test_required and gate_affected — asserted field-by-field by the fixture test;
#   * sorted by severity/kind/path/line, so two runs over one tree are byte-identical;
#   * `reports/swarm_scan_report.md` for a person, `reports/swarm_scan_findings.json` for a program;
#   * a ratchet over the kinds it owns (`docs/reports/repo-scan-baseline.json`), so growth fails and
#     shrinkage is always allowed;
#   * `--patches` writes a real unified diff to `.ai/patches/<id>.patch` for the classes whose fix is
#     mechanical (`ungated-crate`: one gate line); nothing is ever applied to the tree.
#
# It does not re-report what the existing ratchets own: `TODO`/stub markers and test cheats belong to
# `scripts/x3_fake_code_scan.py`, reachable panics to `scripts/audit/panic_unwrap_scan.py`. It runs
# both and folds their verdicts into the report's gate summary instead of duplicating their debt.
#
# First live run, 2026-09-27 (36 findings; 32 after two of the ungated crates were gated the same
# session — the scanner proposed the gate lines as patches and applying them dropped its own count):
