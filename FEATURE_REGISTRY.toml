#     late-claim test: removing only the call's timeout check leaves it green (the
#     invariant check refuses too); removing both makes it red with the late claim
#     returning `Ok(())`. File restored byte-identically.
#   * Live, on a real dev node (local CI run on the #518 merge head, 2026-09-28):
#     `X3-native lifecycles` PASS — lock -> finalized claim, timeout -> finalized refund,
