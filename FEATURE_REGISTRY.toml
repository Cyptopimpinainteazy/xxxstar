# Re-pointed 2026-09-28 (owner's decision). This row used to describe the orphan SVM
# program `X3-contracts/svm/programs/x3_htlc`, which no route calls; that evidence moved
# unchanged to `[svm_x3_htlc_program]` below. `x3_htlc` is now the X3 HTLC that runs on
# the chain: a leg on `ExternalChainId::X3Native` in `pallet-x3-settlement-engine`, where
# this pallet is the custodian (PR #520).
#
# What the code does (pallets/x3-settlement-engine/src/lib.rs):
#   * `lock_escrow` on an X3Native leg accepts only the depositor's own declared native
#     side, of `TokenId::Native`, at exactly the declared amount, once, and reserves it
#     with `T::Currency::reserve`.
#   * `claim_settlement` requires the SHA-256 preimage and refuses after the intent's
#     unix timeout (`TimeoutExpired`, checked in the call *and* again in
#     `check_settlement_invariants`) and after `SettlementTimeoutBlocks`; finalization
#     `repatriate_reserved`s the leg to the counterparty once every required domain has a
#     canonical Claim proof.
#   * `refund_settlement` needs the timeout plus canonical Refund proofs and `unreserve`s
#     the leg back to the depositor. Every native reserve is checked before anything moves
#     (`held_native_legs`), so a short reserve fails the whole call
#     (`NativeEscrowCustodyMismatch`) instead of settling some legs.
#   * `security/halt-fund-holding.toml` classifies `lock_escrow` as fund-holding,
#     recoverable by `refund_settlement`.
#
# Found and fixed 2026-09-28 while re-pointing this row: the lock checked the declared
# chain and amount but not the declared token, so a leg promising `X3Asset(7)` or a
# contract token was "locked" by reserving the same amount of native X3, and the
# counterparty would have been paid in a different asset than the intent named. The lock
# now also requires `TokenId::Native` (`a_native_leg_declaring_a_non_native_token_cannot_be_locked`,
# red before the fix with `Ok(())` where `InvalidAssetSpec` was expected). Custody of X3
# assets is not implemented; such a leg fails closed.
#
