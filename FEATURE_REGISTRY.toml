  "Advertised hardware capabilities remain self-declared and have no benchmark/attestation evidence binding a registered executor to the claimed hardware.",
  "Closed 2026-09-27 - the reactor places work deterministically, and its decisions are evidence. `crates/northern-swarm/src/reactor.rs` turns the release prompt's `TaskKind -> requirements -> scheduler -> CPU/GPU/NPU/FPGA` into code: a candidate must serve the kind, be available, clear the reputation floor and fit the cost/latency ceilings, and every rejection is reported with its numbers (`TooExpensive { got, limit }`, `ReputationTooLow { got, needed }`, ...). Eligibility is ordered by a documented total order - preference tier, then reputation desc, cost asc, latency asc, id asc - so two runs over the same inputs agree. `must_accelerate` disqualifies the CPU, and if that leaves nothing the reactor *refuses* (`ScheduleRefusal::AcceleratorUnavailable`, whose Display names every candidate's reason) instead of quietly running accelerator-only work on the reference, which is the optional-sidecar dependency turned into a typed refusal. `TaskExecutor::execute` now places before it runs, fails closed on a refusal, and records `backend_id` + `accelerator` in the `ProofBundle`, so an execution receipt says which backend ran the work. Seven reactor tests plus two executor tests; break-it-first: deleting the `AcceleratorRequired` disqualification reddens `accelerator_only_work_is_refused_when_no_accelerator_is_advertised` and `work_that_needs_an_accelerator_is_refused_by_an_accelerator_less_executor`, and the file was restored byte-identically.",
  "The reactor schedules over descriptors a node advertises in its own list, and those descriptors are still self-declared (availability, reputation, cost, latency are inputs, not measurements). Binding a descriptor to attested hardware is the same open item as the advertised-hardware blocker above."
]
dangerous_paths = [
  "pallets/northern-swarm",
  "crates/northern-swarm",
  "swarm rewards",
  "executor slashing",
  "executor signing keys",
  "gpu acceleration",
  "task settlement"
]

