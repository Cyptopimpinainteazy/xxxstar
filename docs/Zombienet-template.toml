# ─────────────────────────────────────────────────────────────────────────────
# Zombienet Network Configuration — X3 Multi-Node Staging Testnet
#
# This config defines an ephemeral N-validator testnet for CI and staging.
# Usage:
#   zombienet spawn docs/Zombienet-template.toml
#   zombienet test docs/Zombienet-template.toml path/to/smoke-test.zndsl
# ─────────────────────────────────────────────────────────────────────────────
[settings]
timeout = 600
provider = "native"  # "native" or "kubernetes"

[relaychain]
default_command = "./target/release/x3-chain-node"
# `chain` is either one of the node's built-in ids (`dev`, `local`, `local3`,
# `staging`, `testnet`, `production`) or a path. It used to name the checked-in
# spec as if it were an id, and no id of that spelling exists: the node falls
# through to `load_json_spec`, looks for a file called `x3-local3-raw` and dies
# with `Failed to read chain spec file x3-local3-raw`. It is a path.
chain = "chain-specs/x3-local3-current-raw.json"

[[relaychain.nodes]]
name = "alice"
validator = true

[[relaychain.nodes]]
name = "bob"
validator = true

[[relaychain.nodes]]
name = "charlie"
validator = true

[[relaychain.nodes]]
name = "dave"
validator = true

# ── Optional: add more validators for stress testing ─────────────────────
# [[relaychain.nodes]]
# name = "eve"
# validator = true

# [[relaychain.nodes]]
# name = "ferdi"
# validator = true

# [[relaychain.nodes]]
# name = "gavin"
# validator = true

# ── Built-in test definitions ────────────────────────────────────────────
# These are referenced by Zombienet test files (.zndsl)
[[tests]]
name = "finality-smoke"
script = "tests/zombienet/finality-smoke.zndsl"

[[tests]]
name = "block-production"
script = "tests/zombienet/block-production.zndsl"

[[tests]]
name = "runtime-upgrade-dry-run"
script = "tests/zombienet/runtime-upgrade-dry-run.zndsl"
