name: X3 Swarm TPS GPU Soak

on:
  workflow_dispatch:
    inputs:
      soak_secs:
        description: Sustained soak duration in seconds
        required: true
        default: "60"
      tasks_per_round:
        description: Swarm tasks per processing round
        required: true
        default: "128"
      batch_size:
        description: SHA256 inputs per swarm task
        required: true
        default: "1024"
      min_sliding_ratio:
        description: Minimum sliding TPS ratio versus local baseline
        required: true
        default: "0.80"
      min_hash_ratio:
        description: Minimum hash throughput ratio versus local baseline
        required: true
        default: "0.80"

jobs:
  wgpu-soak:
    name: wgpu 128x1024 sustained TPS soak
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    env:
      X3_ACCEL: wgpu
      X3_SWARM_SOAK_SECS: ${{ inputs.soak_secs }}
      X3_SWARM_SOAK_TASKS: ${{ inputs.tasks_per_round }}
      X3_SWARM_SOAK_BATCH: ${{ inputs.batch_size }}
      X3_MIN_SLIDING_RATIO: ${{ inputs.min_sliding_ratio }}
      X3_MIN_HASH_RATIO: ${{ inputs.min_hash_ratio }}
      X3_BASELINE_SLIDING_TPS: "58.5"
      X3_BASELINE_HASHES_PER_SEC: "63823.33"
      X3_SWARM_SOAK_OUT_DIR: target/swarm-tps-soak
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: swarm-tps-gpu-soak

      - name: Run sustained swarm TPS soak
        run: |
          chmod +x scripts/gpu/run_swarm_tps_soak_matrix.sh
          scripts/gpu/run_swarm_tps_soak_matrix.sh

      - name: Upload TPS soak artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-tps-gpu-soak
          path: target/swarm-tps-soak/
