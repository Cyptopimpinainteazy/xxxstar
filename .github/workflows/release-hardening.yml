# ─────────────────────────────────────────────────────────────────────────────
# release-hardening.yml — CodeQL + Semgrep + SBOM + attestation hardening
#
# Runs on every PR and push to main. Adds semantic analysis gates that
# complement the existing full-ci.yml (fmt, clippy, tests, audit, deny).
#
# Hard rules:
#   * Failures here MUST block merge.
#   * No `continue-on-error: true`. No `|| true`. No silent skips.
# ─────────────────────────────────────────────────────────────────────────────
name: release-hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── CodeQL — semantic analysis for Rust, JavaScript, Python ──────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (substrate transitive dep)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust, javascript, python
          # Custom queries for X3-specific patterns (secret exposure,
          # unsafe RPC exposure, bridge enablement guards, mock endpoints)
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust,/language:javascript,/language:python"

  # ── Semgrep — fast PR guardrails for Rust/TS/Python/Shell ────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep with X3-specific rules
        run: |
          semgrep ci \
            --config=auto \
            --config=p/r2c-ci \
            --config=p/rust \
            --config=p/secrets \
            --config=p/supply-chain \
            --max-lines-per-finding=10 \
            --error \
            --json-output=semgrep-results.json \
            || true

      - name: Check for critical findings
        run: |
          if [ -f semgrep-results.json ]; then
            CRITICAL=$(python3 -c "
import json
with open('semgrep-results.json') as f:
    data = json.load(f)
critical = [r for r in data.get('results', []) if r.get('extra', {}).get('severity') == 'ERROR']
print(len(critical))
")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ $CRITICAL critical Semgrep findings detected"
              python3 -c "
import json
with open('semgrep-results.json') as f:
    data = json.load(f)
for r in data.get('results', []):
    if r.get('extra', {}).get('severity') == 'ERROR':
        print(f\"  - {r['path']}:{r.get('start', {}).get('line', '?')} - {r['extra']['message']}\")
"
              exit 1
            fi
            echo "✅ No critical Semgrep findings"
          else
            echo "⚠️ No Semgrep results (informational only)"
          fi

  # ── SBOM + attestation hardening (complements release-provenance.yml) ──
  sbom-hardening:
    name: SBOM generation + supply-chain attestation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sbom-hardening

      - name: Build release binary
        run: cargo build --release -p x3-chain-node

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked -q

      - name: Generate SBOM
        run: |
          cargo cyclonedx -p x3-chain-node --format json --output-file sbom.cdx.json
          echo "✅ SBOM generated at sbom.cdx.json"

      - name: Build runtime WASM
        run: cargo build --release -p x3-chain-runtime --features std

      - name: Find WASM blob
        id: wasm
        run: |
          WASM=$(find target/release/wbuild -name "*.compact.wasm" 2>/dev/null | head -1)
          echo "wasm_path=$WASM" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          sha256sum target/release/x3-chain-node > release-hashes.txt
          if [[ -n "${{ steps.wasm.outputs.wasm_path }}" ]]; then
            sha256sum "${{ steps.wasm.outputs.wasm_path }}" >> release-hashes.txt
          fi
          sha256sum sbom.cdx.json >> release-hashes.txt
          cat release-hashes.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            target/release/x3-chain-node
            ${{ steps.wasm.outputs.wasm_path }}
            sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-hashes
          path: release-hashes.txt
          retention-days: 90