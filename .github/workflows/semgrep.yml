name: Semgrep

on:
  # Automatic GitHub Actions are disabled; local pre-push CI is the gate of record.
  workflow_dispatch:
concurrency:
  # Never cancel an in-flight default-branch run: a cancelled release gate proves
  # nothing, and with one self-hosted runner every new commit used to cancel the
  # previous gate before it finished. PR runs still cancel superseded pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Scan
    runs-on: [self-hosted, Linux, X64, x3]
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan
        run: |
          semgrep scan --config auto --sarif --output semgrep-results.sarif . || true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
