name: Test Integrity Enforcement

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  integrity-check:
    name: Test Integrity Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Validate pull-request integrity
        run: |
          python3 scripts_infrastructure/pr_supervisor.py --base origin/master

      - name: Run core test suite
        run: |
          echo "🧪 Running core test suite"
          cargo test --workspace --all-targets --all-features -- --quiet
