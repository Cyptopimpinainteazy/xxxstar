name: Test Integrity Enforcement

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]


concurrency:
  # Never cancel an in-flight default-branch run: a cancelled release gate proves
  # nothing, and with one self-hosted runner every new commit used to cancel the
  # previous gate before it finished. PR runs still cancel superseded pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integrity-check:
    name: Test Integrity Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run X3 Test Integrity Enforcement
        run: |
          echo "🔍 CI: running X3 test integrity enforcement"
          python3 scripts_infrastructure/enforce_x3_rules.py --base origin/main

      - name: Run core test suite
        run: |
          echo "🧪 Running core test suite"
          cargo test --workspace --all-targets --all-features -- --quiet
