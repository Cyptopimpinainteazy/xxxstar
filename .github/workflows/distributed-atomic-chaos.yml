name: distributed-atomic-chaos

on:
  # GitHub-hosted CI is disabled for this repo; run manually on the local x3 runner.
  workflow_dispatch:
jobs:
  chaos:
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 30

    services:
      valkey:
        image: valkey/valkey:8.1.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      X3_TEST_VALKEY_URL: redis://127.0.0.1:6379/
      X3_REQUIRE_VALKEY_TESTS: "1"
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build distributed chaos harness
        # `--locked`: the crate has its own committed lockfile (see
        # valkey-coordinator.yml for why).
        run: cargo test --locked --manifest-path crates/cross-vm-coordinator/Cargo.toml --features valkey,canonical-proofs --test distributed_chaos --no-run

      - name: Run distributed chaos matrix
        run: |
          set -euo pipefail
          for run in $(seq 1 10); do
            echo "=== chaos iteration $run/10 ==="
            cargo test --locked --manifest-path crates/cross-vm-coordinator/Cargo.toml --features valkey,canonical-proofs --test distributed_chaos -- --test-threads=6 --nocapture
          done
