name: x3vm-evm-live-lifecycle

# Real anvil lifecycle gates for the EVM HTLC contract at
# X3-contracts/evm/contracts/AtlasHTLC.sol. These jobs build/deploy the actual
# contract and execute real signed local-chain transactions; they are not mocks.

on:
  push:
    branches: [master]
    paths:
      - "X3-contracts/evm/**"
      - "crates/x3-atomic-swap/**"
      - "node/**"
      - ".github/workflows/x3vm-evm-live-lifecycle.yml"
  pull_request:
    branches: [master]
    paths:
      - "X3-contracts/evm/**"
      - "crates/x3-atomic-swap/**"
      - "node/**"
      - ".github/workflows/x3vm-evm-live-lifecycle.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live-lifecycle:
    name: EVM HTLC live anvil lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: evm-live-lifecycle

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge dependencies (pinned via foundry.lock)
        working-directory: X3-contracts/evm
        run: |
          set -euo pipefail
          FORGE_STD_TAG="$(python3 -c "import json; print(json.load(open('foundry.lock'))['lib/forge-std']['tag']['name'])")"
          OZ_TAG="$(python3 -c "import json; print(json.load(open('foundry.lock'))['lib/openzeppelin-contracts']['tag']['name'])")"
          forge install "foundry-rs/forge-std@${FORGE_STD_TAG}" --no-commit
          forge install "OpenZeppelin/openzeppelin-contracts@${OZ_TAG}" --no-commit

      - name: Build x3-evm-broadcast
        run: cargo build --release -p x3-atomic-swap --features std --bin x3-evm-broadcast

      - name: Run real anvil HTLC lifecycle gate
        run: ./X3-contracts/evm/test-live-lifecycle.sh

  live-x3vm-evm:
    name: real X3VM to Anvil lock claim lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler clang cmake jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x3vm-evm-live-lifecycle

      - name: Build AtlasHTLC
        working-directory: X3-contracts/evm
        run: forge build --contracts contracts/AtlasHTLC.sol

      - name: Start Anvil and deploy AtlasHTLC
        shell: bash
        run: |
          set -euo pipefail
          anvil --port 18545 --chain-id 1337 --block-time 1 > /tmp/x3-anvil.log 2>&1 &
          echo $! > /tmp/x3-anvil.pid

          for i in $(seq 1 60); do
            if cast chain-id --rpc-url http://127.0.0.1:18545 >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          cast chain-id --rpc-url http://127.0.0.1:18545 >/dev/null

          mapfile -t KEYS < <(grep -oE '0x[0-9a-fA-F]{64}' /tmp/x3-anvil.log | head -2)
          test "${#KEYS[@]}" -eq 2
          LOCKER_KEY="${KEYS[0]}"
          CLAIMANT_KEY="${KEYS[1]}"
          echo "::add-mask::$LOCKER_KEY"
          echo "::add-mask::$CLAIMANT_KEY"

          DEPLOY_OUTPUT=$(cd X3-contracts/evm && forge create \
            --broadcast \
            --private-key "$LOCKER_KEY" \
            --rpc-url http://127.0.0.1:18545 \
            contracts/AtlasHTLC.sol:AtlasHTLC)
          CONTRACT=$(printf '%s\n' "$DEPLOY_OUTPUT" | awk '/Deployed to:/ {print $3; exit}')
          test -n "$CONTRACT"

          echo "X3_TEST_EVM_HTLC=$CONTRACT" >> "$GITHUB_ENV"
          echo "X3_TEST_EVM_LOCKER_KEY=$LOCKER_KEY" >> "$GITHUB_ENV"
          echo "X3_TEST_EVM_CLAIMANT_KEY=$CLAIMANT_KEY" >> "$GITHUB_ENV"

      - name: Run live X3VM EVM lifecycle
        run: |
          env -u SKIP_WASM_BUILD cargo test -p x3-chain-node \
            --test x3vm_evm_live \
            real_x3vm_evm_lock_claim_atomic_lifecycle \
            -- --ignored --nocapture

      - name: Stop Anvil
        if: always()
        run: |
          if [ -f /tmp/x3-anvil.pid ]; then
            kill "$(cat /tmp/x3-anvil.pid)" 2>/dev/null || true
          fi
