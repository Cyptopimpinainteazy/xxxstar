name: security-audit

on:
  # GitHub-hosted CI is disabled for this repo; run manually on the local x3 runner.
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, x3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build release node for real-chain tests
        run: cargo build --release -p x3-chain-node --features mainnet-rc1
      - name: Audit
        run: make audit
