name: security-audit

on:
  pull_request:
  schedule:
    - cron: '0 4 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      X3_NODE_BIN: ${{ github.workspace }}/target/release/x3-chain-node
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build validated node for real-chain audit
        run: cargo build --release -p x3-chain-node
      - name: Audit
        run: make audit
