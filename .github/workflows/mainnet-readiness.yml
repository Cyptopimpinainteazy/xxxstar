name: mainnet-readiness

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mainnet gate
        run: make mainnet-check
      - name: Fresh machine gate
        run: make fresh-machine-check
