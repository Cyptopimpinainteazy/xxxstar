name: mainnet-readiness

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Secret scan + placeholder verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install trufflehog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.82.2/trufflehog_3.82.2_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog

      - name: Scan for secrets
        run: |
          trufflehog filesystem --no-verification . 2>&1 | tee trufflehog-output.txt || true
          if grep -q "Secret" trufflehog-output.txt 2>/dev/null; then
            echo "❌ SECRETS DETECTED"
            cat trufflehog-output.txt
            exit 1
          fi
          echo "✅ No secrets detected"

      - name: Verify key files are placeholders only
        run: |
          if grep -q "REPLACED_RUN_KEY_ROTATION_SCRIPT\|REPLACE_ME" deployment/keys/bootnode-keys.json deployment/keys/bootnode-node-key; then
            echo "✅ Key files are placeholders only"
          else
            echo "❌ Key files may contain real material — check deployment/keys/"
            exit 1
          fi

  cargo-audit:
    name: Cargo audit (dependency vulns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked -q

      - name: Run cargo audit
        run: cargo audit

  cargo-deny:
    name: Cargo deny (license + ban + advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify deny.toml exists
        run: test -f deny.toml && echo "✅ deny.toml exists"

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked -q

      - name: Run cargo deny check
        run: cargo deny check

  readiness:
    runs-on: ubuntu-latest
    needs: [secret-scan, cargo-audit, cargo-deny]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Mainnet gate
        run: make mainnet-check
      - name: Fresh machine gate
        run: make fresh-machine-check
      - name: Compute release hashes
        id: hashes
        run: |
          if [ -f target/release/x3-chain-node ]; then
            sha256sum target/release/x3-chain-node > release_hashes.txt
          fi
          if [ -f target/release/wbuild/x3-chain-runtime/x3_chain_runtime.compact.compressed.wasm ]; then
            sha256sum target/release/wbuild/x3-chain-runtime/x3_chain_runtime.compact.compressed.wasm >> release_hashes.txt
          fi
          for spec in chain-specs/*.json; do
            [ -f "$spec" ] && sha256sum "$spec" >> release_hashes.txt
          done
          cat release_hashes.txt
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            target/release/x3-chain-node
            target/release/wbuild/x3-chain-runtime/x3_chain_runtime.compact.compressed.wasm
            chain-specs/*.json
            release_hashes.txt
          retention-days: 90