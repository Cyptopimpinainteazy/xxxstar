name: mainnet-readiness

on:
  # GitHub-hosted CI is disabled for this repo; run manually on the local x3 runner.
  workflow_dispatch:
jobs:
  secret-scan:
    name: Secret scan + placeholder verification
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install trufflehog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.82.2/trufflehog_3.82.2_linux_amd64.tar.gz -o /tmp/trufflehog.tar.gz
          echo "b4360a24078d17be78353d3eaf78329f67f10d15a3eef4c5cbf775bd79e0b0a4  /tmp/trufflehog.tar.gz" | sha256sum -c -
          tar xzf /tmp/trufflehog.tar.gz -C /usr/local/bin trufflehog
          rm -f /tmp/trufflehog.tar.gz

      - name: Scan for secrets
        run: |
          trufflehog filesystem --no-verification . 2>&1 | tee trufflehog-output.txt || true
          if grep -q "Secret" trufflehog-output.txt 2>/dev/null; then
            echo "❌ SECRETS DETECTED"
            cat trufflehog-output.txt
            exit 1
          fi
          echo "✅ No secrets detected"

      - name: Verify key files are placeholders only
        run: |
          test -f deployment/keys/README.md
          ! find deployment/keys -type f ! -name README.md ! -name bootnode-info.txt -print -quit | grep -q .
          echo "✅ Deployment key directory contains no private key material"

  cargo-audit:
    name: Cargo audit (dependency vulns)
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked -q

      - name: Run cargo audit
        run: cargo audit

  cargo-deny:
    name: Cargo deny (license + ban + advisory)
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify deny.toml exists
        run: test -f deny.toml && echo "✅ deny.toml exists"

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked -q

      - name: Run cargo deny check
        run: cargo deny check

  readiness-consistency:
    runs-on: [self-hosted, Linux, X64, x3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run readiness consistency check
        run: |
          chmod +x scripts/check-readiness-consistency.sh
          scripts/check-readiness-consistency.sh

  readiness:
    # No pull_request trigger on this workflow (push to master/release + manual
    # dispatch only), so routing the heavy job to the x3 self-hosted runner
    # carries no untrusted-code exposure. The lightweight jobs above stay on
    # ubuntu-latest so they don't queue behind this on the single x3 machine.
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 60
    needs: [secret-scan, cargo-audit, cargo-deny, readiness-consistency]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install protoc
        # x3star1 already provides protoc via linuxbrew and has no
        # passwordless sudo, so this install step only runs on GitHub-hosted.
        if: runner.environment == 'github-hosted'
        run: |
          curl -sSfL https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip -o /tmp/protoc.zip
          echo "f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          rm -f /tmp/protoc.zip
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown, wasm32v1-none
      - name: Readiness consistency check
        run: |
          chmod +x scripts/check-readiness-consistency.sh
          scripts/check-readiness-consistency.sh
      - name: Mainnet gate
        run: make mainnet-check
      - name: Fresh machine gate
        run: make fresh-machine-check
      - name: Compute release hashes
        id: hashes
        run: |
          if [ -f target/release/x3-chain-node ]; then
            sha256sum target/release/x3-chain-node > release_hashes.txt
          fi
          if [ -f target/release/wbuild/x3-chain-runtime/x3_chain_runtime.compact.compressed.wasm ]; then
            sha256sum target/release/wbuild/x3-chain-runtime/x3_chain_runtime.compact.compressed.wasm >> release_hashes.txt
          fi
          for spec in chain-specs/*.json; do
            [ -f "$spec" ] && sha256sum "$spec" >> release_hashes.txt
          done
          cat release_hashes.txt
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            target/release/x3-chain-node
            target/release/wbuild/x3-chain-runtime/x3_chain_runtime.compact.compressed.wasm
            chain-specs/*.json
            release_hashes.txt
          retention-days: 90
