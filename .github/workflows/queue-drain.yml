name: X3 CI Queue Inspection

# Former queue drain cancelled every PR run except obsolete hard-coded PRs.
# Replaced by a read-only diagnostic; no API writes or cancellation permission.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/queue-drain.yml'
      - 'scripts/ci/queue_audit.py'
      - 'scripts/ci/test_queue_audit.py'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: x3-ci-queue-inspection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    # Never run code submitted by fork PRs on physical self-hosted CI runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject stale/unknown and never authorize cancellation
        run: python3 -m unittest discover -s scripts/ci -p 'test_queue_audit.py' -v

  inspect-queue:
    # Only the protected default branch can inspect live registry state.
    # No auto-run on push, and never act on data from arbitrary PR code.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: [unit-tests]
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect queued and running pull-request workflows without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/queue_audit.py --live --output "${RUNNER_TEMP}/x3-queue-audit.json" > /dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "x3-queue-audit.json").read_text())
          assert report["cancel_authorized"] is False
          assert report["release_authorized"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## X3 Actions queue inspection (read-only)\n\n")
              summary.write(f"Open PRs: {report['open_pr_count']}; observed queued/in-progress PR runs: {report['pending_run_count']}\n\n")
              for state, count in report["counts"].items():
                  summary.write(f"- {state}: {count}\n")
              summary.write("\nNo runs were cancelled, retried, or approved. Review candidates manually against exact PR heads.\n")
          PY
