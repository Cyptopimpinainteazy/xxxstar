name: Deploy Dashboard to GitHub Pages

on:
  # GitHub-hosted CI is disabled for this repo; run manually on the local x3 runner.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-dashboard:
    runs-on: [self-hosted, Linux, X64, x3]
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.70
      
      - name: ⚡ Cache Rust build
        uses: Swatinem/rust-cache@v2
      
      - name: 🔨 Build proof binary
        run: cargo build -p x3-proof --release
      
      - name: 📊 Generate dashboard
        run: |
          mkdir -p public
          ./scripts/publish-dashboard.sh public
          echo "Dashboard generated at public/index.html"
      
      - name: 📋 Copy metrics to public
        run: |
          # The repository-root proof-score.json was a fabricated success artifact:
          # "Good / A- / 0.92" while recording `compile_checks_pass: false` and zero
          # tests of every kind, because `x3-proof dashboard` used to write a
          # constant score. It has been deleted, and this step refuses to publish
          # one if it comes back. Only what publish-dashboard.sh just generated for
          # this job is served.
          if [ -f proof-score.json ]; then
            echo "::error::stale repository-root proof-score.json present; refusing to publish"
            exit 1
          fi
          [ -f dashboard/proof-score.json ] && cp dashboard/proof-score.json public/ || true
          ls -lah public/
      
      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v3
      
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'public'
      
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
      
      - name: ✅ Deployment complete
        run: |
          echo "Dashboard deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "Auto-refresh available in: ${{ steps.deployment.outputs.page_url }}/index.html"

  notify-deployment:
    runs-on: [self-hosted, Linux, X64, x3]
    needs: generate-dashboard
    if: always()
    
    steps:
      - name: 📢 Log deployment status
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Dashboard deployment successful"
            echo "Dashboard URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            echo "❌ Dashboard deployment failed"
          fi
