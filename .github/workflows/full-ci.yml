# Full repository CI — fmt + clippy + workspace tests + proof gates + E2E.
#
# This workflow complements the focused v0.4 ship gate (`v04-ship-gate.yml`)
# by running the full workspace surface. The ship gate fails fast on the
# critical path; this workflow catches regressions anywhere in the tree.
#
# Hard rules:
#   * Failures here MUST block merge.
#   * No `continue-on-error: true`. No `|| true`. No silent skips.
#   * fmt + clippy are deny-warnings across the entire workspace.

name: full ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ───── SECRET SCANNING — first gate, fastest ───────────────────────────
  secret-scan:
    name: secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install trufflehog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.82.2/trufflehog_3.82.2_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog

      - name: Scan for secrets
        run: |
          trufflehog filesystem --no-verification . 2>&1 | tee trufflehog-output.txt || true
          if grep -q "Secret" trufflehog-output.txt 2>/dev/null; then
            echo "❌ SECRETS DETECTED"
            cat trufflehog-output.txt
            exit 1
          fi
          echo "✅ No secrets detected"

      - name: Verify key files are placeholders only
        run: |
          if grep -q "REPLACED_RUN_KEY_ROTATION_SCRIPT\|REPLACE_ME" deployment/keys/bootnode-keys.json deployment/keys/bootnode-node-key; then
            echo "✅ Key files are placeholders only"
          else
            echo "❌ Key files may contain real material — check deployment/keys/"
            exit 1
          fi

  # ───── CARGO AUDIT — dependency vulnerability check ──────────────────
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked -q

      - name: Run cargo audit
        run: cargo audit

  # ───── CARGO DENY — license + ban check ────────────────────────────
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify deny.toml exists
        run: test -f deny.toml && echo "✅ deny.toml exists"

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked -q

      - name: Run cargo deny check
        run: cargo deny check

  # ──────────────────────────────────────────────────────────────────────────
  # 1. fmt + clippy (workspace, deny warnings) — fast feedback, blocks rest.
  # ──────────────────────────────────────────────────────────────────────────
  fmt-clippy:
    name: fmt + clippy (workspace, deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [secret-scan, cargo-audit, cargo-deny]
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (substrate transitive dep)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-ci-fmt-clippy

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  workspace-tests:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (substrate transitive dep)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-ci-tests

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

  proof-gates:
    name: launch-gates/run-all-proofs.sh
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-ci-proofs

      - name: Run all proof-forge gates
        run: bash launch-gates/run-all-proofs.sh

      - name: Upload generated receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-receipts
          path: proof/receipts/
          if-no-files-found: warn

      - name: Upload go/no-go report (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-no-go-report
          path: launch-gates/reports/
          if-no-files-found: ignore

  swarm-ci:
    name: x3-swarm — unit tests + self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt-clippy]
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites (jq, curl, python3)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-ci-swarm

      - name: cargo test -p x3-swarm-core
        run: cargo test -p x3-swarm-core --all-targets

      - name: Build swarm binaries (API + worker)
        run: |
          cargo build -p x3-swarm-api   --release
          cargo build -p x3-swarm-worker --release

      - name: swarm self-test (end-to-end)
        timeout-minutes: 10
        run: |
          SWARM_KILL_SWITCH_TOKEN=ci-test \
            ./target/release/x3-swarm-api &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8787/health && break
            sleep 1
          done

          bash scripts/swarm/swarm_self_test.sh

  e2e-unit:
    name: e2e — unit-style (fast, no node required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt-clippy]
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-ci-e2e-unit

      - name: cargo test e2e unit-style (internal_mainnet_happy_path)
        run: |
          cargo test -p e2e_tests --test internal_mainnet_happy_path -- --nocapture

      - name: cargo test e2e unit-style (mainnet_rc1)
        run: |
          cargo test -p e2e_tests --test mainnet_rc1 -- --nocapture

  e2e-live-node:
    name: e2e — live node (mandatory, boots ephemeral node)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [fmt-clippy]
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-ci-e2e-live

      - name: Build release node binary
        run: |
          cargo build --release -p x3-chain-node

      - name: cargo test — live_internal_mainnet_e2e (boots ephemeral node)
        run: |
          cargo test -p e2e_tests --test live_internal_mainnet_e2e -- --nocapture

      - name: cargo test — cross_vm_real_chain_test (boots ephemeral node)
        run: |
          cargo test -p e2e_tests --test cross_vm_real_chain_test -- --nocapture

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-node-logs
          path: chain-specs/*.json
          retention-days: 7