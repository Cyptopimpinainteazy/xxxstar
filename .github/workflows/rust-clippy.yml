name: Rust Clippy

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rust-src
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run Clippy (workspace all features except incompatible modes)
        run: cargo clippy --workspace --all-targets --all-features --exclude x3-verification-router --exclude pallet-x3-cross-vm-router -- -D warnings

      # `production` and `test-verifier` are intentionally incompatible:
      # production must never compile a test verifier. Check both valid
      # configurations independently rather than disabling that fail-closed
      # compile-time guard with a workspace-wide --all-features invocation.
      - name: Run Clippy (verification router production)
        run: cargo clippy -p x3-verification-router --all-targets --features production -- -D warnings

      - name: Run Clippy (verification router test verifier)
        run: cargo clippy -p x3-verification-router --all-targets --features test-verifier -- -D warnings

      # RC-1 and post-RC-1 router features are intentionally incompatible. Validate
      # each legal feature set rather than disabling the compile-time scope lock.
      - name: Run Clippy (cross-VM router RC-1)
        run: cargo clippy -p pallet-x3-cross-vm-router --all-targets --no-default-features --features std,mainnet-rc1 -- -D warnings

      - name: Run Clippy (cross-VM router post-RC-1 features)
        run: |
          for feature in external-gateway parallel-executor appzone-factory pq-experimental advanced-dex ai-optimizer gpu-acceleration; do
            cargo clippy -p pallet-x3-cross-vm-router --all-targets --no-default-features --features "std,${feature}" -- -D warnings
          done