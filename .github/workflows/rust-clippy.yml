name: Rust Clippy

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rust-src
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Frontier is deliberately post-RC1 and currently incompatible with the
      # pinned stable2512 FRAME API. Do not combine it with the RC1 runtime
      # through workspace --all-features; lint the supported runtime/node
      # configurations separately below.
      - name: Run Clippy (workspace all features except incompatible modes)
        run: cargo clippy --workspace --all-targets --all-features --exclude x3-verification-router --exclude pallet-x3-cross-vm-router --exclude x3-chain-runtime --exclude x3-chain-node -- -D warnings

      - name: Run Clippy (runtime RC-1)
        run: cargo clippy -p x3-chain-runtime --all-targets --no-default-features --features std,mainnet-rc1 -- -D warnings

      - name: Run Clippy (node RC-1)
        run: cargo clippy -p x3-chain-node --all-targets --features mainnet-rc1 -- -D warnings

      - name: Run Clippy (node runtime benchmarks)
        run: cargo clippy -p x3-chain-node --all-targets --features mainnet-rc1,runtime-benchmarks -- -D warnings

      - name: Run Clippy (node try-runtime)
        run: cargo clippy -p x3-chain-node --all-targets --features mainnet-rc1,try-runtime -- -D warnings

      - name: Run Clippy (node GPU validator)
        run: cargo clippy -p x3-chain-node --all-targets --features mainnet-rc1,gpu-validator -- -D warnings

      # `production` and `test-verifier` are intentionally incompatible:
      # production must never compile a test verifier. Check both valid
      # configurations independently rather than disabling that fail-closed
      # compile-time guard with a workspace-wide --all-features invocation.
      - name: Run Clippy (verification router production)
        run: cargo clippy -p x3-verification-router --all-targets --features production -- -D warnings

      - name: Run Clippy (verification router test verifier)
        run: cargo clippy -p x3-verification-router --all-targets --features test-verifier -- -D warnings

      # RC-1 and post-RC-1 router features are intentionally incompatible.
      - name: Run Clippy (cross-VM router RC-1)
        run: cargo clippy -p pallet-x3-cross-vm-router --all-targets --no-default-features --features std,mainnet-rc1 -- -D warnings

      - name: Run Clippy (cross-VM router runtime benchmarks)
        run: cargo clippy -p pallet-x3-cross-vm-router --all-targets --no-default-features --features std,mainnet-rc1,runtime-benchmarks -- -D warnings

      - name: Run Clippy (cross-VM router try-runtime)
        run: cargo clippy -p pallet-x3-cross-vm-router --all-targets --no-default-features --features std,mainnet-rc1,try-runtime -- -D warnings