name: PR Supervisor Gate

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  supervisor:
    name: PR Supervisor Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR Supervisor enforcement
        run: |
          echo "🔎 PR Supervisor: checking PR diff and test integrity"
          python3 scripts_infrastructure/pr_supervisor.py --base origin/main
