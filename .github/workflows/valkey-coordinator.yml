name: valkey-coordinator

on:
  # Automatic GitHub Actions are disabled; local pre-push CI is the gate of record.
  workflow_dispatch:
jobs:
  live-valkey:
    runs-on: [self-hosted, Linux, X64, x3]
    services:
      valkey:
        image: valkey/valkey:8.1.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      X3_TEST_VALKEY_URL: redis://127.0.0.1:6379/
      X3_REQUIRE_VALKEY_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0

      - name: Test coordinator + Valkey + canonical proofs
        # `--locked` uses the crate's committed Cargo.lock: this crate sits
        # outside the workspace, so without it cargo re-resolves its own graph
        # on every run and a dependency bump can change the build silently.
        run: cargo test --locked --manifest-path crates/cross-vm-coordinator/Cargo.toml --features valkey,canonical-proofs -- --nocapture
