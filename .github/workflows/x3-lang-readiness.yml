name: x3-lang-readiness

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/x3-*/**"
      - "crates/evm-integration/**"
      - "crates/svm-integration/**"
      - "patches/**"
      - "vendor/**"
      - "x3-lang/**"
      - ".github/workflows/x3-lang-readiness.yml"
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/x3-*/**"
      - "crates/evm-integration/**"
      - "crates/svm-integration/**"
      - "patches/**"
      - "vendor/**"
      - "x3-lang/**"
      - ".github/workflows/x3-lang-readiness.yml"

jobs:
  x3_lang_combined_gate:
    name: x3-lang + vm + evm + svm combined gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare artifact directory
        run: |
          mkdir -p artifacts/readiness

      - name: Capture production dependency lineage snapshot
        run: |
          cargo tree -p x3-svm-integration --edges normal > artifacts/readiness/lineage-tree.txt
          cargo tree -p x3-svm-integration --edges normal --duplicates > artifacts/readiness/lineage-duplicates.txt

      # solana-program-test is an intentional test-only dependency. This gate
      # protects the executable production graph, where these versions are
      # incompatible with the supported SVM dependency lineage.
      - name: Fail on production Solana lineage regressions
        run: |
          # Solana 3.0.0 legitimately depends on modular leaf crates whose
          # independent semver is already v4 (for example solana-hash and
          # solana-pubkey). Gate the compatibility boundary we actually own:
          # the program/SDK/test stack must remain on v3, and the known-bad
          # solana-address 2.5.0 lineage must remain absent.
          if grep -E "solana-(program|sdk|program-test) v4\\.|solana-address v2\\.5\\.0" artifacts/readiness/lineage-tree.txt; then
            echo "Detected forbidden Solana compatibility-line regression in SVM dependency graph"
            exit 1
          fi

          grep -q "solana-program v3\\.0\\.0" artifacts/readiness/lineage-tree.txt || {
            echo "Expected pinned solana-program v3.0.0 lineage is missing"
            exit 1
          }
          grep -q "solana-sdk v3\\.0\\.0" artifacts/readiness/lineage-tree.txt || {
            echo "Expected pinned solana-sdk v3.0.0 lineage is missing"
            exit 1
          }
          grep -q "solana-program-test v3\\.0\\.0" artifacts/readiness/lineage-tree.txt || {
            echo "Expected pinned solana-program-test v3.0.0 lineage is missing"
            exit 1
          }

      - name: Combined gate run #1
        run: |
          cargo test -p x3-parser -p x3-typeck -p x3-opt -p x3-verifier -p x3-compiler --all-targets 2>&1 | tee artifacts/readiness/run-1-core.log
          cargo test -p x3-vm -p x3-evm-integration --all-targets 2>&1 | tee artifacts/readiness/run-1-vm-evm.log
          cargo test -p x3-svm-integration --all-targets 2>&1 | tee artifacts/readiness/run-1-svm.log

      - name: Combined gate run #2 (stability repeat)
        run: |
          cargo test -p x3-parser -p x3-typeck -p x3-opt -p x3-verifier -p x3-compiler --all-targets 2>&1 | tee artifacts/readiness/run-2-core.log
          cargo test -p x3-vm -p x3-evm-integration --all-targets 2>&1 | tee artifacts/readiness/run-2-vm-evm.log
          cargo test -p x3-svm-integration --all-targets 2>&1 | tee artifacts/readiness/run-2-svm.log

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x3-lang-readiness-artifacts
          path: |
            artifacts/readiness/**
            reports/rc3/x3-lang-readiness-rerun-2026-05-23-source-evidence.md
            Cargo.toml
            Cargo.lock
