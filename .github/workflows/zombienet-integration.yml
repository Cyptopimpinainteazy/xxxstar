# ─────────────────────────────────────────────────────────────────────────────
# zombienet-integration.yml — Zombienet Multi-Node Integration Tests
#
# Spawns an ephemeral N-validator testnet and runs smoke tests.
# Validates block production, finality, peer connectivity, and runtime health.
#
# Prerequisites:
#   - Zombienet CLI installed
#   - Release node binary built
# ─────────────────────────────────────────────────────────────────────────────
name: x3 zombienet integration

on:
  # Automatic GitHub Actions are disabled; local pre-push CI is the gate of record.
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"


concurrency:
  # Never cancel an in-flight default-branch run: a cancelled release gate proves
  # nothing, and with one self-hosted runner every new commit used to cancel the
  # previous gate before it finished. PR runs still cancel superseded pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zombienet-smoke:
    name: 4-validator smoke (finality + block production)
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zombienet-node

      - name: Build release node binary
        run: cargo build --release -p x3-chain-node

      - name: Verify binary
        run: test -x target/release/x3-chain-node

      - name: Setup Zombienet
        run: |
          npm install -g @zombienet/cli
          zombienet --version

      - name: Generate chain spec for testing
        run: |
          # `x3-local3-raw` is a file, not a chain id: the node resolves ids from a
          # fixed list (`dev`, `local`, `local3`, `staging`, `testnet`,
          # `production`) and treats anything else as a path. Naming the file as an
          # id made this step fail with "Failed to read chain spec file
          # x3-local3-raw". This exercises the checked-in spec the network below
          # actually runs.
          ./target/release/x3-chain-node build-spec \
            --chain chain-specs/x3-local3-current-raw.json \
            --raw > /tmp/x3-test-chain-spec.json

      - name: Run Zombienet smoke tests
        run: |
          zombienet test \
            --provider native \
            tests/zombienet/finality-smoke.zndsl \
            2>&1 | tee zombienet-output.txt

      - name: Upload Zombienet logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zombienet-logs
          path: zombienet-output.txt
          retention-days: 7
