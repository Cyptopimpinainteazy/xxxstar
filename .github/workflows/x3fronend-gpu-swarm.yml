name: X3 Dashboard CI

on:
  push:
    branches:
      - master
      - develop
      - 'sprint-*'
  pull_request:
    branches:
      - master
      - develop
      - 'sprint-*'
  workflow_dispatch:

jobs:
  frontend-build:
    name: Build X3 Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Build frontend assets
        working-directory: apps/dashboard
        run: npm run build

  gpu-swarm-gate:
    name: GPU Swarm Gate
    if: github.event_name == 'workflow_dispatch'
    needs: frontend-build
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target
          cache-all-crates: true

      - name: Build CUDA kernels
        run: |
          cd infra-structure/validator/kernels
          chmod +x build.sh
          ./build.sh
        env:
          GPU_ARCH: sm_61

      - name: Run GPU validator swarm determinism gate
        run: |
          chmod +x scripts/test-gpu-cpu-determinism-benchmark-gate.sh
          ./scripts/test-gpu-cpu-determinism-benchmark-gate.sh
