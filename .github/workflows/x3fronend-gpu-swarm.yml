name: X3 Fronend + GPU Swarm CI

on:
  # Automatic GitHub Actions are disabled; local pre-push CI is the gate of record.
  workflow_dispatch:
concurrency:
  # Never cancel an in-flight default-branch run: a cancelled release gate proves
  # nothing, and with one self-hosted runner every new commit used to cancel the
  # previous gate before it finished. PR runs still cancel superseded pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-build:
    name: Build X3 Fronend
    runs-on: [self-hosted, Linux, X64, x3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          cd x3fronend
          npm ci

      - name: Build frontend assets
        run: |
          cd x3fronend
          npm run build

  gpu-swarm-gate:
    name: GPU Swarm Gate
    needs: frontend-build
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target
          cache-all-crates: true

      - name: Build CUDA kernels
        run: |
          cd infra-structure/validator/kernels
          chmod +x build.sh
          ./build.sh
        env:
          GPU_ARCH: sm_61

      - name: Run GPU validator swarm determinism gate
        run: |
          chmod +x scripts/test-gpu-cpu-determinism-benchmark-gate.sh
          ./scripts/test-gpu-cpu-determinism-benchmark-gate.sh
