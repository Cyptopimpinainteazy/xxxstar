name: Deploy Transparency Portal

on:
  # GitHub-hosted CI is disabled for this repo; run manually on the local x3 runner.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: transparency-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}/transparency/
    runs-on: [self-hosted, Linux, X64, x3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install portal dependencies
        working-directory: apps/x3-transparency
        run: npm install --ignore-scripts
      - name: Build committed portal evidence
        working-directory: apps/x3-transparency
        env:
          VITE_BASE_PATH: /xxxstar/transparency/
        run: npm run build:static
      - name: Package GitHub Pages site
        run: |
          mkdir -p _site/transparency
          cp -R apps/x3-transparency/dist/. _site/transparency/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
