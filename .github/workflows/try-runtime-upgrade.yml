# ─────────────────────────────────────────────────────────────────────────────
# try-runtime-upgrade.yml — Runtime Upgrade Rehearsal Pipeline
#
# The standalone try-runtime CLI was removed from the pinned Polkadot SDK.
# This workflow remains available for an explicit future integration but must
# not report a fictitious PR gate until a compatible state-replay runner exists.
#
# Usage:
#   Triggers automatically on PRs that modify runtime/
#   Can also be triggered manually to rehearse against specific snapshot.
# ─────────────────────────────────────────────────────────────────────────────
name: x3 try-runtime upgrade

on:
  pull_request:
    branches: [master]
    paths:
      - "runtime/**"
      - "pallets/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [master, 'release/**']
    paths:
      - "runtime/**"
      - "pallets/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: "URL to chain state snapshot (leave empty for auto)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  unavailable:
    name: try-runtime runner availability
    runs-on: ubuntu-latest
    steps:
      - name: Explain unavailable validation
        run: |
          echo "The standalone try-runtime CLI is unavailable in Polkadot SDK stable2512."
          echo "No upgrade-state validation was performed."
          exit 1
