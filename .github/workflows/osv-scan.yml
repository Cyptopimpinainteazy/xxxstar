name: OSV-Scan

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 7 * * 1'  # Weekly on Monday at 7 AM UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install osv-scanner
        run: |
          curl --fail --location --retry 3 \
            -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner

      - name: Run OSV Scanner
        run: osv-scanner scan --format sarif --output osv-results.sarif . || true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('osv-results.sarif') != ''
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner