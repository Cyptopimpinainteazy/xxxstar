name: OSV-Scan

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 7 * * 1'

jobs:
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
