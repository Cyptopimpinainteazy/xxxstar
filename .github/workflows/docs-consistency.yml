name: docs-consistency

on:
  pull_request:
    paths:
      - '.ai/SESSION_UPDATE_SUMMARY_*.md'
      - '.prompt.md'
      - '.agent.md'
      - '.instructions.md'
      - '.github/prompts/**'
      - 'tools/docs/**'
      - '**/*.md'
  push:
    branches:
      - main
      - master
    paths:
      - '.ai/SESSION_UPDATE_SUMMARY_*.md'
      - '.prompt.md'
      - '.agent.md'
      - '.instructions.md'
      - '.github/prompts/**'
      - 'tools/docs/**'
      - '**/*.md'


concurrency:
  # Never cancel an in-flight default-branch run: a cancelled release gate proves
  # nothing, and with one self-hosted runner every new commit used to cancel the
  # previous gate before it finished. PR runs still cancel superseded pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-session-summary-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run session summary format checks
        run: |
          chmod +x tools/docs/check-session-summary.sh
          tools/docs/check-session-summary.sh

  readiness-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run readiness consistency check
        run: |
          chmod +x scripts/check-readiness-consistency.sh
          scripts/check-readiness-consistency.sh
