name: x3 bridge fixture regeneration

on:
  pull_request:
    paths:
      - ".github/workflows/x3-bridge-fixture-regeneration.yml"
      - "docs/x3-lang/bridge-proof-schema.md"
      - "docs/x3-lang/fixtures/**"
      - "scripts/proof/generate_eth_bridge_fixture.py"
      - "x3-lang/**"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/x3-bridge-fixture-regeneration.yml"
      - "docs/x3-lang/bridge-proof-schema.md"
      - "docs/x3-lang/fixtures/**"
      - "scripts/proof/generate_eth_bridge_fixture.py"
      - "x3-lang/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ethereum_receipt_archive_regeneration:
    name: Regenerate Ethereum receipt-trie archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang

      - name: Rebuild and validate pinned block 17000000 archives
        run: |
          set -euo pipefail
          mkdir -p artifacts/ethereum-receipt-archives
          INPUT="docs/x3-lang/fixtures/ethereum-full-block-receipts/mainnet-17000000-receipts.json"
          for TX in \
            0x0c0093106cb919958037a68aa3ce785a4c9a8ff430f4e49fd0c32a6348ee1c46 \
            0x3b72731ebb4192b8307641d480078ffaaa362402f11ee491022ee5fb0672db02 \
            0xa278205118a242c87943b9ed83aacafe9906002627612ac3672d8ea224e38181
          do
            ARCHIVE="artifacts/ethereum-receipt-archives/${TX}.archive.json"
            FIXTURE="artifacts/ethereum-receipt-archives/${TX}.fixture.json"
            cargo run --manifest-path x3-lang/Cargo.toml \
              -p x3-tools --bin build_eth_receipt_archive -- \
              --input-json "$INPUT" \
              --tx-hash "$TX" > "$ARCHIVE"
            python3 scripts/proof/generate_eth_bridge_fixture.py \
              --from-archive-only "$ARCHIVE" > "$FIXTURE"
            python3 scripts/proof/generate_eth_bridge_fixture.py \
              --validate-only "$FIXTURE"
          done

      - name: Run VM archive verifier tests
        run: cargo test --manifest-path x3-lang/Cargo.toml -p x3-lang-vm ethereum_

      - name: Upload regenerated archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-receipt-archive-regeneration
          path: artifacts/ethereum-receipt-archives/**
