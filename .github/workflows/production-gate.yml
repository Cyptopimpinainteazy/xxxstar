name: production-gate

on:
  pull_request:
  push:
    branches: [ main, master, develop ]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown, wasm32v1-none
      - name: Install srtool CLI
        run: cargo install --locked --git https://github.com/chevdor/srtool-cli --rev 0485b5507a0b63cf7699376f15d9cb5c849bbcd0 srtool-cli
      - name: Add Cargo binaries to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify srtool CLI
        run: srtool version
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Guard
        run: make guard
      - name: Test (core + pallets)
        run: make test-all-pallets
      - name: Build validated release node
        run: cargo build --release -p x3-chain-node --features mainnet-rc1
      - name: Audit (invariants + readiness + consistency)
        run: make audit
      - name: Node Build Verification (mainnet-rc1)
        run: make test-node-build
      - name: Mainnet Check
        run: make mainnet-check
