name: Economic Attack Gate

on:
  # GitHub-hosted CI is disabled for this repo; run manually on the local x3 runner.
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1


concurrency:
  # Never cancel an in-flight default-branch run: a cancelled release gate proves
  # nothing, and with one self-hosted runner every new commit used to cancel the
  # previous gate before it finished. PR runs still cancel superseded pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  economic-gate:
    name: Economic Attack Gate (S0)
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build ProofForge
        run: cargo build -p proof-forge --release

      - name: Run Economic Gate
        run: |
          ./target/release/x3-proof economic-gate --strict --fail-hard 2>&1 | tee economic-gate-results.txt

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-gate-results-${{ github.run_number }}
          path: economic-gate-results.txt
          retention-days: 30
