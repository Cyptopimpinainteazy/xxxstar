version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-nonmajor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-nonmajor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      pip-nonmajor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-nonmajor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security
