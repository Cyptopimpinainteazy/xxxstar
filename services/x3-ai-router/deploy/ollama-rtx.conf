# Drop-in for the system ollama.service: pin it to the RTX 2060 SUPER as
# worker A on 127.0.0.1:11434. Install with deploy/install.sh --system
# (needs sudo). UUIDs are from `nvidia-smi -L` on x3gpu1; CUDA and nvidia-smi
# enumerate the two cards in opposite orders, so never pin by bare index.
[Service]
Environment="CUDA_DEVICE_ORDER=PCI_BUS_ID"
Environment="CUDA_VISIBLE_DEVICES=GPU-baea27c9-70a5-1025-e717-01005f5da6b0"
Environment="OLLAMA_VULKAN=0"
Environment="GGML_VK_VISIBLE_DEVICES="
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_SCHED_SPREAD=false"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_CONTEXT_LENGTH=16384"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_KEEP_ALIVE=30m"
