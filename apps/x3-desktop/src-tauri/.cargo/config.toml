[build]
# Using default gcc linker
# rustflags = ["-C", "linker=clang"]

[target.x86_64-unknown-linux-gnu]
linker = "gcc"

# Vendor source replacement disabled — matches the workspace-root decision
# (the tauri-vendor/ tree is incomplete: missing reqwest, serde, tauri, all
# tauri-plugin-* crates, and several core deps). Cargo will fetch from
# crates.io instead. If you need offline builds later, re-vendor via
# `cargo vendor src-tauri/tauri-vendor` and re-enable the block below.
#
# [source.crates-io]
# replace-with = "vendored-sources"
#
# [source.vendored-sources]
# directory = "tauri-vendor"
