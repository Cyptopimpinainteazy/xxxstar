[workspace]
# Standalone workspace so `cargo build` in src-tauri does not walk up and
# resolve against the monorepo root (which does not list this crate as a
# member). Matches the layout shipped by the standard Tauri template and by
# the sibling apps/x3-desktop/src-tauri app, which owns its own Cargo.lock.
resolver = "2"

[package]
name = "tauri-os-backend"
version = "0.1.0"
edition = "2021"
description = "X3 Tauri OS Shell — node management & swarm coordination backend"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.31"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
# Desktop-only Tauri app: all logic lives in src/main.rs. A [lib] target is
# intentionally not declared here (no src/lib.rs exists) so cargo can resolve
# the single binary crate.
name = "tauri-os-backend"
path = "src/main.rs"