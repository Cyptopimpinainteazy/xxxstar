[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = false
host_key_checking = true
forks = 7
timeout = 30
gathering = smart
# Never prompt: a run that needs input is a run whose plan is incomplete.
any_errors_fatal = true
force_handlers = true
interpreter_python = auto_silent

[privilege_escalation]
# Validators run as the operator's user (systemd --user units under ~/x3-testnet):
# no step needs root. The few host settings that do (linger, firewall) are checked by
# 10-preflight.yml, which prints the exact sudo command instead of running it.
become = false

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ControlPath=/tmp/ansible-ssh-%C
