all:
  vars:
    ansible_user: lojak
  children:
    validators:
      hosts:
        x3star3:
          ansible_host: 192.168.0.55
          x3_validators:
            - { index: 1 }
            - { index: 2 }
            - { index: 3 }
        x3star1:
          ansible_host: 192.168.0.65
          ansible_connection: local
          x3_validators:
            - { index: 4 }
            - { index: 5 }
            - { index: 6 }
        x3gpu1:
          ansible_host: 192.168.0.29
          x3_validators:
            - { index: 7 }
