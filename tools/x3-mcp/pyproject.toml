[project]
name = "x3-mcp"
version = "0.1.0"
description = "Fail-closed MCP server for X3 developer and operator tooling"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.10,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
x3-mcp = "x3_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x3_mcp"]
