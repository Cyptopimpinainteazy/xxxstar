version: '3.8'
services:
  database:
    container_name: x3-money-swarm-pilot-db
    labels:
      io.x3.money-swarm: local-pilot
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: x3_money
      POSTGRES_DB: x3_money
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - '127.0.0.1:15486:5432'
    volumes:
      - money_swarm_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U x3_money -d x3_money']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  money_swarm_data:
    name: x3-money-swarm-pilot-data
    labels:
      io.x3.money-swarm: local-pilot

secrets:
  postgres_password:
    file: ../../.local/money-swarm/postgres-password
