# Opcode Specification for X3 Language VM
# This file defines the canonical opcode mapping used by the emitter,
# verifier, and executor. All three components should reference this file
# to ensure a single source of truth.

opcodes:
  - code: 0x00
    name: NOP
    category: Misc
    description: "No operation"

  - code: 0x01
    name: BYTECODE_VERSION_1
    category: Header
    description: "Bytecode version marker"

  - code: 0x10
    name: META_NONCE
    category: Metadata
    description: "Transaction nonce metadata"

  - code: 0x11
    name: META_CHAIN_ID
    category: Metadata
    description: "Chain identifier metadata"

  - code: 0x20
    name: LOCK
    category: Asset ops
    description: "Lock assets on source chain"

  - code: 0x21
    name: MINT
    category: Asset ops
    description: "Mint assets on destination chain"

  - code: 0x22
    name: BURN
    category: Asset ops
    description: "Burn assets on source chain"

  - code: 0x23
    name: RELEASE
    category: Asset ops
    description: "Release locked assets"

  - code: 0x24
    name: SWAP
    category: Asset ops
    description: "Atomic swap between assets"

  - code: 0x25
    name: BRIDGE
    category: Bridge
    description: "Cross-chain bridge operation"

  - code: 0x30
    name: IF
    category: Control flow
    description: "Conditional branch"

  - code: 0x31
    name: LOOP
    category: Control flow
    description: "Loop construct"

  - code: 0x32
    name: CALL
    category: Control flow
    description: "Call subroutine"

  - code: 0x33
    name: RET
    category: Control flow
    description: "Return from subroutine"

  - code: 0x40
    name: REQUIRE
    category: Guards
    description: "Assert precondition"

  - code: 0x41
    name: ON_FAIL
    category: Guards
    description: "Failure handler"

  - code: 0x42
    name: ON_TIMEOUT
    category: Guards
    description: "Timeout handler"

  - code: 0x50
    name: ATOMIC_BEGIN
    category: Atomic
    description: "Begin atomic section"

  - code: 0x51
