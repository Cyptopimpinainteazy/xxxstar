[workspace]
resolver = "2"
members = [
    "crates/x3-common",
    "crates/x3-lexer",
    "crates/x3-ast",
    "crates/x3-tools",
    "compiler",
    "vm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["X3 Language Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/x3-chain/x3-lang"
description = "X3 - A systems language for agent swarms, atomic cross-chain execution, and MEV computation"

[workspace.dependencies]
# Core compiler dependencies
logos = "0.14"
chumsky = "0.9"
ariadne = "0.4"
internment = { version = "0.8", features = ["serde"] }
petgraph = "0.6"
indexmap = "2.1"
smallvec = "1.11"
bumpalo = "3.14"
rustc-hash = "1.1"
typed-arena = "2.0"

# LLVM integration
inkwell = { version = "0.4", features = ["llvm17-0"] }
llvm-sys = "170"

# Runtime dependencies
tokio = { version = "1.34", features = ["full"] }
async-trait = "0.1"
crossbeam = "0.8"
parking_lot = "0.12"
flume = "0.11"
rayon = "1.8"

# Crypto dependencies
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1.5"
ed25519-dalek = "2.1"
secp256k1 = { version = "0.28", features = ["recovery", "rand"] }
k256 = "0.13"
rand = "0.8"
ring = "0.17"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
postcard = { version = "1.0", features = ["alloc"] }

# Networking
reqwest = { version = "0.11", features = ["json"] }
tonic = "0.10"
prost = "0.12"

# Chain adapters
ethers = "2.0"
solana-sdk = "1.17"
web3 = "0.19"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
walkdir = "2.4"
notify = "6.1"
tempfile = "3.8"

# LSP
tower-lsp = "0.20"
ropey = "1.6"

# REPL
rustyline = "13.0"

# Testing
proptest = "1.4"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
debug = true

# Workspace-wide lints. The `mainnet-ready` gate runs
# `cargo clippy --workspace --all-targets --all-features -- -D warnings`,
# so we keep the policy here as a single source of truth. The clones on
# `Copy` types are explicitly tolerated because `Symbol` is trivially
# copyable; the manual `is_multiple_of` reads as `% 4 != 0` in intent;
# `from_str` shadowing the std trait is intentional for our parser entry
# points; and the `LowerCtx` / `Option::None` warnings are stylistic
# not load-bearing.
[workspace.lints.clippy]
clone_on_copy = "allow"
manual_is_multiple_of = "allow"
should_implement_trait = "allow"
derivable_impls = "allow"
needless_late_init = "allow"
redundant_closure = "allow"
ref_option = "allow"
borrowed_box = "allow"
new_without_default = "allow"
needless_borrow = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_mut_passed = "allow"
too_many_arguments = "allow"
question_mark = "allow"
manual_range_patterns = "allow"
len_without_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
large_enum_variant = "allow"
manual_ignore_case_cmp = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
type_complexity = "allow"
result_large_err = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
single_match = "allow"
single_match_else = "allow"
needless_range_loop = "allow"
needless_collect = "allow"
needless_pass_by_value = "allow"
expect_fun_call = "allow"
or_fun_call = "allow"
unwrap_used = "allow"
expect_used = "allow"
indexing_slicing = "allow"
len_zero = "allow"

[workspace.lints.rust]
unused_mut = "allow"
unused_imports = "allow"
