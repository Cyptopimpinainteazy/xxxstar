[package]
name = "e2e_tests"
version = "0.1.0"
edition = "2021"
description = "End-to-end integration tests for X3 Chain"
license = "MIT"
repository = "https://github.com/Cyptopimpinainteazy/x3-chain"

# No lib target - we only have integration tests
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[test]]
name = "cross_vm_real_chain_test"
path = "cross_vm_real_chain_test.rs"
# **Deliberate, not automatic.** This suite boots an ephemeral node and drives a real chain, so
# it needs a built `x3-chain-node` — a prerequisite `cargo test --workspace` cannot supply, and
# which made that command abort with six panics rather than report a missing prerequisite
# (TICKET-103). Gated on a feature so the workspace run neither builds it nor *silently skips*
# it: a test that quietly does nothing is the thing this repository treats as a claim. Run it
# on purpose, with a node built or `X3_NODE_BIN` set:
#
#   cargo test -p e2e_tests --features real-chain --test cross_vm_real_chain_test -- --nocapture
required-features = ["real-chain"]

[[test]]
name = "gateway_integration_test"
path = "gateway_integration_test.rs"

[[test]]
name = "mainnet_rc1"
path = "mainnet_rc1.rs"
required-features = []

[[test]]
name = "live_internal_mainnet_e2e"
path = "live_internal_mainnet_e2e.rs"
# Same prerequisite as the real-chain suite, and the same no-op gate it had: `required-features
# = []` requires nothing, so `cargo test --workspace` ran this and it panicked four times for a
# missing node binary (TICKET-103). The *suite* stays mandatory — it refuses rather than skips
# when it runs without a node, which is the right behaviour for a live-chain suite — but it is
# asked for rather than assumed:
#
#   cargo build -p x3-chain-node
#   cargo test -p e2e_tests --features real-chain --test live_internal_mainnet_e2e -- --nocapture
required-features = ["real-chain"]

[[test]]
name = "internal_mainnet_happy_path"
path = "src/internal_mainnet_happy_path.rs"
required-features = []
# Exercises the unit-style happy path: lock/mint, swap (incl. fee accounting),
# atomic rollback, invariant violation prevention, emergency halt/restart,
# cross-VM settlement, and replay protection. Wired as a proper integration
# test target so `cargo test -p e2e_tests --test internal_mainnet_happy_path`
# resolves in CI. Without this entry, the CI step silently errors with
# "no test target named ...".

[features]
default = []
full_e2e = []
# The real-chain suite's prerequisite, as a feature so it is asked for rather than assumed.
real-chain = []

[dependencies]
tokio = { version = "1.0", features = ["full", "net", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.29"
hex = "0.4"

# X3 SDK and core crates
x3-universal-contracts = { path = "../../crates/x3-universal-contracts" }
x3-ixl = { path = "../../crates/x3-ixl" }
x3-packet-standard = { path = "../../crates/x3-packet-standard" }
x3-liquidity-core = { path = "../../crates/x3-liquidity-core" }
x3-proof = { path = "../../crates/x3-proof" }
sp-core = { workspace = true }
x3-fees = { path = "../../crates/x3-fees" }
x3-slash = { path = "../../crates/x3-slash" }
x3-asset-kernel-types = { path = "../../crates/x3-asset-kernel-types" }
x3-verification-router = { path = "../../crates/x3-verification-router" }

# Testing utilities
tracing = "0.1"
tracing-subscriber = { workspace = true }
sha2 = "0.10"
once_cell = "1.19"

[dev-dependencies]
# Same reason as `pallets/x3-crosschain-gateway`: these tests drive the gateway
# with structural proofs, so they opt into the test verifiers. Production builds
# never see this feature.
x3-verification-router = { path = "../../crates/x3-verification-router", features = ["test-verifier"] }
