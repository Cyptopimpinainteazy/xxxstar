[package]
name = "x3-mobile-sdk"
version = "1.0.0"
edition = "2021"
description = "X3 Mobile Wallet SDK for iOS/Android via React Native"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.6", features = ["v4"] }
sp-runtime = { workspace = true }
ed25519-zebra = "3.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
bip32 = "0.5"
bip39 = "2.0"
rand = "0.8"
chrono = "0.4"
thiserror = "1.0"
tracing = "0.1"
bytes = "1.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Removed with the burn-down: `serde_json`, `sp-core`, `blake2` and the two
# dev-dependencies were never referenced by any module, and `substrate-api-client`
# (a large tree) was not either. The `[[test]] mobile_wallet_integration` target
# pointed at `tests/integration_tests.rs`, which does not exist — no test target
# has ever been buildable from this manifest.
