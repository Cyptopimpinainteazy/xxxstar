[package]
name = "x3-state-snapshot"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Content-addressed X3 state snapshot manifest and verifier"

[lib]
path = "src/lib.rs"

[[bin]]
name = "x3-state-snapshot"
path = "src/main.rs"

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sp-core = { workspace = true, features = ["std"] }
sp-trie = { workspace = true, features = ["std"] }
thiserror = "1.0"

[dev-dependencies]
sp-state-machine = { workspace = true, features = ["std"] }
tempfile = "3"
