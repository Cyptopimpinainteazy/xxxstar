[package]
name = "x3-foundry-auditor"
version = "0.1.0"
edition = "2021"
description = "Automated security auditor for X3 Foundry dApps"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
