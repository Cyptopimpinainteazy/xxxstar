[package]
name = "x3-atomic-swap"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "X3 Cross-VM Atomic Swap Proof Mode - HTLC hashlocks, chain-specific timelocks, relayer proof capture, and mandatory scoreboard"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
blake2 = { version = "0.10", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
ureq = { version = "2.9", optional = true }
k256 = { version = "0.13", optional = true, default-features = false, features = ["ecdsa", "std"] }
sha3 = { version = "0.10", optional = true, default-features = false }
rlp = { version = "0.5", optional = true, default-features = false }
rand = { version = "0.8", optional = true }

[features]
default = []
std = ["serde/std", "serde_json/std", "sha2/std", "hex/std", "ureq", "k256", "sha3", "rlp", "rand"]

[[bin]]
name = "gen_wallet"
path = "src/bin/gen_wallet.rs"
required-features = ["std"]
