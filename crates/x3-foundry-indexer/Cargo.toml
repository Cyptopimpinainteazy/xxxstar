[package]
name = "x3-foundry-indexer"
version = "0.1.0"
edition = "2021"
description = "Indexer for X3 Foundry on-chain events"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = "1.29"
rust_decimal_macros = "1.29"
