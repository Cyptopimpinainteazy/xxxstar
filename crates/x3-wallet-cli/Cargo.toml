[package]
name = "x3-wallet-cli"
version = "0.1.0"
edition = "2021"
description = "X3 Wallet CLI - Command-line interface for wallet operations, multisig, and DEX swaps"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"

# The manifest used to list tokio, serde, serde_json, reqwest, thiserror,
# tracing, tracing-subscriber, subxt, sp-core, sp-runtime, sp-keyring, sha2 and
# blake2 — none of which `src/main.rs` references — plus `ledger-device-sdk` and
# `trezor-lib`, which are not crates that exist on crates.io at all. That is why
# the crate could never even resolve, let alone build.

[[bin]]
name = "x3-wallet"
path = "src/main.rs"
