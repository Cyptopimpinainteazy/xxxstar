[package]
name = "x3-external-chains"
version = "0.1.0"
edition = "2021"
authors = ["X3 Chain Team"]
description = "External EVM chain adapters for X3 Chain cross-chain operations"
license = "MIT"
repository = "https://github.com/Cyptopimpinainteazy/x3-chain"

[dependencies]
# Core Substrate dependencies (using workspace versions)
parity-scale-codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
sp-core = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }

# Internal crates
x3-evm-integration = { path = "../evm-integration", default-features = false }
x3-cross-vm-bridge = { path = "../cross-vm-bridge", default-features = false }
# Signing a transaction is the one thing this crate cannot do itself: the adapters
# hold no key material and no RLP/secp256k1 code. `x3-atomic-swap` owns the single
# EIP-155 implementation in the workspace (`ethereum_tx`), so sending reuses it
# rather than growing a second one. Optional and `std`-only: a no_std build has no
# signer, and every send path refuses there.
x3-atomic-swap = { path = "../x3-atomic-swap", default-features = false, features = ["std"], optional = true }

# Async runtime
async-trait = "0.1"

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
# Log and block responses are arrays of objects, which the module's string
# scanning cannot read safely. `alloc` keeps this available in a no_std build.
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex-literal = "0.4"

# Utilities
hex = "0.4"

# HTTP client for JSON-RPC calls (std-only)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Logging
log = { workspace = true, default-features = false }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util", "macros", "rt-multi-thread"] }

[features]
default = ["std"]
# Test double for the chain adapters (`MockChainAdapter`). Not in `default`:
# it accepts every proof (`verify_message_proof` -> `Ok(true)`), so it must not
# be reachable from a production build. See docs/reports/SECURITY_BLOCKERS.md
# finding 2.
mock-adapters = []
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-io/std",
    "x3-evm-integration/std",
    "x3-cross-vm-bridge/std",
    "x3-atomic-swap/std",
    "serde/std",
    "serde_json/std",
    "log/std",
]
