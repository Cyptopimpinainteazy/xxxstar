[package]
name = "x3-mc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Probabilistic adversarial simulation engine over the deterministic x3-sim harness"

# Standalone workspace root, for the same reason `crates/x3-sim` is one: this
# crate drives that simulator, which in turn drives the real coordinator, and
# neither is a member of the parent Substrate workspace. Keeping x3-mc out of
# the parent keeps its dependency graph (rand, serde) from colliding with the
# Substrate pins.
[workspace]
members = []
resolver = "2"

[dependencies]
x3-sim = { path = "../x3-sim" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
hex = "0.4"

[[bin]]
name = "x3-mc"
path = "src/main.rs"
