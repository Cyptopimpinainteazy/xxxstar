[package]
name = "x3-chain-health-daemon"
version = "0.1.0"
edition = "2021"
description = "X3 Chain Health Monitor Daemon — polls chain metrics, detects anomalies, writes health proofs to ledger"

[dependencies]
x3-atomic-swap = { path = "../x3-atomic-swap" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "1"
log = "0.4"
ureq = { version = "2", features = ["json"] }
env_logger = "0.10"
sha2 = "0.10"
hex = "0.4"
