[package]
name = "x3-x3-integration"
version = "0.1.0"
edition = "2021"
description = "X3 Chain integration for X3 virtual machine and compiler"
license = "MIT OR Apache-2.0"

[dependencies]
# The X3 engine. It builds without `std`, so the wasm runtime executes X3BC with the same
# interpreter and verifier the native runtime, tests and tools use.
x3-vm = { path = "../x3-vm", default-features = false }
x3-backend = { path = "../x3-backend", default-features = false }
# Compiler front end (std-only — heavy deps; not used in WASM runtime)
x3-compiler = { path = "../x3-compiler", optional = true }
x3-common = { path = "../x3-common", default-features = false }
# The canonical X3BC semantic core: header rules, trading section, receipts, hashing.
x3bc-core = { path = "../x3bc-core", default-features = false }
# Attestor signatures over trading receipts (std: the attestor and replay are off-chain).
ed25519-dalek = { version = "2.1", default-features = false, optional = true }

# Cross-VM executor traits (real backends are provided by the caller)
x3-evm-integration = { path = "../evm-integration", default-features = false }
x3-svm-integration = { path = "../svm-integration", default-features = false, optional = true }

# Substrate primitives
sp-core = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }

# Encoding
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }

# Error handling
thiserror = { version = "1.0", optional = true }

# Logging
log = { version = "0.4", default-features = false }

[dev-dependencies]
# The X3 Lang production trading suites compile real `.x3` trading programs with the canonical
# front end and hold the production engine to the nested reference VM (differential suite).
x3-lang-compiler = { path = "../../x3-lang/compiler" }
x3-lang-vm = { path = "../../x3-lang/vm" }
env_logger = "0.10"
# An artifact attestation travels as a JSON sidecar beside the artifact; the test round-trips one.
serde_json = { workspace = true }
# The differential tests run each optimizer pass on its own against the unoptimized program.
x3-opt = { path = "../x3-opt" }
x3-mir = { path = "../x3-mir" }
x3-evm-integration = { path = "../evm-integration", default-features = false, features = ["std", "test-utils"] }
x3-svm-integration = { path = "../svm-integration", default-features = false, features = ["std", "test-utils"] }

[features]
default = ["std"]
std = [
    "sp-core/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-io/std",
    "frame-support/std",
    "codec/std",
    "scale-info/std",
    "serde?/std",
    "thiserror",
    "log/std",
    "x3-common/std",
    "x3bc-core/std",
    "dep:ed25519-dalek",
    "ed25519-dalek/std",
    "x3-evm-integration/std",
    # x3-svm-integration excluded from std: solana-program 3.x dual solana-address conflict
    "x3-vm/std",
    "x3-backend/std",
    "x3-compiler",
]
# Enable contract compilation from source
compile = []
# Enable JIT compilation hints
jit = ["x3-vm/jit-hints"]
# Enable detailed gas metering
gas-metering = ["x3-vm/gas-metering"]
