[package]
name = "x3-cross-vm-coordinator"
version = "0.1.0"
edition = "2021"
description = "Cross-VM Atomic Trade Coordinator — HTLC-based state machine for EVM ↔ SVM ↔ X3VM atomic swaps with flashloan integration"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"
# SECURITY: OsRng for cryptographically secure HTLC secret generation
rand = { version = "0.8", features = ["getrandom"] }
# SECURITY: Zeroize on drop for sensitive key material
zeroize = "1.7"
# SECURITY: Cryptographic signing for HTLC operations
secp256k1 = { version = "0.28", features = ["rand-std"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

reqwest = { version = "0.12", features = ["json"] }
blake2 = "0.10"
blake3 = "1.5"
subtle = "2.5"
x3-cross-vm-bridge = { path = "../cross-vm-bridge" }
x3-atomic-swap = { path = "../x3-atomic-swap", default-features = false, optional = true }
codec = { package = "parity-scale-codec", version = "3.6", default-features = false, optional = true }
# Optional: for production persistence with substrate offchain storage
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", optional = true }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", optional = true }
# Optional: low-latency shared fencing authority for Redis/Valkey.
redis = { version = "1.7", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[features]
default = ["real-signing"]
offchain = ["sc-client-api", "sp-core"]
valkey = ["redis"]
canonical-proofs = ["x3-atomic-swap", "codec"]
# Enable signed on-chain transaction submission for all three VM adapters.
# Without this flag the adapters use simulation/dry-run paths only.
real-signing = []

# This is a nested workspace (see [workspace] in the root Cargo.toml's local-ci
# gate comments) so it does not inherit the root's [patch.crates-io] table.
# Upstream sc-executor-wasmtime v0.43.0 (stable2512) pins wasmtime "^35.0.0",
# which is within the vulnerable range for GHSA-jhxm-h53p-jm7w and
# GHSA-xx5w-cvp6-jv83 (aarch64 sandbox escape, Cranelift and Winch). Same fix
# the root workspace already applies via patches/sc-executor-wasmtime.
# The `offchain` feature pulls sp-core/sc-client-api -> stock sp-wasm-interface
# v24.0.0 (wasmtime feature enabled), a second independent path to the same
# vulnerable wasmtime — needs its own matching local patch or `cargo build
# --features offchain` still links the vulnerable version even though the
# default build doesn't.
[patch."https://github.com/paritytech/polkadot-sdk"]
sc-executor-wasmtime = { path = "../../patches/sc-executor-wasmtime" }
sp-wasm-interface = { path = "../../patches/sp-wasm-interface" }
