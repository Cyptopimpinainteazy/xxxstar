[package]
name = "x3-crosschain-intent"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "X3 Cross-Chain Intent System — user-facing intent language, compiler, state machine, and safety checks"

[features]
default = ["std"]
# The `std` feature is what the graph switches on; the two features below are **not** here
# because the code cannot do without them. TICKET-082 measured what happened when they were:
# `cargo check -p x3-crosschain-intent --no-default-features` failed with **244 errors** —
# 230 `the trait bound String: serde::Deserialize is not satisfied` and 13
# `cannot find function hex::encode` — because this crate's only `std`-gated items were the
# very dependency features every path needs. The crate is `#![cfg_attr(not(feature = "std"),
# no_std)]` and is in the runtime's wasm graph through `pallet-x3-settlement-engine`, which
# depends on it with `default-features = false`, so "off" is a configuration that has to
# build.
std = ["serde/std", "sha2/std", "x3-verification-router/std"]

[dependencies]
# `alloc` is not optional: `serde`'s `String`/`Vec` impls live behind it, and this crate
# deserializes both on every path. See the note on the `std` feature.
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
# `hex::encode` is an `alloc` API and this crate calls it unconditionally, so the feature
# is declared here rather than hung off `std` — which is what made it unreachable in the
# configuration the wasm graph builds (TICKET-082).
hex = { version = "0.4", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
# The canonical Merkle Patricia Trie receipt verifier. This crate used to carry its
# own "verification" for EVM receipts, which decoded a receipt, hashed the caller's
# own bytes and called the result a trie root — a proof of nothing, checked against
# nothing (TICKET-065). One verifier, in `x3-verification-router`, is the one the
# relayer is already wired to; this crate delegates rather than re-derives it.
# `default-features = false` is load-bearing: this crate is in the runtime's
# wasm dependency graph (via `pallet-x3-settlement-engine`), and taking the
# router's default `std` feature there made the embedded runtime unbuildable:
#
#   error[E0463]: can't find crate for `std`
#     = note: `std` is required by `x3_verification_router` because it does not
#             declare `#![no_std]`
x3-verification-router = { path = "../x3-verification-router", default-features = false }

[dev-dependencies]
serde_json = "1.0"

# IntentSpecDraft bridge — the old x3-lang compiler produces JSON-serializable
# draft intents; the adapter boundary here converts them into canonical
# CrossChainIntent. The draft types live in x3-lang::compiler::intent_emit.
# There is no runtime dependency — the bridge only uses serde_json to
# deserialize the draft at the adapter boundary.
