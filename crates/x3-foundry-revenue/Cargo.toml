[package]
name = "x3-foundry-revenue"
version = "0.1.0"
edition = "2021"
description = "Revenue calculation and distribution for X3 Foundry"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
thiserror = "1"
rust_decimal = { version = "1", features = ["serde", "maths"] }
rust_decimal_macros = "1"
