# NOTE: The production x3-lang common crate is at x3-lang/crates/x3-common (x3-lang-common).
# See docs/x3-lang/README.md.

[package]
name = "x3-common"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
# The X3BC header and version rules live in the canonical core; `bytecode` re-exports them.
x3bc-core = { path = "../x3bc-core", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
secp256k1 = { version = "0.28", default-features = false, features = ["alloc", "recovery", "rand"] }

[features]
default = ["std"]
std = ["x3bc-core/std", "serde/std", "sp-core/std", "sp-io/std", "sp-runtime/std", "sp-std/std", "hex/std", "secp256k1/std"]
alloc = ["serde/alloc"]
