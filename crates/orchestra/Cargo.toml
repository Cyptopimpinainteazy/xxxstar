[package]
# `orchestra` is already taken in this workspace's dependency graph: the
# polkadot node crates pull `orchestra 0.4.1` from crates.io. A member with the
# same name makes every `-p orchestra` ambiguous, so the crate is `x3-orchestra`
# (the directory keeps its historical name).
name = "x3-orchestra"
version = "0.1.0"
edition = "2021"
description = "Multi-layered orchestral agent system for X3 Chain — on-chain execution, off-chain jury, rotation, and scrap yard alignment"
authors = ["X3 Chain Team"]
license = "MIT"
repository = "https://github.com/x3-chain/x3-chain"

[features]
default = []
chain-integration = []

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Crypto — anonymous voting commitments, identity hashing
blake3 = "1.5"
sha2 = "0.10"
rand = "0.8"

# Logging & metrics
tracing = "0.1"

# Utils
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
glob = "0.3"

[dev-dependencies]
tempfile = "3.9"
