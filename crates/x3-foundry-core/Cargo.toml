[package]
name = "x3-foundry-core"
version = "0.1.0"
edition = "2021"
description = "X3 Foundry - AI-powered dApp factory for Atlas Sphere"
authors = ["X3 Foundry Team"]
license = "Apache-2.0"
repository = "https://github.com/Cyptopimpinainteazy/xxxstar"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true, default-features = false, features = ["full_crypto"] }
sp-runtime = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
pallet-balances = { workspace = true, default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
]

[lib]
name = "x3_foundry_core"
path = "src/lib.rs"
