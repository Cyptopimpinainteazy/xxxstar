[package]
name = "x3-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
parity-scale-codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { version = "2.5", default-features = false, features = ["derive"] }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512" }
sp-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512" }
x3-common = { path = "../x3-common" }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-std/std",
    "sp-io/std",
    "sp-core/std",
    "sp-api/std",
    "serde/std",
]
# Enable the `zk-proofs` feature only when a ZK verifier (Groth16 / PLONK)
# is wired in. Without this feature, `verify_zk_proof` returns an explicit
# feature-gated error so production builds cannot accidentally route ZK
# proofs through an unverified path.
zk-proofs = []
