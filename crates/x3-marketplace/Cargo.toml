[package]
name = "x3-marketplace"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

# The Substrate crates that used to be listed here (`sp-core = "21"`,
# `sp-runtime = "27"`, `frame-support`/`frame-system`/`pallet-balances = "27"`,
# `codec`, `scale-info`) were never referenced anywhere in `src/`, and they
# resolved a *second*, crates.io-pinned Substrate stack (sp-io 26/29) alongside
# the workspace's `paritytech/polkadot-sdk@stable2512` one. They are gone now;
# this crate is pure Rust over serde/chrono/thiserror.

# `[[dev-dependencies.tokio-test]]` used to be an array-of-tables for what is a
# single dependency, which is not valid TOML for cargo and made the manifest
# (and therefore the whole workspace, once it became a member) fail to load.
[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["std"]
std = [
    "serde/std",
    "chrono/std",
]
