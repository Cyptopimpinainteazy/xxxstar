[package]
name = "x3-bitcoin-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bitcoin vault with threshold multisig, UTXO tracking, and SPV verification"

[features]
default = ["std"]
std = []

[dependencies]
sha2 = { workspace = true }
ripemd = "0.1"
hex = { workspace = true }
scale-info = { workspace = true }
codec = { workspace = true }
# Pinned to 0.13.4, not 0.14: 0.14 pulls in ecdsa 0.17, whose
# sign_digest_recoverable requires a newer `digest` crate than the one this
# workspace's [patch] section pins — a real, workspace-wide conflict (see
# crates/x3-atomic-swap's ethereum_tx.rs, broken by the same dependabot bump).
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
