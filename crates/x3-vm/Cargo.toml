[package]
name = "x3-vm"
version = "0.1.0"
edition = "2021"
description = "X3 Virtual Machine - bytecode verifier and deterministic interpreter"
license = "MIT OR Apache-2.0"
repository = "https://github.com/x3-chain/x3"

[dependencies]
# Core dependencies
x3-backend = { path = "../x3-backend", default-features = false }
x3-common = { path = "../x3-common", default-features = false, features = ["alloc"] }

# Substrate primitives — H160/U256 used in EVM bridge hostcalls
sp-core = { workspace = true, default-features = false }

# EVM/SVM integration (std only — used by X3VMBridge for real cross-VM calls)
x3-evm-integration = { path = "../evm-integration", optional = true }
x3-svm-integration = { path = "../svm-integration", optional = true }

# Dynamic library loading for GPU FFI (std only)
libloading = { version = "0.9", optional = true }

# Error handling
thiserror = { version = "2", default-features = false }

# Logging
log = { version = "0.4", default-features = false }
tracing = { version = "0.1", optional = true }

# Synchronization primitives (JIT cache, std only)
parking_lot = { version = "0.12", optional = true }

# Serialization (for VM state snapshots)
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
env_logger = "0.10"
# Property tests: arbitrary bytes and arbitrary well-formed programs against the verifier and VM.
proptest = { workspace = true }

[features]
default = ["std"]
# Without `std` this is the deterministic core the runtime can embed: verifier, interpreter,
# gas, storage journal, events and hostcall registry. GPU FFI, the cross-VM bridge, the JIT,
# the debugger, escrow and upgrade helpers are off-chain only.
std = [
    "dep:libloading",
    "dep:parking_lot",
    "dep:tracing",
    "thiserror/std",
    "serde/std",
    "sp-core/std",
    "x3-backend/std",
    "x3-common/std",
    "x3-evm-integration",
    "x3-svm-integration",
]
# Enable debug opcodes (DebugPrint, DebugDump) - NEVER for on-chain
debug-ops = []
# Enable JIT hints (for future JIT compiler)
jit-hints = []
# Enable detailed gas metering
gas-metering = []
