[package]
name = "x3-vm"
version = "0.1.0"
edition = "2021"
description = "X3 Virtual Machine - bytecode verifier and deterministic interpreter"
license = "MIT OR Apache-2.0"
repository = "https://github.com/x3-chain/x3"

[dependencies]
# Core dependencies
x3-bytecode = { path = "../x3-bytecode", default-features = false }
x3-common = { path = "../x3-common", default-features = false }

# Substrate primitives — H160/U256 used in EVM bridge hostcalls
sp-core = { workspace = true, default-features = false }

# EVM/SVM integration (std only — used by X3VMBridge for real cross-VM calls)
x3-evm-integration = { path = "../evm-integration", optional = true }
x3-svm-integration = { path = "../svm-integration", optional = true }

# Error handling (thiserror 2 derives `core::error::Error`, so it works without std)
thiserror = { version = "2", default-features = false }

# Logging (no_std-safe facade; a no-op unless a logger is installed)
log = { version = "0.4", default-features = false }

# Serialization (for VM state snapshots)
serde = { version = "1.0", features = ["derive", "alloc"], default-features = false }

# --- std-only services (GPU FFI, JIT tracking) ---
# Dynamic library loading for GPU FFI
libloading = { version = "0.9", optional = true }
# Logging used by the JIT tracker
tracing = { version = "0.1", optional = true }
# Synchronization primitives for the JIT cache
parking_lot = { version = "0.12", optional = true }

[dev-dependencies]
env_logger = "0.10"

[features]
default = ["std"]
std = [
    "serde/std",
    "sp-core/std",
    "thiserror/std",
    "log/std",
    "x3-bytecode/std",
    "x3-common/std",
    "x3-evm-integration",
    "x3-svm-integration",
    "dep:libloading",
    "dep:tracing",
    "dep:parking_lot",
]
# The real cross-VM bridge client (`bridge.rs` gates its EVM and SVM calls on these names).
x3-evm-integration = ["dep:x3-evm-integration"]
x3-svm-integration = ["dep:x3-svm-integration"]
# Enable debug opcodes (DebugPrint, DebugDump) - NEVER for on-chain
debug-ops = []
# Enable JIT hints (for future JIT compiler)
jit-hints = []
# Enable detailed gas metering
gas-metering = []
