# The dispatchables that can hold funds, and how those funds leave while `Halted` is set.
#
# `pallet_x3_invariants::InvariantCheck` refuses every signed extrinsic while the constitutional halt
# flag is set, except the calls in `RuntimeHaltExemptCalls`. The reviewed exemption list lives in
# `security/halt-exemptions.toml`. What it could never prove is *completeness*: a pallet that
# reserves a bond, escrow or deposit whose only exit is a dispatchable the halt refuses is invisible
# to it, and so is a reserve that is never released at all (TICKET-153).
#
# `scripts/ci/check-halt-fund-holding.py` builds that inventory: it parses every pallet wired by
# `construct_runtime!`, finds each dispatchable that can reach `reserve` / `reserve_named` / `hold` /
# `hold_named` / `set_lock` (through same-file helpers), and requires an entry here. This file is the
# review. The checker fails when a fund-holding call is missing, when an entry outlives its call, or
# when the disposition's claim is not true of the code:
#
#   * `exempt`           — the call itself is in RuntimeHaltExemptCalls;
#   * `recoverable`      — `recoverable_by` is a sibling dispatchable that reaches a release
#                          primitive; `while_halted = true` means that sibling is itself exempt, and
#                          `false` means the funds are recoverable only once governance clears the
#                          halt (`Council::close` is exempt precisely so the halt is clearable);
#   * `transient`        — the call frees what it reserves before it returns, so it retains nothing;
#   * `permanent_charge` — a non-refundable anti-spam fee, so there is no release path by design,
#                          and the reserved amount must be read from a `*Fee` constant.
#
# Everything with `while_halted = false` or `permanent_charge` is an *exception*: a call whose funds
# the halt keeps locked until it is cleared. The checker prints them. Only the atomic bundle has a
# halt-reachable release today, which is the honest state recorded by TICKET-153.

[[holding]]
call = "pallet_agent_accounts/register_agent"
pallet_variant = "AgentAccounts"
disposition = "recoverable"
recoverable_by = "pallet_agent_accounts/terminate_agent"
recoverable_variant = "AgentAccounts"
while_halted = false
why = "Registration reserves the agent's stake; `terminate_agent` unreserves it and is not halt-exempt, so the stake is returned only after governance clears the halt."

[[holding]]
call = "pallet_agent_memory/append_entry"
pallet_variant = "AgentMemory"
disposition = "recoverable"
recoverable_by = "pallet_agent_memory/withdraw_deposit"
recoverable_variant = "AgentMemory"
while_halted = false
why = "Each appended entry reserves a per-entry storage bond; `withdraw_deposit` returns the accumulated bond, which needs the halt cleared first."

