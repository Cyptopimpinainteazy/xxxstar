[[holding]]
call = "pallet_x3_da/submit_blob_commitment"
pallet_variant = "X3Da"
disposition = "permanent_charge"
why = "The reserved amount is the per-byte anti-spam fee (`PerByteFee`), a charge rather than a refundable bond; no dispatchable in this pallet releases it. TICKET-155 records that reserve-as-charge is indistinguishable from a fund trap and should use an explicit fee primitive."

[[holding]]
call = "pallet_x3_kernel/prepare_cross_vm_operation"
pallet_variant = "AtlasKernel"
disposition = "transient"
why = "The operation's balance check holds and frees the same amount inside the call, so it retains no funds once it returns; the checker verifies a release primitive is reached."

[[holding]]
call = "pallet_x3_kernel/submit_cross_vm_operation"
pallet_variant = "AtlasKernel"
disposition = "transient"
why = "Same balance-check pattern as prepare: the reserve is released before returning, so this call holds nothing and needs no halt exemption."

