# X3 RPC Gateway — HAProxy Edge Configuration
# Production mainnet-ready edge gateway.
#
# Responsibilities:
# - TLS termination
# - IP allowlisting for admin methods
# - Rate limit enforcement at the edge
# - Connection limits
# - Active TCP/HTTP health checks
# - Request size limits
# - Forwarding to the protocol-aware x3-rpc-router backend

global
    log stdout format raw local0
    maxconn 50000
    nbthread 4
    tune.bufsize 32768
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    option redispatch
    retries 2
    timeout connect 1500ms
    timeout client  30s
    timeout server  30s
    timeout http-request 5s
    timeout http-keep-alive 60s
    timeout tunnel 1h                     # WebSocket tunnels

    # Deny by default for sensitive paths
    http-request deny if { path_beg /admin }
    http-request deny if { path_beg /debug }
    http-request deny if { path_beg /internal }

    # Security headers
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------------------------
# Frontend: HTTP RPC (port 8545)
# ---------------------------------------------------------------------------
frontend rpc_http
    bind *:8545
    bind *:443 ssl crt /etc/ssl/certs/x3-rpc-gateway.pem alpn h2,http/1.1

    # Request size limit — 10 MB max body
    http-request deny if { req.body_size gt 10485760 }

    # Rate limiting — per-IP stick table
    stick-table type ip size 100k expire 60s store http_req_rate(10s),gpc0
    http-request track-sc0 src
    http-request sc-inc-gpc0(0) if { sc0_http_req_rate(0) gt 1000 }

    # Deny if rate limit flag is set (>= 1000 req / 10s)
    http-request deny deny_status 429 if { sc0_get_gpc0(0) gt 5 }

    # WebSocket upgrade detection (Solana / Substrate subscriptions)
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_upgrade hdr(Connection) -i upgrade

    use_backend rpc_ws_backend if is_websocket is_upgrade
    default_backend rpc_http_backend

# ---------------------------------------------------------------------------
# Frontend: Health check endpoint (port 8081)
# ---------------------------------------------------------------------------
frontend health_check
    bind *:8081
    monitor-uri /health
    default_backend rpc_health_backend

# ---------------------------------------------------------------------------
# Frontend: Metrics endpoint (port 9090, internal only)
# ---------------------------------------------------------------------------
frontend metrics
    bind 127.0.0.1:9090
    default_backend rpc_metrics_backend

# ---------------------------------------------------------------------------
# Backend: HTTP RPC Router
# ---------------------------------------------------------------------------
backend rpc_http_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-check expect string "ok"

    # Primary router instances
    server router1 127.0.0.1:18545 check inter 1s fall 3 rise 2 maxconn 5000
    server router2 127.0.0.1:18546 check inter 1s fall 3 rise 2 maxconn 5000 backup

    # Circuit breaker
    default-server error-limit 50 on-error mark-down inter 30s

# ---------------------------------------------------------------------------
# Backend: WebSocket RPC (Solana + X3 Substrate subscriptions)
# ---------------------------------------------------------------------------
backend rpc_ws_backend
    balance source                      # sticky by client IP
    option httpchk GET /health
    http-check expect status 200

    server ws-router1 127.0.0.1:18547 check inter 2s fall 3 rise 2 maxconn 2000
    server ws-router2 127.0.0.1:18548 check inter 2s fall 3 rise 2 maxconn 2000 backup

    timeout tunnel 1h
    timeout client 1h
    timeout server 1h

# ---------------------------------------------------------------------------
# Backend: Health aggregation
# ---------------------------------------------------------------------------
backend rpc_health_backend
    option httpchk GET /health
    http-check expect status 200
    server router-health 127.0.0.1:18549 check inter 2s fall 2 rise 2

# ---------------------------------------------------------------------------
# Backend: Prometheus metrics
# ---------------------------------------------------------------------------
backend rpc_metrics_backend
    server router-metrics 127.0.0.1:18550 check inter 5s