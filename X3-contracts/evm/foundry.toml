[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
fuzz = { runs = 4096 }
invariant = { runs = 256, depth = 128, fail_on_revert = true }
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

fs_permissions = [
    { access = "read", path = "../shared" },
]

[profile.ci]
fuzz = { runs = 4096 }
invariant = { runs = 512, depth = 128, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
