[package]
name = "x3-kernel-bridge"
version = "0.1.0"
description = "X3 kernel bridge — routes kernel CPI calls to token adapters and gateways"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "x3_kernel_bridge"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
