# ─────────────────────────────────────────────────────────────────────────────
# alertmanager.yml — X3 Alertmanager Configuration
#
# Routes alerts from Prometheus to notification channels.
# ─────────────────────────────────────────────────────────────────────────────
global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  receiver: 'default'
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 10m

    - match:
        severity: warning
      receiver: 'default'
      repeat_interval: 1h

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#x3-alerts'
        title: 'X3 Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        send_resolved: true

  - name: 'critical'
    slack_configs:
      - channel: '#x3-critical'
        title: '🚨 X3 Critical: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        send_resolved: true
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: critical

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']