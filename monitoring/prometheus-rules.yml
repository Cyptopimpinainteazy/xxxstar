# ─────────────────────────────────────────────────────────────────────────────
# prometheus-rules.yml — X3 Prometheus Alerting Rules
#
# Alert thresholds for validator and network health.
# ─────────────────────────────────────────────────────────────────────────────
groups:
  - name: x3-validator
    interval: 30s
    rules:
      - alert: BlockProductionStalled
        expr: rate(substrate_block_height{status="best"}[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Block production stalled on {{ $labels.instance }}"
          description: "No new blocks produced for 2 minutes on {{ $labels.instance }}"

      - alert: FinalityStalled
        expr: rate(substrate_finality_notifications_total[5m]) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Finality stalled on {{ $labels.instance }}"
          description: "No finality notifications for 3 minutes on {{ $labels.instance }}"

      - alert: HighPeerDisconnectRate
        expr: rate(substrate_network_outgoing_connections_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P2P disconnect rate on {{ $labels.instance }}"
          description: "More than 10 disconnects per second over 5 minutes"

      - alert: ValidatorOffline
        expr: substrate_validator_active == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Validator {{ $labels.instance }} is offline"
          description: "Validator has stopped authoring blocks"

      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/var/lib/x3"} / node_filesystem_size_bytes{mountpoint="/var/lib/x3"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 90% on {{ $labels.instance }}"
          description: "Less than 10% disk space remaining on chain data volume"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90% on {{ $labels.instance }}"
          description: "System memory critically high"

      - alert: PeerCountLow
        expr: substrate_sub_libp2p_peers_count < 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low peer count on {{ $labels.instance }}"
          description: "Only {{ $value }} connected peers (threshold: 3)"

      - alert: RuntimeUpgradeFailed
        expr: substrate_runtime_upgrade_result{status="failure"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Runtime upgrade failed on {{ $labels.instance }}"
          description: "A runtime upgrade attempt failed — check logs immediately"

  - name: x3-indexer
    interval: 30s
    rules:
      - alert: IndexerDown
        expr: up{job="x3-indexer"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Indexer is down"
          description: "The indexer service has been unreachable for 1 minute"

      - alert: IndexerBlockLag
        expr: (substrate_block_height{status="finalized"} - indexer_last_processed_block) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Indexer block lag"
          description: "Indexer is {{ $value }} blocks behind finalized tip"