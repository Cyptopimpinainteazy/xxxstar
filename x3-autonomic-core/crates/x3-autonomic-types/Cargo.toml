[package]
name = "x3-autonomic-types"
version = "0.1.0"
edition = "2021"
description = "Shared types for X3 Autonomic Core"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
chrono = { version = "0.4", features = ["derive"], optional = true }
uuid = { version = "1.6", features = ["v4"], optional = true }
sha2 = { version = "0.10", optional = true }
scale = { package = "parity-scale-codec", version = "3.0", features = ["derive"] }
sp-core = { version = "25.0", default-features = false }
sp-runtime = { version = "27.0", default-features = false }
scale-info = { version = "2.10", default-features = false, features = ["derive"], optional = true }

[features]
default = ["std"]
std = [
    "serde/std",
    "chrono/std",
    "uuid/std",
    "sha2/std",
    "scale/std",
    "sp-core/std",
    "sp-runtime/std",
    "scale-info/std",
]
