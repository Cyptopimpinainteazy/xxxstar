[package]
name = "x3-autonomic-core"
version = "0.1.0"
edition = "2021"
authors = ["X3 Protocol"]
description = "X3 Autonomic Core - Self-testing, self-auditing, and controlled self-improvement layer"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    "crates/x3-autonomic-types",
    "crates/x3-live-auditor",
    "crates/x3-shadow-runner",
    "crates/x3-regression-engine",
    "crates/x3-benchmark-oracle",
    "crates/x3-judge-agent",
    "crates/x3-autonomic-cli",
    "crates/pallet-x3-invariants",
    "crates/pallet-x3-health",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"