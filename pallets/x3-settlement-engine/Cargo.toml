[package]
name = "pallet-x3-settlement-engine"
version = "0.1.0"
edition = "2021"
authors = ["X3 Chain Team"]
description = "X3 Settlement Engine - Protocol-level atomic settlement for BTC, EVM, and SVM"
repository = "https://github.com/Cyptopimpinainteazy/x3-chain"
license = "MIT"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { package = "scale-info", version = "2.10", default-features = false, features = ["derive"] }
log = { version = "0.4", default-features = false }

# Substrate dependencies
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-api = { workspace = true, default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
ripemd = { version = "0.1", default-features = false }
frame-benchmarking = { workspace = true, default-features = false, optional = true }

# Internal dependencies
pallet-x3-kernel = { path = "../x3-kernel", default-features = false }
pallet-x3-atomic-kernel = { path = "../x3-atomic-kernel", default-features = false }
pallet-atomic-trade-engine = { path = "../atomic-trade-engine", default-features = false }
x3-crosschain-intent = { path = "../../crates/x3-crosschain-intent", default-features = false }
# The one Merkle-Patricia receipt-proof verifier in this repository
# (`no_std`/`alloc`), shared with the relayer. The settlement path used to
# compare two roots it read out of the proof and never walked a path, so a
# receipt from any transaction could ride on the latest header (TICKET-063).
x3-verification-router = { path = "../../crates/x3-verification-router", default-features = false }
x3-atomic-swap = { path = "../../crates/x3-atomic-swap", default-features = false }

[dev-dependencies]
# The test fixtures build a real receipts-trie proof (a leaf node and its RLP
# envelope); the pallet itself walks them with `x3-verification-router`.
rlp = "0.5"

pallet-timestamp = { workspace = true }
pallet-balances = { workspace = true }
proptest = "1.4"
secp256k1 = { version = "0.28", features = ["recovery", "rand"] }
rand = "0.8"
x3-asset-kernel-types = { path = "../../crates/x3-asset-kernel-types" }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "log/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "sp-core/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-io/std",
    "sp-api/std",
    "serde/std",
    "ripemd/std",
    "pallet-x3-kernel/std",
    "pallet-x3-atomic-kernel/std",
    "pallet-atomic-trade-engine/std",
    "x3-crosschain-intent/std",
    "x3-atomic-swap/std",
    # The pallet depends on the router with `default-features = false` so the
    # wasm build gets its `no_std` path; the host build has to turn `std` back on
    # explicitly.
    "x3-verification-router/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "frame-benchmarking",
    "frame-benchmarking/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
]
dev-bypass = []
dev = []
testnet = []
