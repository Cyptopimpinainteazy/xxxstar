[package]
name = "pallet-x3-crosschain-gateway"
version = "0.1.0"
edition = "2021"
description = "Substrate pallet for the X3 cross-chain gateway (external deposit lock/mint and burn/release)."
authors = ["X3 Chain Team"]
license = "MIT"
repository = "https://github.com/Cyptopimpinainteazy/x3-chain"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }

frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }

# Verification router provides the proof routing + verifier implementations.
x3-verification-router = { path = "../../crates/x3-verification-router", default-features = false }

serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
log = { workspace = true, default-features = false }

[dev-dependencies]
sp-io = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
# The pallet's own tests exercise the verification plumbing with structural
# proofs (see `deposit_proof_validator_quorum_works` and friends). The stub
# verifiers fail closed unless `test-verifier` is on, and production builds must
# never enable it, so it is requested here - dev-dependencies only. The
# fail-closed posture itself is asserted in `x3-verification-router`'s default
# test configuration and in the audit harness
# (audit-artifacts/.../audit-harness/proof, which enables `production`).
x3-verification-router = { path = "../../crates/x3-verification-router", default-features = false, features = ["test-verifier", "std"] }

[features]
default = ["std"]
std = [
  "codec/std",
  "scale-info/std",
  "frame-support/std",
  "frame-system/std",
  "sp-std/std",
  "sp-runtime/std",
  "serde/std",
  "log/std",
  "x3-verification-router/std",
]
runtime-benchmarks = [
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
]
try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",
]
