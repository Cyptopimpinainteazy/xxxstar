[package]
name = "sp-wasm-interface"
version = "24.0.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://substrate.io"
repository = "https://github.com/paritytech/polkadot-sdk"
description = "Types and traits for interfacing between the host and the wasm runtime."
documentation = "https://docs.rs/sp-wasm-interface"
readme = "README.md"

[dependencies]
anyhow = { version = "1", optional = true }
codec = { package = "parity-scale-codec", version = "3.6.1", features = ["derive"] }
impl-trait-for-tuples = "0.2.2"
log = { version = "0.4", optional = true, default-features = true }
wasmtime = { version = "36.0.7", default-features = false, optional = true }

[features]
default = ["std"]
std = [
	"anyhow?/std",
	"codec/std",
	"log/std",
]
wasmtime = ["anyhow", "dep:wasmtime"]
