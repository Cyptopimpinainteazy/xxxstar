[package]
name = "sc-executor-wasmtime"
version = "0.43.0"
edition = "2021"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage = "https://substrate.io"
repository = "https://github.com/paritytech/polkadot-sdk"
description = "Defines a `WasmRuntime` that uses the Wasmtime JIT to execute."
readme = "README.md"

[dependencies]
log = { version = "0.4", default-features = true }
parking_lot = { version = "0.12.5", default-features = true }
anyhow = "1"
sc-allocator = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-executor-common = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-runtime-interface = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-wasm-interface = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true, features = ["wasmtime"] }
wasmtime = { version = "36.0.7", default-features = false, features = [
	"addr2line",
	"cache",
	"cranelift",
	"demangle",
	"gc",
	"gc-null",
	"parallel-compilation",
	"pooling-allocator",
	"profiling",
	"threads",
] }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "mm", "param", "std", "use-libc"] }
