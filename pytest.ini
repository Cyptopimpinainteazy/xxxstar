[pytest]
# Stale phase duplicates: identical canonical copies are retained under
# tests_core/ and tests_phase4/ and are executed by their phase-specific
# harnesses. These root copies import modules that no longer exist on this
# branch (x3_operator/swarm.db) or collide by basename with phase suites.
addopts =
    --ignore=tests/x3_operator
    --ignore=tests/cross_chain_gpu_validator/test_atomic_invariant.py
    --ignore=tests/cross_chain_gpu_validator/test_ed25519_gpu.py
    --ignore=tests/cross_chain_gpu_validator/test_gpu_parity.py
    --ignore=tests/evm_integration_test.py
    --ignore=tests/phase_core/test_release_bundle_verification.py
    --ignore=tests/phase4/test_release_bundle_verification.py
    --ignore=tests/test_all_blockchains.py
    --ignore=tests/test_fund_allocations.py
    --ignore=tests/test_integration_p3.py
    --ignore=tests/test_json_import.py
    --ignore=tests/test_jury_anchoring.py
    --ignore=tests/test_jury_tokens.py
    --ignore=tests/test_migrations.py
    --ignore=tests/test_monitor_integration.py
    --ignore=tests/test_ollama_wrapper.py
    --ignore=tests/test_process_finalized_payouts.py
    --ignore=tests/test_ralph_agent.py
    --ignore=tests/test_token_lifecycle.py
norecursedirs =
    .git
    .venv
    .wt-*
    build
    dist
    node_modules
    target
    tests_core
    tests_phase4
