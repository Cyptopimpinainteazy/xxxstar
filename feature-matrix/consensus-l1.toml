[[feature]]
id = "X3-L1-010"
name = "Bootnode / peer discovery ops"
subsystem = "consensus_l1"
source = "master"
paths = ["scripts/testnet/public-node-id.sh", "scripts/testnet/build-x3-testnet-spec.py", "scripts/mainnet/peer-id-from-ed25519-pubkey.py", "scripts/testnet/run-7-validators-local.sh", "docs/reports/PUBLIC_TESTNET_LAUNCH.md"]
implemented = 75
tested = 50
mainnet_ready = 40
priority = "P1"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "No bootnode is *running* anywhere public: the tooling to create and publish one now exists (`public-node-id.sh` prints the peer id and `/dns4/…` address from a backed-up key, and `PUBLIC_BOOTNODES` puts that address in the spec), but no host, DNS name or listener outside this machine does",
  "No peer-reputation, ban-list or long-run connectivity tooling; discovery is the libp2p default plus reserved/bootnode wiring proven on one host",
  "No monitoring of peer counts or of a bootnode's availability over time",
]
# This row cited `docs/reports/FUNCTIONAL_ROADMAP.md` — a roadmap document, not the
# implementation. Peer identity is real code now: the peer id is derived from each
# validator's node key by `scripts/mainnet/peer-id-from-ed25519-pubkey.py`, the spec
# builder writes those ids into `bootNodes`, and the launcher refuses to start unless
# every node's derived peer id is one of them.
evidence = ["scripts/testnet/public-node-id.sh", "scripts/testnet/build-x3-testnet-spec.py", "scripts/mainnet/peer-id-from-ed25519-pubkey.py", "docs/reports/PUBLIC_TESTNET_LAUNCH.md", "note: 2026-09-22 — `public-node-id.sh` derives a stable publishable identity (same peer id across runs from the same 0600 key file); `PUBLIC_BOOTNODES=/dns4/…/tcp/30333/p2p/…` builds a spec carrying exactly that address; a three-validator network started from such a spec (with `SKIP_BOOTNODE_MEMBERSHIP_CHECK=1`, the multi-host case) came up on the configured ports, enforced the authority check, and formed a mesh through the launcher's CLI bootnode"]
test_evidence = ["scripts/testnet/run-7-validators-local.sh", "scripts/mainnet/production_genesis_gate.sh", "scripts/testnet/validator-failure-drill.sh", "note: measured first-hand 2026-09-22 — seven validators on one host reach six peers each and agree on one chain (killing two keeps finality, killing a third stops it, restarting restores it); the testnet genesis gate asserts 'validator 1 peer id matches the spec's bootnode entry'. What is untested is any of it across hosts."]

