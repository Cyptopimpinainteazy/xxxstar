[[feature]]
id = "X3-L1-001"
name = "Multi-validator authority network"
subsystem = "consensus_l1"
source = "master"
paths = ["scripts/testnet/run-7-validators-local.sh", "scripts/testnet/build-x3-testnet-spec.py", "scripts/local-network-smoke.sh", "scripts/mainnet/make-fixture-live-spec.sh"]
implemented = 88
tested = 95
mainnet_ready = 73
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "Every validator runs on one host: no independent operators, no geographic or administrative separation",
  "No slashing, jailing or equivocation evidence from a multi-operator network — those paths have unit coverage only",
  "The failure drill kills processes on one machine; network partitions, clock skew and a validator rejoining after a long absence under real vote loss are still unexercised",
  "**2026-09-26 — seven validators, under load, with a removal drill.** The launcher's own seven-authority spec (generated keys, no dev phrase) ran on this host for two hours: one chain throughout, all seven agreeing at heights 9000, 18000 and 27000, +35,938 to +35,940 blocks per validator, peers 6 each, zero stalls beyond 60s, no node lost, worst RSS growth 463.6 MiB against the 1 GiB bound. The same harness now carries load: `LOAD_SECS>0` drives real traffic at the network for the whole window and fails unless it finalized — measured 4 workers, 40,699 finalized transactions, 542.7 finalized TPS, worst error rate 0.0, still one chain and no stall. That closes the row's own open question ('whether a loaded validator can recover') in the direction that matters: a loaded validator kept *up*. The removal drill also passes on seven authorities: the threshold is `n - (n-1)/3` = 5, one validator was killed (verifiably gone) and the observer's finalized height kept advancing — which is the arithmetic that makes seven the specified size, and why a three-validator set cannot lose one at all.",
  "**And the partition is proven where it means something.** The three-authority test (`partition and recovery`, first half) shows the other side honestly: with three GRANDPA authorities one isolation is a majority loss, so the survivors keep authoring and finality correctly stalls. The second half boots a seven-authority network and isolates one validator at the kernel level while it stays alive: measured, **6 of 7 survivors finalized past the watermark (722) while the isolated validator stayed alive at 685 and fell 39 behind**, then after the heal all seven converged on one hash at 750 and finality resumed (722 -> 750 -> 753). Two facts the test records because they cost it a run each: the spec builder and the launcher must share `P2P_BASE` or the mesh collapses to a star with six validators reporting exactly one peer, and a port-scoped cut is only complete if the isolated validator cannot re-dial from an ephemeral source port — hence the inbound-only restart. The cut is confirmed through peer counts on both sides before anything is asserted, and with the socket reset disabled the cut fails to show and the test fails by name.",
  "Era rotation is unexercised",
  "Two hours on a quiet box now holds — one chain, agreement at three heights, +36,092 blocks per validator, peers 3 throughout, zero peer bans, no stall beyond 60s (`.ai/reports/soak-2h-idle-20260922.md`) — so the earlier failure was load-induced: a starved validator falls behind, repeats one block request, and the peer set bans it out, which turns a lag into a partition. What that experiment does **not** show is whether a loaded validator can recover, and nothing throttles a node that is behind its own import queue",
  "Two hours, four validators, release and debug: consensus holds (one chain, agreement at three heights, +36,146 to +36,159 blocks per validator, peers 3, zero peer bans, no stall beyond 60s) and, with the state cache out of the measurement, memory holds too — worst growth 398 MiB against the 1 GiB bound (`<repo>/.wt-agent/soak-100b`, `.ai/reports/soak-2h-idle-20260922.md`). With the default 1 GiB state cache the same node grows ~1.75 GiB, which is configured memory rather than a leak, and the harness now says which cache size it ran with instead of failing every normally-configured node",
]
# The launcher could not run at all before 2026-09-22: it required `subkey` (not
# installed, not part of this repo), its default spec was a storage-raw Live file
# the node's loader refuses, and nodes exited with `NetworkKeyNotFound` because
# nothing supplied a libp2p identity. It now derives keys with the node itself,
# reads the seed files `build-x3-testnet-spec.py` writes, checks every launcher key
# against the spec's authority sets before starting anything, and gives each node a
# stable `--node-key`.
evidence = ["scripts/testnet/run-7-validators-local.sh", "scripts/testnet/build-x3-testnet-spec.py", "scripts/local-network-smoke.sh", "scripts/mainnet/make-fixture-live-spec.sh", "note: 2026-09-22 first-hand — the launcher booted three validators on the shipped local3 plain spec (identity keys inserted through the node, no subkey) and all three agreed on finalized height 504 (0x8f1a0eba1bcba88bffe06df76c2df6a9d02616f7dacb58a68c3aed504c5e6222) with two peers each; the release gate's three-validator boots (shipped, production, testnet genesis) pass in the same pipeline"]
test_evidence = ["scripts/testnet/validator-failure-drill.sh", "scripts/testnet/consensus-soak.sh", "scripts/local-network-smoke.sh", "scripts/mainnet/production_genesis_gate.sh", "scripts/testnet/run-7-validators-local.sh", "note: 2026-09-22 first-hand — seven validators on a *Live* testnet spec all authored and finalized, six peers each, agreeing at heights 900 and 950; the failure drill passed all phases at 7 and at 4 validators (minority down keeps finality, past a third stops it while authoring continues, restart restores one chain), `local-ci --failure` PASS 358s; and a 20-minute soak (`scripts/testnet/consensus-soak.sh`, `local-ci --soak`) held: 1,215 seconds, +4,802 blocks per validator, peers 3 (min 2), the same chain at heights 1273/2546/3819, no stall beyond 60s, no node lost, RSS growth 480–515 MiB per debug node; three validators on the shipped local3 spec agree on finalized 504; the production/testnet Live genesis gates pass"]

