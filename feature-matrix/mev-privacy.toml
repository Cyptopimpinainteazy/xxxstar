  "pallets/x3-kernel/tests/x3_storage_channel.rs",
]
implemented = 85
tested = 80
mainnet_ready = 45
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "Storage is now reachable and journaled, but the writes still do not land in chain state. `evm_sstore`/`evm_sload` (0xB4/0xB3) execute in the *std* interpreter `crates/x3-vm` as of this measurement, so a contract can carry a value between calls **off chain** - but the interpreter a block actually runs is `crates/x3-integration::mini_x3` (the node builds `sc_service::new_wasm_executor`, so the runtime's std feature is off in wasm), and it refuses both opcodes, so on chain a contract cannot carry a value between calls at all. Both halves are asserted on one artifact by `interpreter_agreement.rs::slot_storage_is_implemented_off_chain_and_refused_on_chain` (measured 2026-09-26); the std interpreter's own tests are `evm_store_and_load_round_trip_every_value_kind` and `evm_slot_keys_are_disjoint_from_global_keys`. In the std interpreter and an atomic window's rollback abandons only the window's writes - but `X3Executor::execute` (`crates/x3-integration/src/executor.rs`) returns `state_changes: vec![]` with the comment \"Hostcall state change collection deferred to runtime integration\", and `drain_storage_journal` has no caller outside `crates/x3-vm`'s own tests. A slot a program writes is therefore durable within one VM instance and invisible to everyone else (TICKET-147).",
  "The receipt's `state_changes` channel cannot carry contract storage as it stands. `pallet-x3-kernel`'s `apply_canonical_ledger_update_v2` decodes every entry as (address -> account, key -> asset id, value -> balance) and counts anything else in `DecodeFailureCount`, so routing slot writes through it would inflate a monitoring counter rather than persist a byte (TICKET-147). X3VM contract storage needs its own typed channel before it can be claimed on chain.",
  "The guarantee is proven at the VM level only. No node or validator network has executed a store, and the rollback is exercised by unit tests in `crates/x3-vm` rather than by a live chain, so this is not yet mainnet evidence.",
  "The language VM's host-transaction protocol is unexercised in production: `TradingHost::begin_transaction`/`commit_transaction`/`rollback_transaction` have no caller outside `x3-lang/vm/tests`, and the bytecode-level `ATOMIC_ROLLBACK` in `x3-lang/vm/src/executor.rs` restores VM state (registers, memory, op records, instruction count) without invoking any host hook. That is safe only if a host never applies an effect during execution - a contract that is stated in the trait's docs and enforced nowhere.",
]
required_tests = [
