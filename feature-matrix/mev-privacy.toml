[[feature]]
# Re-measured 2026-09-26 (round 4, workstream C) on commit c85dba7f1 of
# feat/x3-prelaunch-economics-x3lang-cutover (not merged to master): an atomic-trade policy that
# requires private submission now lowers into the same `ModeCheck` the strategy path emits, and
# the IR verifier refuses the policy when that gate is absent or follows the trade. The
# 2026-09-22 provenance note (closed PR #135) is superseded by this block, which is TICKET-101's
# re-measurement for this row.
id = "X3-MEV-002"
name = "Private transaction submission controls"
subsystem = "mev_privacy"
source = "master"
paths = ["x3-lang/compiler", "x3-lang/vm", "crates/x3-common", "crates/x3-compiler", "crates/x3-integration", "pallets/x3-kernel"]
implemented = 90
tested = 85
mainnet_ready = 55
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**Superseded 2026-09-26 — the two entries below describe the tree before `6a3358041`/`23350ca0c`, and both of their central claims are now false; they are kept so the history is readable.** Both interpreters implement `evm_sstore`/`evm_sload` — `mini_x3`, the one a block runs, uses the same key derivation and the same tagged payload as `crates/x3-vm`, and `interpreter_agreement.rs::slot_storage_is_implemented_by_both_engines_and_names_the_same_slot` compares the two journals key byte for key byte — and the writes do land in chain state: the kernel applies them to its own `X3ContractStorage` keyspace through the typed `storage_writes` channel instead of the balance decoder, so `DecodeFailureCount` stays 0 for a storage-writing comit. What is still open is the *read*, not the write: nothing seeds a program's slots from chain state before it runs, so a second comit's `evm_sload` sees the interpreter's empty store rather than the slot the chain persisted; the per-slot weight is under-declared; and no node or validator network has run any of it.",
  "**CLOSED 2026-09-27 — the chain-intake pipeline carries the policy now, and the chain enforces it.** The gap was structural and this entry said so exactly: on-chain `.x3` goes through `crates/x3-compiler` (`compiler_bridge`) into `pallet-x3-kernel`, and `rg` over `crates/{x3-compiler,x3-vm,x3-backend,x3-common}` found zero occurrences of `submission`/`private`/`ModeCheck`, so a program that reached the chain could not demand private submission *at all* — the demand and the enforcement sat on opposite sides of a boundary nothing crossed. Three pieces now cross it. (1) The compiler records the demand: `CompilationOptions::require_private_submission` sets a bit in the artifact's own feature word (`x3_common::bytecode::FEATURE_PRIVATE_SUBMISSION_REQUIRED`, aliased in `x3_backend::bc_format::FeatureFlags`), and `compiler_bridge::compile_source_with_policy` is the intake entry point that takes the policy. The bit deliberately does not raise `min_version_required`: the demand is *interpreted*, and a format bump would make the module unreadable by the very loader meant to read it. (2) The chain enforces it at intake: `pallet-x3-kernel` reads the header on both routes into the VM (`submit_comit_v2` before any state is touched, and `KernelCrossVmDispatcher::execute_x3vm_tx`) and refuses with `Error::PrivateSubmissionUnavailable` when the runtime's `Config::PrivateSubmissionChannel` says this chain cannot meet the demand. (3) The posture is wired rather than assumed: the runtime binds `PrivateSubmissionChannel = RuntimePrivateSubmissionChannel`, which reads `pallet_private_execution::Enabled` — the switch governance already flips — so the entry that said 'no runtime sets it' is answered by construction instead of by a constant. Measured: `pallets/x3-kernel` 240/240 lib tests, `x3-common` 39/39, `x3-x3-integration` compiler-bridge 7/7, `cargo check -p x3-chain-runtime` clean; break-it-first — with the intake guard disabled, exactly `a_program_that_demands_private_submission_is_refused_where_the_chain_offers_none` and `the_demand_is_read_from_the_artifact_not_from_the_compiler` fail and the four controls stay green; restored, 6/6.",
  "**CLOSED 2026-09-27 (same day, second half) — the engines enforce the demand too, and the path that opens when the chain can serve it is now wired end to end.** Intake alone left two holes, and both are closed. (1) Defence in depth: `mini_x3` read the header's feature word as `let _features` and *discarded* it, so an artifact that reached an interpreter by any route skipping the pallet's two call sites would have run in the clear — the shape a policy takes when nothing can enforce it. The reader now keeps the demand, a module carrying it is refused with `X3Error::PrivateSubmissionRequired` unless the execution context says a private channel exists, and the `std` engine refuses the same bytes with the same rule (`X3ExecutorConfig::allow_private_submission`, default `false` in `default()`, `on_chain()` *and* `simulation()`, so 'nobody told me' resolves to the refusal). `both_engines_refuse_a_demanding_artifact_without_a_private_channel` drives one artifact through both engines and requires the same answer. (2) The acceptance direction was wired to the chain's own posture rather than to a constant: `X3ExecutorAdapter::execute_with_slots_and_policy` defaults to ignoring the posture (fail closed — an adapter that does not implement it still hands its engine a channel-less context), and both shipped X3 adapters override it to pass `Config::PrivateSubmissionChannel` into the executor, which the pallet supplies at both call sites. So with the runtime's private channel enabled, a program that demands private submission now reaches a *real* adapter with the posture the chain declared, instead of being refused by an engine default nothing could override.",
  "Still open, and why this is not mainnet-ready: none of it has run on a validator network or against a node. The two-sided proof is a pallet test with the mock adapter plus engine tests, so what is proven is the chain's *decision* and the engines' *agreement*, not an X3VM execution on a live chain under a private channel. The private channel itself is still the part this row never had: `pallet_private_execution::Enabled` can be turned on by governance and no node in this repository ever has been, `submit_private_transaction` is a separate submission route, and no end-to-end private submission has been observed anywhere. The wire format gives the demand no version bite — a loader that predates the bit would ignore it, and in this repository both readers take the constant from `x3-common`, which is what makes them agree rather than a rule the format enforces. Finally, the gas/weight accounting for a demanding program is the same as for any other: the check is a branch, not a priced operation.",
]
required_tests = [
  "a_trading_program_that_requires_private_submission_carries_the_mode_check",
  "a_required_private_submission_reaches_the_artifact_as_a_mode_check",
  "a_private_trading_policy_without_a_mode_check_is_refused",
  "a_mode_check_before_the_trade_satisfies_the_binding",
  "a_mode_check_after_the_trade_does_not_satisfy_the_binding",
  "mainnet_rejects_unattested_private_submission_policy",
  "a_compiled_trading_program_that_requires_private_submission_is_refused_without_a_channel",
  "the_same_trading_program_runs_where_the_channel_exists",
  "a_trading_program_that_does_not_demand_privacy_is_not_gated",
  "compiled_private_submission_requirement_is_enforced",
  "a_program_that_demands_private_submission_is_refused_where_the_chain_offers_none",
  "the_same_program_runs_once_the_chain_offers_a_private_channel",
  "a_program_that_does_not_demand_privacy_is_not_gated",
  "a_chain_with_a_channel_still_runs_programs_that_do_not_demand_it",
  "the_demand_is_read_from_the_artifact_not_from_the_compiler",
  "a_payload_that_is_not_a_module_is_answered_by_the_adapter_not_by_this_check",
  "the_private_submission_policy_is_recorded_in_the_artifact_header",
  "both_engines_refuse_a_demanding_artifact_without_a_private_channel",
]
test_evidence = [
  "note: cargo test --manifest-path x3-lang/Cargo.toml --workspace -> exit 0, 1327 passed, 0 failed, 0 ignored across 102 test binaries (measured 2026-09-26 on c85dba7f1)",
  "note: cargo clippy --manifest-path x3-lang/Cargo.toml --workspace --all-targets -- -D warnings -> exit 0; cargo fmt --manifest-path x3-lang/Cargo.toml --all -- --check -> exit 0",
  "note: break-it-first control - with the lowering change disabled, x3-lang/examples/trading_core_v1.x3 (whose policy requires private submission) ran to Ok(()) under a VM config whose private-submission flag is false, and the three IR-verifier tests failed; restored, all pass",
  "note: cargo test -p pallet-x3-kernel --lib -> 240 passed, 0 failed (measured 2026-09-27); the six private-submission intake tests are `test private_submission_intake::*`",
  "note: cargo test -p x3-x3-integration --features std,compile --test compiler_bridge -> 7 passed, 0 failed; the new case is `the_private_submission_policy_is_recorded_in_the_artifact_header`",
  "note: break-it-first control - with `Self::ensure_private_submission_available(&x3_payload)?` replaced by a no-op call at the `submit_comit_v2` intake, exactly the two refusal tests fail and the four controls stay green; restored, 6/6 green",
  "note: cargo check -p x3-chain-runtime (std) -> exit 0, so the runtime binding `PrivateSubmissionChannel = RuntimePrivateSubmissionChannel` compiles against the real `construct_runtime!`",
  "note: cargo test -p x3-x3-integration --features std,compile --test compiler_bridge -> 8 passed, 0 failed; `both_engines_refuse_a_demanding_artifact_without_a_private_channel` asserts the refusal and the acceptance direction in `mini_x3` and in `X3Executor`, and that both engines classify the same artifact the same way",
  "note: cargo test -p pallet-x3-kernel -> 240 lib + 2 + 9 integration tests pass; the pallet's intake tests were re-run against the policy-aware adapter call, and and the three other pallets whose mock runtimes configure the kernel still build (48 + 31 + 158 + 23 tests)",
  "note: cargo clippy -p pallet-x3-kernel -p x3-x3-integration --all-targets -> exit 0; and with --features std,compile -> exit 0",
]
evidence = ["x3-lang/compiler", "crates/x3-common/src/lib.rs", "crates/x3-compiler/src/options.rs", "crates/x3-integration/src/compiler_bridge.rs", "crates/x3-integration/src/mini_x3.rs", "crates/x3-integration/src/executor.rs", "pallets/x3-kernel/src/lib.rs", "pallets/x3-kernel/src/private_submission_intake.rs", "pallets/x3-kernel/src/adapters.rs", "note: Measured 2026-09-26 (round 4) - the demand is compiled into the artifact, gated ahead of the trade and interpreted by the VM. Measured 2026-09-27 - the chain-intake compiler records the same demand, the pallet refuses the program at intake when the runtime's private channel is off, both engines refuse it independently, and the pallet passes the chain's posture through to the adapter when it is on"]

