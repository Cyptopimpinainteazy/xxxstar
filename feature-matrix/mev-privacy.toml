[[feature]]
# Re-measured 2026-09-27 on `c62f93200`. This row was a STUB whose single blocker
# ("needs threat model covering relayers, finality delays, and ordering") was
# accurate: `CoordinatorConfig::confirmations` (`evm: 12`, `svm: 50`, `x3: 1`)
# had no reader on the release path at all, and `ConfirmationConfig::default()`
# did not exist — the numbers were written inline in `CoordinatorConfig::default()`.
# The release envelope therefore accepted any depth the *submitter's own* proof
# asserted. `docs/CROSS_DOMAIN_MEV_THREAT_MODEL.md` now names the assets, the
# attacker capabilities and the six surfaces; the finality/reorg, secret-reveal
# and unsized-domain surfaces are closed by a policy that derives from that same
# config and is a **required** argument of `for_claim`/`for_refund`; ordering
# (S4), withholding (S5) and adapter honesty (S6) remain open and are what keeps
# `mainnet_ready` at 25.
id = "X3-MEV-001"
name = "Cross-domain MEV protection"
subsystem = "mev_privacy"
source = "master"
paths = ["crates/cross-vm-coordinator"]
implemented = 85
tested = 95
mainnet_ready = 50
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**NARROWED 2026-10-25 — raw caller-chosen ordering beacons are closed.** `VerifiedReleaseBeacon` has private fields and no public constructor. Callers must pass a `ReleaseBeaconPolicy` with policy-owned Ed25519 keys and threshold; every counted attestation signs a statement binding block height, block hash, and attestor identity. Prepared/signed settlements receive `SHA-256(\"X3:CROSS_DOMAIN_RELEASE_ORDER:V1\" || verified X3 block hash || submission id)`, and both in-memory and Valkey outboxes refuse any broadcast that is not canonical next. Still open: the seven-validator authority set must publish these beacon attestations through a production node/service path, and policy key rotation must be governed.",
  "**Withholding is undetectable at this layer (S5).** A relayer who never delivers a settlement cannot be caught by a release gate; the intent runs to its timeout/refund path, so the attacker's gain is the delay itself. `recovery`/`settlement_reconcile` bound the damage; nothing removes the attack.",
  "**The gate enforces the policy against the evidence it is handed, not the adapter's honesty (S6).** `confirmations` and `safe_to_reveal_secret` are fields of the bundle. What is proven is that the coordinator cannot be talked into releasing *too early by evidence that says it is too early* — a fabricated deep-enough proof is the adapter's and the runtime's problem (`verify_runtime_binding`, `verify_claim_set`, matrix rows X3-XVM-*).",
  "**No multi-node chain evidence.** The release ordering and restart behavior now pass against a real local Valkey service, but no independently operated coordinator set has raced settlements against a live X3 validator network. `crates/cross-vm-coordinator` is not in the runtime dependency graph, so this changes what the coordinator submits, not what the runtime enforces.",
]
required_tests = [
  "a_claim_at_the_configured_depth_is_accepted",
  "a_claim_one_confirmation_shallow_is_refused",
  "a_claim_that_is_not_safe_to_reveal_the_secret_is_refused",
  "a_refund_below_the_configured_depth_is_refused",
  "a_domain_the_policy_never_sized_is_refused_instead_of_defaulted",
  "the_policy_uses_the_depths_the_operator_configured",
  "the_secret_reveal_guard_can_only_be_relaxed_explicitly",
  "cross_domain_release_order_refuses_a_later_relayer_choice",
  "release_order_key_changes_with_the_finalized_beacon",
  "live_valkey_cross_domain_release_order_survives_restart",
  "release_beacon_requires_valid_authorized_threshold_signatures",
  "release_beacon_signatures_bind_height_hash_and_attestor_identity",
  "release_beacon_policy_counts_distinct_keys_once",
]
test_evidence = [
  "note: cargo test --features canonical-proofs (in crates/cross-vm-coordinator) -> 132 passed, 0 failed, 0 ignored; the seven new tests are `test settlement_finality::tests::*` (measured 2026-09-27 on c62f93200)",
  "note: cargo test --offline --locked --manifest-path crates/cross-vm-coordinator/Cargo.toml (default features) -> 115 + 41 passed, 0 failed; `bash scripts/local-ci.sh --only test-cross-vm-coordinator` -> PASS 112s, and the gate now also runs the `--features canonical-proofs` set because the default-feature run never compiled this code at all",
  "note: break-it-first control - with the depth comparison weakened to `observed < required && required > u64::MAX`, exactly `a_claim_one_confirmation_shallow_is_refused` and `a_refund_below_the_configured_depth_is_refused` fail and the other five stay green; restored byte-identically, 7/7",
  "note: docs/CROSS_DOMAIN_MEV_THREAT_MODEL.md names the assets, the attacker capabilities and the six surfaces, with the closed/open split and the file:line of each refusal",
  "note: Atomicity/replay/idempotency reduce classes of attacks but do not eliminate MEV; this row now closes three named surfaces rather than claiming the category",
  "note: 2026-10-25 — cargo test --features canonical-proofs -> 142 library tests plus 41 security regressions; cargo test --features valkey,canonical-proofs -> 142 library, 6 distributed chaos, 41 security and 7 live Valkey tests. Strict clippy passes for default, canonical-proofs and valkey,canonical-proofs configurations.",
]
