# Provenance corrected 2026-09-22: cited PR #135 was closed unmerged, so it is not a source: this row's scores were recorded against that draft. Provenance corrected against master on 2026-09-22 by reading the tree; a full re-measurement is TICKET-101; the capability is on master: x3-lang/vm/tests/trading_execution.rs (price-impact and MEV ceilings, fail-closed)
id = "X3-MEV-006"
name = "MEV-resistant architecture"
subsystem = "mev_privacy"
source = "master"
paths = ["pallets/private-execution", "runtime/src/lib.rs"]
implemented = 65
tested = 50
mainnet_ready = 50
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**2026-09-26 — the window runs on a live three-validator chain, and the run found a real defect.** `scripts/drills/ordering_window_live.sh` boots `local3`, enables the lane with a council motion (`set_ordering_windows_enabled`), opens a window, commits from two funded accounts, refuses a reveal that does not hash to its commit *by name* (`OrderingRevealMismatch`), accepts both correct reveals, settles, and then the driver recomputes the canonical order from the beacon the chain stored and requires equality with the settled order — the last check is what would catch a settle that used arrival order. It is the `ordering window on a live chain` gate (32 s). The first run failed, and for a reason no unit test could see: the settle weight was charged for the window's *capacity* (1 MiB of plaintext plus 1024 commitments), which exceeds the block's weight budget, so the pool refused the settle extrinsic with `Transaction would exhaust the block limits` — a window that can be committed into and never settled, holding everyone's bond. The weight is now charged for the window's recorded commitments and revealed bytes, and the runtime's caps are 256 commitments and 256 KiB so even a full window fits. Two earlier live failures were the driver's own and are fixed: byte arguments passed as `Buffer` were decoded as a 190 MB `Bytes`, and the order recomputation hashed the *text* of the stored hex instead of its bytes and 'recomputed' the exact reverse.",
  "**2026-09-26 — the ordering lane was unreachable on any chain running this runtime, and now it is not.** `open_ordering_window` and `commit_ordering` were gated on `Enabled` (private execution) *and* the confidential-validator quorum. On this runtime `AttestationVerifier = RefuseAllAttestations` refuses every attestation by policy, so no confidential validator can ever register, the quorum is never met, and the window could not be opened live at all - a public commit-reveal lane held hostage by confidential-computing state it does not use. It has its own switch now: `OrderingWindowsEnabled`, default **off**, set by `set_ordering_windows_enabled` under the same `AdminOrigin` (`EnsureRootOrHalfCouncil`), with `OrderingWindowsDisabled` as the refusal. Measured: with the switch off a window is refused and a commit reserves nothing; with private execution still off and zero confidential validators, opening and committing succeed - so the two features are provably independent, and `submit_private_transaction` is still refused while private execution is off. Deleting the switch check reddens the guard test; restoring returns 41/41.",
  "The pallet now runs an ordering window on chain, so this is no longer 'private execution and nothing else': `open_ordering_window` / `commit_ordering` / `reveal_ordering` / `install_ordering_beacon` / `settle_ordering_window` drive the `CommitRevealLane` from `crates/x3-order-window` (the same algorithm its 26 crate tests verify), the settled order is stored as the *recomputable* canonical order and the dispatchable asserts the published sequence equals `settlement.canonical_order()`, and bonds are reserved on commit, released on reveal and `slash_reserved` for the unrevealed set with a fail-closed check that the whole amount moved. Measured 2026-09-26 (primary agent, independently of the lane's author): `cargo test -p pallet-private-execution` -> 34 passed, 0 failed; `cargo check -p x3-chain-runtime --features std` -> exit 0, so the `Config` addition type-checks in the runtime; `local-ci --live --only local-node-smoke` -> PASS and `--only local-network-smoke` -> PASS at 0d903e8b1, so a chain boots, authors, finalizes and agrees on its canonical hash with this wiring compiled in.",
  "No complete formal MEV threat model, and 'MEV-proof' is still not claimable. The placement hole is closed as far as a chain can close it, as of `fd95445d3`: `install_ordering_beacon` no longer takes a value, it is permissionless, and the beacon is the hash of the block right after the window closed — a block that does not exist while anyone can still commit — with settlement deriving it independently and refusing a stored value that is not the chain's. What remains is producer bias (the producer of that one block can influence its hash; equivocating is slashable but the beacon is only as unbiased as that producer); the weights for the five new extrinsics are hand-sized rather than benchmarked; nothing has run on a live node; and reveal/settle are deliberately not gated on the `Enabled` switch or the validator quorum (gating them would freeze bonds the chain already took) — so disabling private execution does not stop an open window from settling, which is a policy the operator should confirm rather than discover.",
]
required_tests = [
  "a_settled_window_is_the_canonical_key_order_and_recomputes_from_storage",
  "the_ordering_lane_has_its_own_switch_and_private_execution_keeps_its_guards",
  "the_ordering_lane_has_its_own_switch_and_private_execution_keeps_its_guards",
