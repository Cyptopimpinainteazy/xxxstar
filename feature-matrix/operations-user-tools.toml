blockers = [
  "**CLOSED 2026-09-26 — there is a live restore proof, and it is load-bearing.** This row asked for \"live restore drills and integrity verification\"; the only restore test round-tripped a text file through a tarball, which passes just as well for an empty database. `scripts/snapshot-live-restore-proof.sh` (gate: `snapshot restore across a live chain`, serial, ~25s) boots a real chain, reads the anchor *from the running node* — finalized height, canonical hash at that height, state root, and every storage entry at that height over RPC — stops it, snapshots with `snapshot-restore.sh backup`, restores into a fresh base path, boots a node on the restored database and requires height, hash, state root and the whole state map to come back identical (169 keys). It then boots a **control** node on an empty base path, lets it reach the same height, and requires its hash to differ, so the same check cannot pass for an empty chain. Measured: height 9, hash 0x0193e88c…, control 0x5f51ff2c… Also green: launch-gates/snapshot-murder-test.sh (20 passed) and `cargo test -p x3-state-snapshot` (48 passed).",
  "Still open: the backup refuses a *live* database (`check_validator_stopped`), correctly — a plain tar of a running RocksDB is not a consistent snapshot and the node exposes no `create_checkpoint`. The anchor is read from the running chain, but the archive is cut with the node stopped, so on a multi-GB validator DB that stop is the backup window. A zero-downtime snapshot needs a RocksDB checkpoint or an RPC state-export driver feeding `x3-state-snapshot build`, and the multi-GB size class has never been exercised on this box.",
]
evidence = ["scripts/snapshot-restore.sh", "note: Independent audit previously scored snapshot/restore partial"]

[[feature]]
id = "X3-OPS-003"
name = "Public testnet gate"
subsystem = "operations_user_tools"
source = "master"
paths = ["scripts/mainnet/public_testnet_gate.sh", "scripts/testnet/testnet-ceremony.py", "scripts/testnet/testnet-ceremony-drill.sh", "docs/reports/PUBLIC_TESTNET_LAUNCH.md"]
implemented = 85
tested = 85
mainnet_ready = 52
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "There is no public testnet to gate: measured 2026-09-22 — `rpc.testnet.x3-chain.io`, `faucet.testnet.x3-chain.io` and `bootnode.testnet.x3-chain.io` do not resolve (from a host whose DNS reaches github.com), `gh run list --workflow testnet-deploy.yml` is empty, and every step of docs/reports/TESTNET_DEPLOYMENT_CHECKLIST.md is unchecked",
  "No hosting, DNS, TLS or monitoring is provisioned, so the gate has nothing to point at; its default is `http://localhost:9933`",
  "The gate is RPC-only: it cannot see whether the network is *independently* operated, which is the property a public testnet exists to demonstrate",
  "**2026-09-26 — the gate runs, and it reads the chain's own numbers.** It was run against a real seven-validator testnet network (on this one host): 14 of 15 criteria PASS and the 15th is a SKIP. Reaching that took three real defects out of the way, each measured: gate 1 counted `peers + 1` and called it a validator count (`GrandpaApi_grandpa_authorities` is a hex SCALE blob and `jq length` on it is a parse error, so the code fell through to the fallback — it reported `found 6, need 7` on a seven-authority chain with one validator stopped), gates 10 and 11 issued `cargo test -p X name1 name2`, which is `error: unexpected argument` (one positional filter only — both criteria could never pass, whatever the tests did), and gate 5 looked for treasury/faucet fields no real spec has. Gate 6 (72-hour stability) is the SKIP: `X3_TESTNET_HOURS=0` is the CI form and the timer cannot be answered on this box. The verdict now says `PASS with skipped criteria` and names it, where it used to claim all criteria were met.",
  "**2026-09-26 — criterion 14 is environment-dependent, and on this box it is what fails.** `explorer_or_dashboard` passes only if something is actually serving on 3000, 3001 or 8080. `apps/dashboard` and `apps/explorer` exist in the tree and nothing serves them here, so a healthy seven-validator network still ends in `public_testnet_gate: FAIL` on that one criterion (re-run 2026-09-26: 13 PASS, gate 6 SKIP, gate 14 FAIL). The recorded 14-of-15 run had a dev server up at the time, and the criterion is weak enough that any process on those ports satisfies it — the wallet app's own `next dev -p 3001` counts as an explorer. A launch gate should name the explorer it reached, not a port range.",
  "The gate is still RPC-only: it cannot see whether the network is *independently* operated, and it has only ever run against loopback networks on one host. Hosting, DNS, TLS and monitoring remain unprovisioned.",
]
evidence = ["scripts/mainnet/public_testnet_gate.sh", "scripts/testnet/testnet-ceremony.py", "scripts/local-ci.sh", "docs/reports/PUBLIC_TESTNET_LAUNCH.md", "note: two runnable gates — the 25.6 kB RPC gate (system_health, GRANDPA authorities, bridge storage, block height over `--rpc-base-url`) and the ceremony verifier (genesis hash, spec sha256, runtime version, authority set, peer ids, finality; seen to reject a tampered manifest) — plus a spec builder that takes published `PUBLIC_BOOTNODES` and a bootnode identity tool, so the operator path up to 'point the gate at a hosted endpoint' is written down and exercised; `bash scripts/local-ci.sh --testnet --only testnet-ceremony-drill` PASS 290s"]
# The gate's own numbers, re-run rather than remembered. The drill boots a generated
# seven-authority network, points the gate at it, and requires criterion 1 to report the
# authority set *and* the reachable count from the chain — then stops one validator and
# requires the same criterion to fail, so it cannot pass on a constant.
test_evidence = [
  "scripts/testnet/public-testnet-gate-drill.sh",
  "scripts/mainnet/public_testnet_gate.sh",
  "scripts/testnet/x3_testnet_up.sh",
  "note: `bash scripts/testnet/public-testnet-gate-drill.sh --self-test` PASS on 2026-09-26 against a generated seven-authority network (validators on rpc 19820-19826). Criterion 1 reported `authority set: 7, reachable now: 7 (peers: 6)` — the authority set read from `GrandpaApi_grandpa_authorities`, the reachable count from `system_health`; criterion 12 (live RPC smoke) PASS; then the self-test stopped node 7 and required the same criterion to fail, and it did: `7 authorities configured but only 6 reachable (peers: 5)`. Across all fifteen criteria on that healthy network: 13 PASS, 1 SKIP (6, the 72-hour timer, `X3_TESTNET_HOURS=0`) and 1 FAIL (14, explorer/dashboard — see the blocker above), so the gate's overall verdict is FAIL and the drill says which criteria it owns rather than hiding the rest. Three of the passes are not chain properties: 7, 8 and 9 read drill reports on this box, and 13 runs the wallet app's own jest suite.",
]

