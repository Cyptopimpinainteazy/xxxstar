# Operations / User Tools feature matrix fragment.

[[feature]]
id = "X3-OPS-001"
name = "Genesis ceremony tooling"
subsystem = "operations_user_tools"
source = "master"
paths = ["scripts/mainnet/genesis_ceremony.sh"]
implemented = 75
tested = 45
mainnet_ready = 35
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "The mainnet ceremony itself has not been run: `genesis_ceremony.sh` requires a tagged release commit and srtool, and no tag exists",
  "No ceremony record is published for anyone to verify a launch against (spec sha256, genesis hash, authority set, escrow addresses, spec_version)",
]
# The *local* half of a ceremony is exercised today: `build-x3-testnet-spec.py` derives
# fresh authorities, writes per-validator seeds and node keys, derives bootNodes from
# them, builds a plain Live spec, asserts it carries every bootnode, and prints the
# launch command; `x3_testnet_up.sh` resolves that spec and refuses a raw Live one. What
# is missing is the tagged-commit, mainnet-preset half with published artifacts.
evidence = ["scripts/mainnet/genesis_ceremony.sh", "scripts/testnet/build-x3-testnet-spec.py", "scripts/testnet/x3_testnet_up.sh", "note: `genesis_ceremony.sh` (15.6 kB) is real and deliberately halts on anything not production-grade: tagged commit, srtool-only WASM, mainnet preset, artifact sha256s, summary report; the local builder/launcher path above is the testnet-shaped rehearsal of the same steps and was exercised 2026-09-22 (4-authority Live spec booted through `x3_testnet_up.sh`, one chain at heights 1000 and 1050)"]

