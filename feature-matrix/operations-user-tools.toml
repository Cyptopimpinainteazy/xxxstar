[[feature]]
id = "X3-OPS-010"
name = "Prometheus/Grafana-style ops monitoring"
subsystem = "operations_user_tools"
source = "master"
paths = ["docs", "scripts/monitoring", "monitoring/local3"]
implemented = 88
tested = 90
mainnet_ready = 60
priority = "P2"
confidence = "medium"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-26 — metrics *and* logs are live across all three validators, and both are gated.** `monitoring across validators` boots the built-in `local3` chain with a Prometheus exporter per validator and requires each one to identify itself from its own scrape: `substrate_build_info{name=…}` matching the target label, chain `x3_chain_local3`, finalized height past genesis, two peers, authority role — then requires all three to agree on the canonical hash at the lowest finalized height any reported. The checked-in scrape config drives the ports the gate boots on, and every metric the checked-in Grafana dashboard references must exist in the live scrape. `logging across validators` requires each validator's log stream to be collected under one queryable sink and to carry its own identity, imported blocks and finalized blocks: measured 264/266/149 lines, last imported #63/#63/#64, last finalized #60 on all three. Both gates have `--self-test` negative controls (hold a validator's metrics or its stream out of the collection and the same query must fail), and both were measured failing.",
  "The log-level finding is part of the fix, not a footnote: a node started without a filter emits warnings only — 13 lines of banner per validator, no chain identity, no imports, no finality — so the collection contract includes the level.",
  "**CLOSED 2026-09-26 at testnet scale — seven validators, not three.** `scripts/monitoring/testnet7-observability-check.sh` (gate: `observability across seven validators`, ~45s, serial) builds a generated seven-authority spec, boots it with the launcher, and requires per validator: its own exporter answering 200, the node's `substrate_build_info{name=...}` label matching the validator it was scraped from, the chain label, a finalized height past genesis, the mesh peer floor, and a non-full-node role; then that all seven agree on the canonical hash at a common finalized height, that each of the seven collected log streams carries identity/imports/finality, and that one aggregate query over the sink reaches all seven sources. Measured: seven nodes named x3-testnet-node-01..07 on chain x3_chain_testnet, finalized 75..95, peers 6, role 4, logs at last imported #104 and finalized #99..#101. `--self-test` holds one validator out of both collections and requires both checks to fail (`only 6 of 7 observed`, `the aggregate query reaches 6 of 7 streams`). Four findings that only appear at this size: the spec's bootNodes are built from `P2P_BASE` (build the spec for the base you launch on, or the mesh collapses to one hub and six validators report exactly 1 peer); 'a finalized head exists' is not finality (a fresh node answers with the genesis hash at height 0, so the weak check passes at `best=1, finalized=0`); the exported finalized gauge lags its own node (measured: RPC past height 6 while the metric read 0); and demanding `COUNT-1` peers from every node fails a healthy network (the two-hour soak measured a minimum of 5).",
  "**CLOSED 2026-09-26 — a real Prometheus and a real Grafana, scraping and rendering all seven validators.** The previous note was that no metrics server or dashboard server was installed. Both are now installed and the check uses them: it generates a per-validator scrape config (one job per validator carrying its own `validator` label, the shape the dashboard's `$validator` template variable is built from), validates it with `promtool check config`, starts Prometheus, and requires `count(up{job=~\"x3-validator-node-.*\"} == 1)` to be all seven. Then it starts Grafana with the Prometheus datasource provisioned, requires the datasource health endpoint to answer `OK`, imports the dashboard this repository ships, and asks one of that dashboard's **panel expressions** through Grafana's `/api/ds/query` — which returned 7 series, one point per validator. Measured: `a real Prometheus (promtool-validated config) scrapes 7 of 7 expected validators: all up`, `Grafana imported the shipped dashboard (success x3-local3-validators)`, `that panel returns 7 point(s) through Prometheus`. The self-test holds a validator out of the target list and out of the log collection and requires all three checks to drop to six.",
  "**CLOSED 2026-09-26 — a real collector ingests all seven streams.** The previous note was that the log half was a directory of files rather than a collector. Fluent Bit is installed and the check now runs one: a tail input per validator with its own tag, one file output as the sink, and the collector metrics required to show records ingested for every validator (`fluentbit_input_records_total{name=\"tail.N\"} > 0`). Measured: `Fluent Bit ingests 7 of 7 validator streams into 7 attributable sink file(s)` — one sink file per tag, each holding that validator finalized-block lines, so the collected stream is attributable per validator rather than one merged blob. Under `--self-test` the held-out validator is left out of the target list, the scrape, the log collection and the collector, and all four checks drop to six. The gate sets `X3_OBSERVABILITY_REQUIRE_REAL=1`, so a missing Prometheus, Grafana or Fluent Bit is a failure naming the install rather than an `info` line that reads like a pass.",
  "Still open: this is one host — seven validators, one Prometheus, one Grafana, one collector — with no retention policy, no alert rules and no multi-operator story, and the collector sink is a local directory rather than the store an operator would actually run (Loki, OpenSearch, a vendor).",
]
evidence = ["docs", "note: Monitoring concepts present but operational proof incomplete"]
# Both scales are exercised, and both have a negative control. The three-validator path and the
# seven-validator path each boot a real network, scrape it, and then hold a validator out and
# require the same check to fail — so a green line here is a run, not a design note.
test_evidence = [
  "scripts/monitoring/local3-monitoring-check.sh",
  "scripts/monitoring/local3-logging-check.sh",
  "scripts/monitoring/testnet7-observability-check.sh",
  "monitoring/local3/prometheus-local3.yml",
  "monitoring/local3/grafana-x3-validators.json",
  "note: measured 2026-09-26 at seven validators (`observability across seven validators`, serial) — seven nodes named x3-testnet-node-01..07 on the testnet chain id, per-validator exporter answers with the build-info node label matching the validator it was scraped from, finalized height past genesis, mesh peer floor and a non-full-node role; then all seven agree on the canonical hash at a common finalized height, each of the seven collected log streams carries identity, imports and finality, and one aggregate query reaches all seven sources. A real Prometheus was started against a promtool-validated generated config and required to report all seven targets up, a real Grafana imported the dashboard this repository ships and returned one point per validator for one of that dashboard's own panel expressions, and a real collector was required to show records ingested for every validator, one attributable sink file per stream. `--self-test` holds one validator out of the scrape and out of the log collection and requires all four checks to drop to six, so the checks are known to be able to say no. The gate sets `X3_OBSERVABILITY_REQUIRE_REAL=1`, so a missing Prometheus, Grafana or collector is a failure that names the install rather than an informational line that reads like a pass. The log-level finding is part of the contract: a node started without a filter emits warnings only and no chain identity, so the collection requires the level.",
]

[[feature]]
# Recorded 2026-09-25 against the code: `crates/x3-wallet` was cited by no row, run by no gate, and
# its hardware-wallet verifier accepted bytes it could not verify.
id = "X3-OPS-011"
name = "Wallet signing crate (hardware signatures)"
subsystem = "operations_user_tools"
source = "master"
paths = ["crates/x3-wallet/src"]
implemented = 55
tested = 40
mainnet_ready = 20
priority = "P1"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-25 — `HardwareWalletEngine::verify_signature` returned `Ok(true)` for bytes it never verified.** It refused an empty signature and a short one, then set `verified = true` unless `recovery_id > 3`: `tx_hash` was never read, the public key was never used and no ECDSA recovery or check ran, so any 64-byte blob with an in-range recovery id was reported as a verified hardware signature, bound to no transaction. The device's signing convention (message pre-hash, public-key encoding, derivation-path binding, recovery-id semantics) is defined nowhere in this repository and there is no device or test vector to pin it, so the directive's fail-closed branch applies: it refuses every input now, with an error saying verification is not implemented, and the two tests that pinned the old behaviour assert the refusal instead.",
  "**OPEN — `approve_signature` still records `verified: true`.** A device approval is not a verification and the field name says otherwise; the struct derives `Encode`/`Decode`, so renaming it or keeping it as 'the device approved this request' is an interface decision this row has not taken.",
  "**OPEN — nothing proves the crate talks to a real device.** No Ledger/Trezor integration test, no device fixture, and `crates/x3-wallet-cli` answers its commands with 'not implemented: this CLI does not talk to a node yet'.",
  "**OPEN — a signature convention has to be pinned before verification can be implemented.** Until a device, a test vector and the pre-hash are recorded, `verify_signature` refusing is the only honest state.",
]
required_tests = [
  "test_verify_signature",
  "test_verify_signature_refuses_a_well_shaped_but_unverifiable_signature",
  "test_verify_signature_empty",
  "test_verify_signature_invalid_recovery_id",
]
test_evidence = [
  "note: `test x3-wallet` (added 2026-09-25 — the crate's 174 tests ran in no gate before that) passes; the refusal tests are crates/x3-wallet/src/hardware_wallet.rs and the real Ed25519/Sr25519 checks, which refuse tampered, retargeted and truncated input, are crates/x3-wallet/src/transaction_signer.rs",
]
evidence = ["crates/x3-wallet/src/hardware_wallet.rs", "crates/x3-wallet/src/transaction_signer.rs", "note: 2026-09-25 - the hardware verifier was fail-open on shaped bytes and the crate's tests ran in no gate"]
