launch_scope = "guarded"
claim_risk = false
blockers = [
  "The mainnet ceremony itself has not been run: `genesis_ceremony.sh` requires a tagged release commit and srtool, and no tag exists",
  "The ceremony record exists but is only produced and checked locally: nothing publishes a signed manifest, and the recorded node binary is a debug build",
  "The recorded launch is loopback (four validators on one host) and its bootnodes are /ip4/127.0.0.1/... entries",
]
# The rehearsal of the whole ceremony now runs, and it produces the artifact a launch
# can be verified against: `testnet-ceremony.py record` writes the spec sha256 (and
# size), the node binary sha256, the chain name/id/type, the genesis hash the network
# reports, the runtime version, the authority sets from the spec, and every validator's
# peer id and finalized height; `verify` re-checks all of it against a running network,
# one line per check. `--testnet` runs the drill: build spec → boot four validators →
# record → verify → tamper with a copy → require the verifier to reject it.
evidence = ["scripts/mainnet/genesis_ceremony.sh", "scripts/testnet/testnet-ceremony.py", "scripts/testnet/testnet-ceremony-drill.sh", "scripts/testnet/build-x3-testnet-spec.py", "note: 2026-09-22 first-hand — the drill records `X3 Chain Testnet` (Live, id x3_chain_testnet) with genesis 0xa1005528d8d6ec35693e37f8d72a85408067aabeca8fa7f8a6379184628000ad, spec sha256 a3cc9e39719fe017…, 4 aura / 4 grandpa authorities and every validator's peer id + finalized height (273 at record time, 3 peers each); `verify` passes every check against the live network and fails a manifest whose genesis hash was tampered with. `genesis_ceremony.sh` (15.6 kB) remains the mainnet, tagged-commit half"]

