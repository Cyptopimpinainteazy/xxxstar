claim_risk = false
blockers = [
  "There is no public testnet to gate: measured 2026-09-22 — `rpc.testnet.x3-chain.io`, `faucet.testnet.x3-chain.io` and `bootnode.testnet.x3-chain.io` do not resolve (from a host whose DNS reaches github.com), `gh run list --workflow testnet-deploy.yml` is empty, and every step of docs/reports/TESTNET_DEPLOYMENT_CHECKLIST.md is unchecked",
  "No hosting, DNS, TLS or monitoring is provisioned, so the gate has nothing to point at; its default is `http://localhost:9933`",
  "The gate is RPC-only: it cannot see whether the network is *independently* operated, which is the property a public testnet exists to demonstrate",
  "Both gates have only ever run against loopback networks on one host",
]
evidence = ["scripts/mainnet/public_testnet_gate.sh", "scripts/testnet/testnet-ceremony.py", "scripts/local-ci.sh", "docs/reports/TESTNET_DEPLOYMENT_CHECKLIST.md", "note: two runnable gates now exist — 25.6 kB RPC gate that checks system_health, GRANDPA authorities, bridge storage and block height against `--rpc-base-url`, and the ceremony verifier that checks a running network against a recorded manifest (genesis hash, spec sha256, runtime version, authority set, peer ids, finality) and has been seen to reject a tampered manifest; `bash scripts/local-ci.sh --testnet --only testnet-ceremony-drill` PASS 290s. The README no longer advertises the endpoints as live."]

