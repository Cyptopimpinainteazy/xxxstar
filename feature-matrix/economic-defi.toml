[[feature]]
id = "X3-ECO-002"
name = "Pending supply returns-to-zero invariant"
subsystem = "economic_defi"
source = "master"
paths = ["pallets/x3-supply-ledger/src/lib.rs"]
implemented = 60
tested = 78
mainnet_ready = 35
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-25 — the invariant is proven on the transitions, not on a struct.** The pallet had no mock runtime, so `SupplyLedgerWrite` (`debit_source_to_pending`, `credit_destination_from_pending`, `refund_pending_to_source`) — the three calls every cross-domain operation goes through — had no test at all; the S0-1 file builds `SupplyLedger` values by hand and says in a note that it needs a runtime. `pallets/x3-supply-ledger/src/mock.rs` supplies one, and `tests_conservation.rs` drives the real paths: pending returns to zero after every settle or refund (`pending_supply_returns_to_zero_when_every_leg_is_resolved`), and 200 random leg sequences never leave it accumulating (`prop_random_leg_sequences_conserve_supply`). A refused transition leaves the ledger byte-for-byte identical, so a failed leg cannot strand or duplicate supply.",
  "Still open on this row: the invariant is proven for one ledger view in one process — not under concurrent cross-domain traffic on a multi-validator network, and not against each bridge's own observation path (that is X3-XVM-002). The pallet's suite also ran in no gate until 2026-09-25, when `test x3-supply-ledger` was added to the fast set.",
]
required_tests = [
  "pending_supply_returns_to_zero_when_every_leg_is_resolved",
  "prop_random_leg_sequences_conserve_supply",
  "a_refused_transition_does_not_mutate_the_ledger",
]
test_evidence = [
  "note: all three are in pallets/x3-supply-ledger/src/tests_conservation.rs, run by the `test x3-supply-ledger` gate (2026-09-25)",
]
evidence = ["pallets/x3-supply-ledger/src/lib.rs", "note: Registry corrections call out missing supply invariant tests", "note: 2026-09-25 - the transitions are now driven by a real test runtime and a property suite"]
registry_feature = "atomic_kernel"
[[feature]]
id = "X3-ECO-003"
name = "Supply conservation ledger"
subsystem = "economic_defi"
source = "master"
paths = ["pallets/x3-supply-ledger/src/lib.rs"]
implemented = 65
tested = 80
mainnet_ready = 45
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-25 at the ledger level.** The conservation law is `represented() = native + evm + svm + external_locked + pending` never exceeding the canonical ceiling, and every transition being a relabelling rather than a creation: debit moves source -> pending, credit moves pending -> destination, refund moves pending -> source. `tests_conservation.rs` asserts exactly that after every step of the success path (native -> EVM), the external route (native -> `external_locked`), the rollback path (debit then refund restores the ledger bit-for-bit), the duplicate-settle case (a replayed settle is refused), the halt/pause cases (new legs refused, refunds still allowed), and 200 random leg sequences. The mint path's own conservation is covered too: a governance mint raises the ceiling with the supply, and a replayed nonce moves neither.",
  "**HALF CLOSED 2026-09-26 — concurrent traffic on a multi-validator network now has a conservation proof, for native balances.** That was one of this row's three open items ('concurrent cross-domain traffic under a multi-validator network'). `node/tests/supply_invariant_distributed.rs` (gate: `supply invariant across validators`, ~200s, serial — it binds node ports) boots the three-validator `local3` chain from one frozen node binary, drives five comits per account into all three validators concurrently — each one required to have an execution receipt on a validator that never received it — and then, at one finalized block, reads the conservation identity from **each validator's own state**: `sum(free + reserved)` over every `System::Account` enumerated with `state_getKeys` at that block hash versus the runtime's own `AtlasKernelRuntimeApi::get_total_issuance()` at the same hash. Measured: baseline 8 accounts, 8000000000000000000 == 8000000000000000000 on all three; after traffic, finalized block 107, all three report accounted 7999999998338644985 == TotalIssuance 7999999998338644985, and the fall in account balances equals the fall in issuance exactly (each account paid 553785005). Load-bearing: injecting one unit into `Balances::TotalIssuance` in a scratch genesis makes the same check fail by exactly that unit (`delta 1`).",
  "Still open, and why `mainnet_ready` does not move further: the per-asset identity this row exists for — `represented() = native + evm + svm + external_locked + pending` never exceeding the canonical ceiling — has no read surface over RPC, so the distributed proof above covers the **native** side only; and a *real* external bridge observation (a lock on another chain being seen and recorded) is still unexercised, as is the router's own accounting reconciled against the ledger on a live network.",
]
required_tests = [
  "every_leg_of_the_lifecycle_conserves_the_represented_total",
  "a_replayed_mint_nonce_cannot_mint_twice",
  "prop_random_leg_sequences_conserve_supply",
  "a_halt_or_a_pause_blocks_new_legs_but_still_lets_the_pending_one_come_back",
]
test_evidence = [
  "note: all four are in pallets/x3-supply-ledger/src/tests_conservation.rs, run by the `test x3-supply-ledger` gate (2026-09-25)",
]
evidence = ["pallets/x3-supply-ledger/src/lib.rs", "note: Independent audit previously scored supply ledger partial", "note: 2026-09-25 - the ledger's conservation law is asserted on the real transition functions, including refusal-immutability"]
registry_feature = "atomic_kernel"
