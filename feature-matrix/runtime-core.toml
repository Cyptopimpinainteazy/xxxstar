blockers = [
  "**Closed 2026-09-23 — bundle finalization is authorized now.** The unsigned `submit_finalization_result` extrinsic was removed: it was `ensure_none`, its off-chain marker (`x3fin:`) had no writer anywhere in this repository, and `do_finalize_bundle`'s certificate check compared the caller's input with the caller's own earlier input, so any account could finalize any `Executing` bundle. Finalization is the signed `finalize_atomic_bundle` (`X3LangOrigin`, an account the chain's genesis-authorized custody registry names) or `finalize_with_settlement` (`SettlementOrigin`). Evidence: `.ai/reports/unsigned-finalization-removed-20260923.md`; five tests in the pallet drive the finalization core, plus one that an unsigned origin cannot reach it at all.",
  "**CLOSED 2026-09-26 — the invariant suite exists, and it is asserted directly rather than inferred from the happy path.** Five tests, each one an invariant the bundle lifecycle has to hold: `a_finalized_bundle_cannot_be_rolled_back` (and the bond and status are unchanged after the refusal), `a_rolled_back_bundle_cannot_be_finalized_and_cannot_be_rolled_back_twice` (no second release, no finality proof), `a_leg_receipt_is_written_once_and_keeps_its_first_state_diff` (a replayed receipt is refused and the first diff survives), `a_receipt_for_a_leg_outside_the_bundle_is_refused`, and `a_submission_nonce_cannot_be_spent_twice_or_rewound` (replay, rewind, and the fact that a *refused* submission spends no nonce — with `BundleAlreadyExists` asserted as its own rule, since the bundle id derives from the legs). Measured load-bearing: removing the `LegAlreadyExecuted` guard turns the receipt test red at its own assertion, then the file was restored byte-identically. The suite runs under the `test atomic-kernel` gate: 71 lib tests plus the e2e/loom/miri/proptest targets, all green.",
  "**CLOSED 2026-09-27 — the anchor is a value the chain derives, so winning the first-write race chooses nothing (TICKET-107).** `record_flash_finality_anchor` is unsigned, keeps the first value for a height, and `do_finalize_bundle` accepts a bundle only when `finality_cert` equals that stored value — so whatever was in the map *was* the certificate, and a peer who got there first chose what the chain would attest to in the PoAE proof. The extrinsic now stores a value only if it is `derive_finality_cert(block_num)`, which is `blake2_256` of the block's own hash — the same digest the node's GRANDPA path computes, reached through one shared definition (`finality_cert_from_block_hash`) so the node and the runtime cannot drift. A height the chain holds no hash for is refused instead of being folded into a digest of zeros, so missing a block and a block hashing to zero stay distinguishable. `do_finalize_bundle` is unchanged: the equality rule is the same rule, and only the set of values reachable through the anchor shrank to one. The Flash branch in `node/src/service.rs` no longer anchors the Flash certificate's own hash, which no runtime can verify because that needs the voter's keys; it logs it and says why. Measured load-bearing: with the `ensure!(cert == derived)` line removed, `a_fabricated_finality_anchor_is_refused` and `only_the_certificate_the_chain_derives_can_be_anchored` both go red with `left: Ok(())` — the fabricated anchor is accepted — and the file was restored byte-identically. Still open on this row: no certificate has been anchored on a live network (that is X3-RT-005's multi-validator proof), and the Flash certificate hash is kept off chain only, so a runtime-side verifier for it does not exist",
]
evidence = ["pallets/x3-atomic-kernel/src/lib.rs", "pallets/x3-atomic-kernel/src/chain_legs.rs", "pallets/x3-atomic-kernel/src/benchmarking.rs", "node/src/service.rs", "note: spec 24 - leg receipts are chain-produced: the unsigned `record_leg_execution_receipt` refuses every call, legs run on chain through the signed `execute_bundle_leg` as the executor, and rollback applies only a journal whose hash `ChainJournal` recorded; the receipt-once and out-of-range tests were renamed to the journal they now pin; on the real runtime `runtime/src/tests.rs::chain_executed_legs_are_undone_exactly_by_a_rollback` runs a ledger transfer and a compiled X3 slot write as legs and rolls both back", "note: FEATURE_REGISTRY corrected readiness to 40%", "note: 2026-09-27 - the anchor's provenance is the fix; the row's mainnet_ready deliberately stays at 35 because nothing on it has run against a network"]
