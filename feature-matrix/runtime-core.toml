  "**CLOSED 2026-09-26 — the halt permits recovery, and the tests that say so are named here.** The open item was \"required tests not yet proven in canonical registry\". They exist and are gated (`test atomic-kernel`, `test x3-kernel`): `economic_halt_does_not_trap_pending_bundle_funds` halts the economy with a bundle already submitted and requires `rollback_atomic_bundle` to succeed *anyway*, releasing the whole bond while a new submission is still refused with `EconomicHaltActive` — and asserts the balances, the 50% cancel penalty and that total issuance is unchanged (slashed funds move to the treasury rather than being burned). `economic_halt_blocks_bundle_submission` pins the fail-closed half, including that lifting the halt restores work.",
  "The kernel's own pause gets the same treatment: `emergency_pause_blocks_submit_comit` (refuses), `test_emergency_halt_recovery_restores_functionality` (the same caller and nonce succeed again after `emergency_unpause`), and, added 2026-09-26, `a_pause_leaves_committed_state_readable_and_the_nonce_sequence_intact` — a comit accepted before the pause stays byte-identical in storage while paused, a submission the pause refuses leaves the account's nonce untouched, and the same nonce works after resuming. Measured load-bearing: deleting the `ProtocolIsPaused` guard from `submit_comit` turns that test red at its `assert_noop!`, then the file was restored byte-identically.",
  "**2026-09-26 — both switches were driven together, and then the gate itself turned out to be the trap.** The three named unproven things are measured: `the_emergency_halt_reaches_the_atomic_kernel_through_the_runtime` walks `pallet_x3_kernel::emergency_halt` → `RuntimeEmergencyHaltController::trigger` → `pallet_x3_supply_ledger::TransferHalted` → the atomic kernel refusing the bundle the gateway submitted a moment earlier with `EconomicHaltActive`; `a_kernel_pause_leaves_a_pending_atomic_bundle_recoverable` cancels a bundle *while paused* and requires the record to reach `RolledBack`, the bond to come back, the 50% penalty to be kept and total issuance to be unchanged.",
  "**The recovery path this row is named for did not exist above the dispatch layer, and that was a P0.** `pallet_x3_invariants::InvariantCheck` is in `SignedExtra` and refused *every* signed extrinsic while `Halted` was set — including the halt's own remedy. Measured at the transaction-validity layer (the layer that stops a chain, not dispatch): `runtime/src/tests.rs::a_halted_chain_still_accepts_the_recovery_calls_that_release_funds` builds the same signed extrinsic the node's RPC and signer build, halts through the kernel, and shows `rollback_atomic_bundle`, `clear_halted`, `resume_transfers` and the council motion all refused with `INVARIANT_HALT_CODE` / `Custom(1)`. A pending bundle's bond was unreachable and the flag could not be cleared by any call the chain has: `clear_halted` was named in two doc comments and did not exist. Fixed in `6d7bfc540` — the gate now exempts a short justified list (`clear_halted`, `set_halt_on_violation`, `resume_transfers`, `rollback_atomic_bundle`, `emergency_unpause`, council `propose`/`vote`/`close`/`execute`) and refuses everything else; `clear_halted` now exists. The same test drives both flags to false with the origin `Council::close` produces, requires ordinary traffic to validate again, and requires a `Members(0, 2)` minority to be refused. Load-bearing: deleting the exemption reddens it at \"the bond-releasing rollback must not be refused by the halt\"; restoring the file returns 57/57 runtime tests and 26/26 pallet tests.",
  "**2026-09-26 — the halt/unhalt cycle now runs on a live three-validator chain.** `scripts/drills/halt_recovery_live.sh` (gate `halt recovery on a live chain`) trips the halt through a council motion (the only route the chain has), requires `x3Invariants.halted` and `x3SupplyLedger.transferHalted` to be set, and then measures both halves at once: a signed `balances.transferKeepAlive` is refused by the **pool of two different validators** with `1010: Invalid Transaction: Custom error: 1` while the destination balance does not move, and `x3AtomicKernel.rollbackAtomicBundle` on a non-existent bundle **is included in a block** and refused by the pallet (`x3AtomicKernel.BundleNotFound`) — so the bond-releasing call is not blocked by the halt. The remedy then goes in *while the chain is still halted*: council motions for `x3Invariants.clearHalted` and `x3SupplyLedger.resumeTransfers` both execute, the flags read false, and a transfer afterwards is `InBlock` and moves the balance. Load-bearing on the live path: with the exemption check removed the same drill fails at the remedy — `submitExtrinsic` for the motion's own `propose` returns `1010: Invalid Transaction: Custom error: 1`, which is the one-way door (evidence in `.ai/runlogs/halt-recovery-live-20260927T010259Z/`); restoring the file byte-identically returns the PASS.",
  "Still open: the exemption list is a runtime policy, not a proof — a pallet that holds funds and has no rollback extrinsic would still be trapped, and nothing enumerates the runtime's fund-holding calls against the list (TICKET-153). The halt is cleared only by an explicit governed call; there is no automatic unhalt once the violating invariant is back inside its bound, and no test drives the re-raise sequence (clear while the violation persists). `clear_halted`'s weight is hand-written to `set_halt_on_violation`'s shape, not benchmarked. The live drill halts an idle chain: no bundle is in flight while the halt lands.",
]
