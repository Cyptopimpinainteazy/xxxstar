  "note: 2026-09-27 - `pallets/x3-flashloan/src/weights.rs` and `pallets/x3-reservation/src/weights.rs` are new: three calls each, all literals. Two traps showed up here. (1) `define_benchmarks!`'s location name has to match the `construct_runtime!` pallet alias exactly — `X3FlashLoan`, not `X3Flashloan` — because the macro resolves it at the crate root, where the `use` alias inside `mod benches` is not in scope. (2) A benchmark amount has to clear the chain's existential deposit: the flash loan's 1,000-unit pool failed on the dev chain with 'Account cannot exist with the funds that would be given' while passing in the mock, so its amounts are now multiples of `minimum_balance()`. The reservation benchmark uses real amounts for the same class of reason — the inventory helpers return early for zero. `cargo test -p pallet-x3-flashloan --features runtime-benchmarks` 15 passed; `-p pallet-x3-reservation` 21 passed; scan 18 -> 16; `check-runtime-weights-wired.py` names 45 wired configs (was 43). `cargo check --workspace --all-targets` caught a third Config impl (`pallets/x3-solvency`'s mock) that the added `type WeightInfo` broke",
  "note: 2026-09-27 - `pallets/x3-domain-registry/src/weights.rs` and `pallets/x3-reconciliation/src/weights.rs` are new: three and six calls, all literals. A benchmark module also compiles in the runtime's WASM build, where `Vec` and `vec!` are not in the prelude — the domain registry's `Vec<X3DnsRecord<T>>` helper needed `use sp_std::{vec, vec::Vec};`, and the failure appears as `cannot find type Vec in this scope` from the build script, not from the pallet's own test run (which passes with `std`). `cargo test -p pallet-x3-domain-registry --features runtime-benchmarks` 10 passed; `-p pallet-x3-reconciliation` 38 passed; scan 16 -> 14; `check-runtime-weights-wired.py` names 47 wired configs (was 45)",
  "note: 2026-09-27 - `pallets/x3-wrapped/src/weights.rs` and `pallets/x3-sentinel/src/weights.rs` are new: seven calls each. The sentinel had no `mock.rs` at all — its test runtime lives in `tests.rs`, and `new_test_ext` had to become `pub` for the benchmark test suite to link against it. Its seven calls also split the way the pallet does: `freeze_authority(origin, asset, who, reason)` takes four arguments and `freeze_asset(origin, asset, reason)` three, which is not guessable from the call names. Adding `type WeightInfo` to the sentinel broke `pallets/x3-token-factory`'s test runtime, which wires the sentinel — the third crate this class has caught. `cargo test -p pallet-x3-wrapped --features runtime-benchmarks` 33 passed; `-p pallet-x3-sentinel` 14 passed; scan 14 -> 12; `check-runtime-weights-wired.py` names 49 wired configs (was 47)",
]

