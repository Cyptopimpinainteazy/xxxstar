[[feature]]
id = "X3-GPU-002"
name = "Production runtime weights"
subsystem = "gpu_performance"
source = "master"
# Re-measured 2026-09-27. The row's blocker was not a missing capability: the weights existed and
# nothing pointed at them. 31 pallets ship `src/weights.rs`, 29 declare `pub mod weights;`, and
# `runtime/src/lib.rs` referenced **zero** of them — every one of those configs set
# `type WeightInfo = ()`, and `impl WeightInfo for ()` returns `Weight::zero()`, which drops the
# pallet out of block-weight accounting entirely. Eighteen configs are now wired to the non-zero,
# read/write-counted `SubstrateWeight` their pallets already shipped, and a gate holds the line.
#
# Re-measured 2026-09-28: the other half of this row was "the generated weights are stubs", and that
# claim was too strong in both directions, so it is now a count. Of the 51 `pallets/*/src/weights.rs`
# files in the tree, **29 carry the benchmark CLI's own record line** — a real run at STEPS/REPEAT on
# this host — and 22 do not. Eight of those 29 were produced by the weights burndown X3-GPU-003
# records (`x3-asset-registry`, `x3-account-registry`, `x3-dapp-hub`, `x3-partner`, `x3-custody`,
# `x3-wallet-pallet`, `x3-crosschain-gateway`, `x3-cross-vm-router`), and the 22 have a ratcheted
# baseline now rather than a sentence. The remaining cap is unchanged and is what keeps
# `mainnet_ready` at 55: nothing here has been measured on the launch target's hardware and no weight
# has been validated against a measured block.
# 82*0.35 + 80*0.25 + 55*0.40 = 28.7 + 20 + 22 = 70.7 -> 71.
paths = [
  "runtime/src/lib.rs",
  "runtime/src/tests.rs",
  "scripts/check-runtime-weights-wired.py",
  "scripts/check-weights-freshness.py",
  "docs/reports/weights-unmeasured-baseline.json",
]
implemented = 82
tested = 80
mainnet_ready = 55
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-27 — eighteen zero-weight dispatchable sets now charge their pallets' own weights.** Measured before: `runtime/src/lib.rs` set `type WeightInfo = ();` for `pallet_x3_{oracle,vrf,dex,automation,atomic_kernel,auction,launchpad,compute_market}`, `pallet_{governance,treasury,agent_accounts,agent_memory,depin_marketplace,meme_overlord,private_execution}`, `pallet_svm_runtime`, `pallet_grandpa`, `pallet_timestamp`, `pallet_scheduler`, `pallet_preimage` and `pallet_x3_lp_locker`. Eighteen of those (all but grandpa, launchpad and lp_locker) are wired to `<crate>::weights::SubstrateWeight<Runtime>`; the FRAME pallets use their SDK weights. The three that remain are in the gate's shrink-only exception list, each with the reason it cannot be wired today",
  "**CORRECTED 2026-09-28 — \"every generated weight is a stub\" was wrong in both directions, and the split is a ratchet now.** 29 of the 51 `pallets/*/src/weights.rs` files carry the benchmark CLI's own record line (a real STEPS/REPEAT run on this host, v53.0.0); the other 22 carry a hand-written header and were never produced by a run. Eight of the 29 came from the weights burndown X3-GPU-003 records. The 22 are listed in `docs/reports/weights-unmeasured-baseline.json`, which `scripts/check-weights-freshness.py` holds shrink-only — a new unmeasured file fails the default gate set, and the gate prints the ones that become measured so the list can drop",
  "**Two generated weight files are dead, and one is worse than dead.** `pallets/x3-launchpad/src/weights.rs` is not a module of its pallet at all (`lib.rs` declares no `mod weights;` and defines its own `WeightInfo` trait inside `#[pallet::config]`), so the runtime cannot point at it — the gate's exception says so. `pallets/x3-consensus/src/weights.rs` is shadowed by an inline `pub mod weights { … }` in its `lib.rs`, so the runtime is correctly weighted but the file beside it is never compiled; the gate prints a WARNING rather than failing, because the wired numbers are live either way",
  "**Found and fixed while here — `clippy runtime rc1` was red in the default gate set.** `runtime/src/tests.rs::a_full_ordering_window_is_settlable_in_one_block` exercises `pallet_private_execution`, whose `Config` impl for `Runtime` is `#[cfg(not(feature = \"mainnet-rc1\"))]`, but the test carried no `cfg` of its own, so the `mainnet-rc1` build of the test file did not compile (`the trait bound Runtime: pallet_private_execution::Config is not satisfied`, 12 errors). It carries that cfg now and the gate is green",
  "Still open on this row: 3 runtime configs remain on `()`, and the runtime carries SDK pallets whose own weight modules were not audited here (`pallet_balances`, `pallet_session`, `pallet_evm`, `pallet_collective`, `pallet_transaction_payment`, `pallet_sudo` — the gate only checks that they do not charge zero, not that their numbers are current). Nothing has re-benchmarked on this host, and no weight here has been validated against a measured block",
]
evidence = [
  "runtime/src/lib.rs",
  "runtime/src/tests.rs",
  "scripts/check-runtime-weights-wired.py",
  "note: `impl WeightInfo for ()` returns `Weight::zero()` for every method — the reason a `()`-wired config is invisible to the block weight limit rather than merely under-charged",
  "note: 2026-09-27 — 31 pallets ship `src/weights.rs`, 29 declare `pub mod weights;`, and before this change `rg 'WeightInfo = weights::' runtime/src/lib.rs` returned 0 matches; it returns 18 now, and the gate reports `37 runtime config(s) wired to generated weights, 3 documented exception(s)`",
  "note: 2026-09-28 — 51 pallets ship `src/weights.rs` and `check-runtime-weights-wired.py` reports **57 wired configs** with 3 documented exceptions. `python3 scripts/check-weights-freshness.py` reports 22 unmeasured against a baseline of 22, 5 documented drift exceptions and no drift elsewhere; the eight files from the X3-GPU-003 burndown are among the 29 that carry the CLI's own STEPS/REPEAT record line",
]
test_evidence = [
  "note: `cargo test -p x3-chain-runtime --lib` — 58 passed, 0 failed, including `a_wired_pallet_charges_more_than_nothing` (atomic-kernel + timestamp, both feature sets) and `a_wired_rc1_excluded_pallet_charges_more_than_nothing` (x3-auction)",
  "note: `bash scripts/local-ci.sh --only test-runtime` — PASS 92s; `--only clippy-runtime-rc1,runtime-weights-wired` — both PASS (the rc1 gate was red before this change)",
  "note: break-it-first measured both ways — reverting the x3-auction config at `runtime/src/lib.rs` to `()` makes the runtime test fail with `x3-auction create_auction charges Weight { ref_time: 0, proof_size: 0 }` and the gate exit 1 naming that line; restoring both returns green",
]
required_tests = [
  "a_wired_pallet_charges_more_than_nothing",
  "a_wired_rc1_excluded_pallet_charges_more_than_nothing",
  "a_full_ordering_window_is_settlable_in_one_block",
]

[[feature]]
id = "X3-GPU-003"
name = "FRAME benchmarking"
subsystem = "gpu_performance"
source = "master"
# Re-measured 2026-09-27 and derived on this matrix's own formula
# `implemented*0.35 + tested*0.25 + mainnet_ready*0.40`:
#
#   implemented 78 — the blocker was Generate production weights incomplete in older audits. Two
#     pallets' production weights are now measured by this repository's own CLI instead of typed:
#     `pallets/atomic-trade-engine` (register/update liquidity pool, sync pool price, submit price
#     observation) and `pallets/x3-kernel` (emergency_pause, emergency_unpause, emergency_halt — the
#     three calls that froze the chain for 10,000/15,000 picoseconds). Both files carry the CLI's own
#     record line (v53.0.0, steps 50, repeat 20, wasm-execution compiled) and real proof sizes.
#     2026-09-27, later: `pallets/x3-supply-ledger` is the third — a governance **mint** charged
#     20,000 picoseconds and a burn 15,000 while each read and wrote `Ledgers`.
#     2026-09-27, later still: `pallets/x3-treasury-policy` is the fourth — all eight calls were
#     literals (a settlement vault funding at 80,000,000 picoseconds) behind a `runtime-benchmarks`
#     feature that had nothing in it.
#     2026-09-27, fifth pass: `pallets/x3-token-factory` is the fifth — a token launch at 60,000
#     picoseconds, a mint/burn at 20,000 — behind the same empty feature.
#     2026-09-27, sixth pass: `pallets/x3-sequencer` and `pallets/x3-da` — a sequenced transaction
#     for 10,000 picoseconds, a blob commitment for 15,000 and a shard proof for 10,000.
#     2026-09-27, seventh pass: `pallets/x3-flashloan` (borrow/repay 10,000, add_liquidity 5,000) and
#     `pallets/x3-reservation` (three root transitions at 10,000 each).
#     2026-09-27, eighth pass: `pallets/x3-domain-registry` (three calls, 20,000/30,000) and
#     `pallets/x3-reconciliation` (six calls, 10,000-30,000).
#     2026-09-27, ninth pass: `pallets/x3-wrapped` (seven calls, 8,000-20,000) and
#     `pallets/x3-sentinel` (seven calls, all 15,000).
#   tested 70 — every new benchmark runs in the pallet's benchmark test suite (10 for
#     atomic-trade-engine, 13 for x3-kernel) and the full CLI run is what wrote the files. Not
#     higher: no workflow re-runs the per-pallet regeneration on a PR, so a stale file is still only
#     caught by hand.
#   mainnet_ready 55 — unchanged. The numbers were measured on this host (x3star1, Xeon E5-2620 v4)
#     and no weight has been validated against a measured block on the launch target.
#   The supply ledger's five benchmarks run in its own suite too (46 tests with the feature on),
#     and the pallet had no `WeightInfo`, no `benchmarking.rs` and no `runtime-benchmarks` feature
#     at all — the runtime feature list did not even enable its benchmarks, which is why
#     `Pallet<Runtime>: Benchmarking` was unsatisfied and the CLI could not see it.
#     The treasury policy's eight run in its suite (31 tests with the feature on) and its vault
#     funding path is measured on the immediate-apply branch, with a real vault created by the
#     inventory pallet's own root-only call.
#     The token factory's four run in its suite (22 tests with the feature on) and its launch
#     benchmark drives the whole path a chain takes: register, activate, configure routes, mint.
#     The sequencer's one and the DA pallet's two run in their own suites (16 and 17 tests with the
#     feature on), and each measures the fee reserve as part of the call.
#     The flash loan's three and the reservation pallet's three run in their suites (15 and 21 tests
#     with the feature on); the reservation benchmark requires the chain's balance to be `u128` and
#     uses real amounts, because the inventory helpers return early for zero and a zero-amount
#     benchmark would measure the no-op path.
#     The domain registry's three and the reconciliation pallet's six run in their suites (10 and 38
#     tests with the feature on); the reconciliation's own benchmarks set the state its calls read
#     through the pallet's extrinsics (a canonical supply and a chain report before a reconciliation,
#     an active halt before a halt lift).
#     The wrapped pallet's seven and the sentinel's seven run in their suites (33 and 14 tests with
#     the feature on); the wrapped setups register an asset through the pallet's own governance call,
#     and the sentinel's unfreeze/unenroll/approval benchmarks establish the state each one acts on.
#     2026-09-28, final pass: the remaining eight pallets are measured and the scanner's
#     `pallet-call-without-weights` count reaches **4, all `low`** — every one of them the
#     documented `T::DbWeight::get().reads_writes` estimate rather than an invented cost. There is no
#     high finding left anywhere in the tree. `x3-asset-registry` (7 calls), `x3-account-registry` (3,
#     plus the `benchmarking.rs` and `mod benches` entry it never had), `x3-dapp-hub` (8),
#     `x3-partner` (8, whose `runtime-benchmarks` feature the runtime did not even enable),
#     `x3-custody` (10), `x3-wallet-pallet` (12), `x3-crosschain-gateway` (11) and
#     `x3-cross-vm-router` (3 of 8) all charge generated weights now. This pass also had to fix the
#     build that produced them: `pallet-x3-settlement-engine` enabled its optional `rlp` dependency
#     with default features, so the runtime's `runtime-benchmarks` build pulled `rlp/std` —
#     `bytes/std` and `rustc-hex/std` — into a `wasm32v1-none` blob that has no std, and no pallet's
#     weights could be regenerated at all.
#   tested 88 — every new benchmark runs in its pallet's benchmark test suite, the full CLI run wrote
#     each file, and the row's second blocker is closed: `scripts/check-weights-freshness.py` now runs
#     in the default gate set, failing on a weight entry no call charges (drift) and on a
#     `weights.rs` that carries no benchmark CLI record line (unmeasured), ratcheted shrink-only by
#     `docs/reports/weights-unmeasured-baseline.json`. Not higher: the gate checks drift and
#     measured-ness,
#     it does not re-run a benchmark on a change, so a *number* can still be stale even when the file
#     agrees with the pallet.
#   mainnet_ready 58 — **moved for the first time, by 3.** The row's cap is target-hardware
#     measurement and that has not changed: these numbers come from x3star1 (Xeon E5-2620 v4) and no
#     weight has been validated against a measured block on the launch target. What moved is the
#     class of defect underneath it. Twenty-one pallets charged **invented literals** — up to
#     70,000,000 picoseconds against a measured cost that turned out to be a fraction of that — which
#     is a consensus-relevant error: a weight that understates the work is a cheap way to fill a
#     block. Those literals are gone, the five calls that genuinely cannot be measured are recorded
#     with reasons instead of guesses, and a gate now fails when a file stops describing its pallet.
# 95*0.35 + 88*0.25 + 58*0.40 = 33.25 + 22 + 23.2 = 78.45 -> 78.
paths = [
  ".github/workflows/frame-benchmarking.yml",
  "pallets/atomic-trade-engine/src/weights.rs",
  "pallets/x3-kernel/src/weights.rs",
  "scripts/check-weights-freshness.py",
  "docs/reports/weights-unmeasured-baseline.json",
  "docs/reports/benchmark-exceptions.md",
]
