blockers = ["Receipts carry an ed25519 attestation with a key id, `receipt verify --trusted <key>` requires and validates it (a different key is refused by name), any edited field breaks the hash, and mainnet now *requires* a trusted key (TICKET-135); what was missing was a key registry or rotation story, since keys were named per invocation. **Closed 2026-09-28:** `ReceiptKeyRegistry` records each key as `active`, `retired` (rotated out: still verifies what it signed, `may_sign` is false) or `revoked` (compromised: refused by name, including for receipts signed before the revocation). A registry that could be misread is refused at load: a duplicate id, one public key under two ids, no active key, a malformed key, or unknown fields. `x3c receipt verify --trusted-registry <file>` uses it and satisfies mainnet's trusted-key requirement. Disabling the revocation check turns the VM and CLI tests red. **Signing side closed 2026-09-29:** `x3c receipt execute --key-id <id> --signing-registry <file>` signs only if the key is active under that id and the registry lists the signing key own public key there, and it verifies the signed receipt against the same registry before writing it. A retired, revoked or unlisted key, or a key the registry does not list under the id, is refused before anything is written (`cli_receipt_execute_signs_only_with_an_active_registry_key`; removing either check turns it red). **Registry signing closed 2026-09-29:** `x3c registry sign <file> --key-hex <root seed>` writes a detached `<file>.sig.json` over the file exact bytes (domain `x3-receipt-key-registry-v1`), and `receipt verify` / `receipt execute` load a registry only if it verifies under the root passed as `--registry-root`, which mainnet requires. Refused: no root on mainnet, an unsigned registry, another root, a key appended after signing, an attacker signature relabelled as the trusted root (`cli_a_mainnet_key_registry_must_be_signed_by_the_named_root`, `a_registry_edited_after_signing_or_signed_by_another_root_does_not_load`); removing the root check, the digest check or the mainnet rule turns them red. Still open: how the root key itself is distributed and rotated is an operator decision (it is named per invocation)."]
evidence = ["x3-lang/compiler", "note: Trading Core v1 gap #9"]

