blockers = ["**2026-09-26 \u2014 the chain path does authenticate the artifact; a standalone artifact still does not.** The rest of this note is right that the envelope carries an unkeyed digest and no signature. What it did not say is that the path the chain actually executes is bound to the signer: the program is an argument of the signed extrinsic, so the signature covers it. `a_tampered_artifact_cannot_be_executed_under_the_original_signature` (gate `X3-native lifecycles`) flips one byte of the payload inside the signed bytes and submits it with the signature intact \u2014 the node refuses it (`RPC call failed: JSON-RPC error 1010: Invalid Transaction`), and the control (the same extrinsic, untampered) finalizes with the value the source states, so the refusal is the tampering and not the account or the nonce. **Closed 2026-09-29:** a `.x3`/X3BC artifact distributed out of band now has an attestation of its own. `x3_common::artifact` signs a **detached** claim — the artifact's bytes are untouched, so both readers of the format and their byte-parity suite are unaffected — over the whole artifact, header included, because a signature over the body alone would let an edit clear `FEATURE_PRIVATE_SUBMISSION_REQUIRED` and stay valid. The key lifecycle matches the receipts' registry: retired keys still verify what they signed, revoked keys verify nothing, and a registry a reader could misread (duplicate id, one key under two ids, no active key, malformed key) is refused when it is built. `X3Executor::execute_attested` checks the claim *before* parsing, so bytes nobody vouched for reach neither the verifier nor an engine. Break-it-first: not comparing the digest, skipping the revocation check, and trusting the attestation's own carried key each redden their tests; the key-id binding in the signing digest is covered by `a_claim_cannot_be_relabelled_as_another_identity_of_the_same_key` (one key legitimately listed under different ids by two registries). The public-key binding in that digest is defence in depth that no test distinguishes, because the registry comparison subsumes it, and the module says so rather than implying coverage. **Build step closed 2026-09-29:** `x3 compile --sign-key-hex <seed> --key-id <id> --signing-registry <file>` signs the artifact only with a key that is active in the registry, verifies the new attestation against the registry, and only then writes the artifact and `<artifact>.sig.json`; `x3 verify-artifact <x3b> --registry <file>` checks one. Doing this found that `x3 compile` and `x3 build` wrote `output.bytecode.code` (the code section alone: no magic, header, function table or checksum), so no reader of the format could load the `.x3b` they produced; they now write the whole envelope. crates/x3-cli/tests/artifact.rs runs the real binary (the artifact loads and a two-function program returns 42; a signed artifact verifies, a one-byte edit and a revoked signer are refused; a retired, unlisted or mismatched key writes nothing), and restoring the code-only write, the may-sign check or the post-sign verification each turns it red. The crate is gated as `test x3-cli`. **Registry signing closed 2026-09-29:** `x3 sign-registry <file> --key-hex <root seed>` writes `<file>.sig.json` (domain `x3-artifact-key-registry-v1`, distinct from receipts), and `x3 compile --signing-registry` and `x3 verify-artifact` trust a registry only under `--registry-root`; an unsigned one must be asked for by name (`--unsigned-registry`), otherwise refused with nothing written (`a_registry_is_trusted_only_under_the_named_root`; removing the root check, the digest check or the default refusal turns it red). Still open: how the root key itself is distributed and rotated is an operator decision (it is named per invocation)."]
