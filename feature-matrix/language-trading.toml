blockers = [
  "**CLOSED 2026-09-25 — an extrinsic now carries a compiled program through the pallet, and the pallet records it.** `submit_comit_v2` validated its `x3_payload` as an `X3VmPacket` and then handed those same bytes to `T::X3Adapter::execute`, which parses X3BC. A packet is a semantic operation, not bytecode, and the executor accepts nothing else, so on any chain with a real adapter (`X3VmAdapter`, or `WasmX3Adapter` in the wasm build) every non-empty X3 payload died with `X3ExecutionFailed` — while a program compiled from `.x3` source was refused earlier as `InvalidX3VmPacket`. Reproduced before the fix by dispatching a compiled program at the real runtime: `Module(ModuleError { index: 11, error: [7, 0, 0, 0], message: Some(\"InvalidX3VmPacket\") })`. The payload is now the program, and validation is the adapter's own (`T::X3Adapter::validate`: envelope magic, version gate, checksum) — the component that does the work.",
  "**CLOSED 2026-09-25 — the execution receipt is persisted.** The X3 domain had no receipt storage at all (only EVM did), so a program's result existed in an event and a gas number and could not be read back. `X3ExecutionReceipts` is keyed by comit id and written only after every acceptance check, so a stored receipt always describes an accepted comit. `STORAGE_VERSION` moves 1→2, recorded by the migration the runtime already runs in its `Migrations` tuple (the map starts empty, so there is nothing to rewrite). The extra storage write is declared at the call site as `submit_comit_v2().saturating_add(T::DbWeight::get().writes(1))` because the benchmark predates it.",
  "**CLOSED 2026-09-25 — the whole route is proven on a running chain.** `node/tests/x3vm_live_lifecycle.rs` now boots the real dev node, authorizes the submitter through the council, **compiles the program from `.x3` source inside the test**, signs `submit_comit_v2` with it, waits for a finalized block that contains the extrinsic, asserts the dispatch did not fail, and then reads the receipt back out of finalized state — value, metered gas and the kernel's receipt version. That is source -> compiler -> X3BC -> adapter -> pallet extrinsic -> inclusion -> finality -> verifiable receipt, on a chain rather than in a `TestExternalities`.",
  "**CLOSED 2026-09-25 — old artifacts against the loader the chain runs.** `crates/x3-integration/tests/bytecode_version_compat.rs` builds a program with the compiler the node uses and then rewrites header fields the way a newer (or older) producer would, asserting every verdict by name: a patch bump (1.0.1) stays readable; a newer minor and the next major are refused as `UnsupportedVersion(v)` naming the version they declared; an artifact whose `min_version` demands a newer loader is refused by that demand; a body edited after compilation is refused as `ChecksumMismatch { expected, found }`; and the version gate is shown to run before execution. The tests are load-bearing: removing the version check from `mini_x3` turns exactly the three version-refusal tests red and leaves the rest green (measured, then restored). What this does *not* cover: no artifact produced by a genuinely older release exists in the repository, so the fixtures are header-rewritten rather than historical; and `x3-lang/`'s own version-byte gates (TICKET-097/137) are a separate pipeline with their own tests.",
  "**CLOSED 2026-09-25 — a finalized comit survives the node dying, and a replayed extrinsic is refused.** The row's list of required proofs includes restart behaviour and replay rejection, and neither had a live test: the suite's restart proof re-opened a *relayer's* persisted proof ledger, which is a different claim from the chain still having the comit after the chain node exits. `a_finalized_x3_comit_survives_a_node_restart` gives the node a `--base-path` that outlives it (a real database, not `--tmp`), finalizes a comit, kills the process, starts it again on the same database and ports, and requires the finalized height to resume at or past where it stopped, the receipt to come back with the same value, gas and version, and a further comit to finalize. `a_replayed_x3_comit_extrinsic_is_not_mined_twice` resubmits the identical signed bytes and counts their occurrences across finalized blocks, which must stay exactly one — the pool's refusal (`JSON-RPC error 1012: Transaction is temporarily banned`) is reported but not relied on, because 'the pool refused it' is not 'the chain did not mine it twice'.",
  "**CLOSED 2026-09-25 at the runtime level — the 1→2 migration runs and preserves state.** `runtime/src/lib.rs`'s `runtime_upgrade_rehearsal` module already rehearsed the *versions*: every pallet wired into `Migrations` is rolled back to 0 against populated genesis state, the hooks run, and each must end at the version its code declares. What none of those proved is that an upgrade leaves the chain's data alone, so `the_kernel_upgrade_moves_the_version_without_touching_its_state` seeds kernel state (a canonical-ledger balance, a used comit nonce, an authorized submitter), rolls the kernel's on-chain version to 1, runs the real migration tuple, and requires the version to move *and* the state to come out identical — with both preconditions asserted so it cannot pass vacuously, and with a second run required to be a no-op. Load-bearing, measured: making the migration rewrite the ledger turns it red with `a version move must not rewrite the ledger` (then the file was restored byte-identically).",
  "**OPEN, and worse than the sibling note below — the EVM arm reports success without executing.** Found 2026-09-26 while checking whether the EVM and SVM budgets could be tested the way the X3 one now is. `submit_comit_v2` validates a non-empty EVM payload by decoding it as a `Packet` and checking the EVM domain bit (`packet_adapters::deserialize_packet` + `get_domain_mask`), while the adapter the *wasm* runtime is compiled with — `wasm_adapters::WasmEvmAdapter`, i.e. every live chain — hands those same bytes to `mini_evm::execute_evm` as EVM code. A SCALE-encoded `Packet::Evm(..)` begins with the enum discriminant `0x00`, which is `STOP`, so the interpreter halts on byte 0 and reports success. Measured directly (`pallets/x3-kernel/src/wasm_adapters.rs`, probe since replaced by the ignored test): payload 124 bytes, head `[00, 00, 6b, cb, 44, 6f, 34, 8c]`, `execute -> Ok((success: true, gas_used: 22576))`, `validate -> Ok(())`; the SVM arm at the same boundary returns `Err(\"SVM execution failed\")` and the X3 arm executes correctly (`Ok((true, 3))`). So an EVM operation that never ran is recorded as a success with a persisted receipt, which is the false-success shape the X3 arm was fixed for on 2026-09-25. The kernel's own benchmark cannot catch it: the pallet's mock adapter accepts anything, so `bench_submit_comit_v2` passes. **FIXED 2026-09-26 at the adapter boundary — a packet is refused by name instead of run as code.** All four adapter sites call the shared `packet_adapters::payload_is_packet` and refuse: `wasm_adapters::WasmEvmAdapter`, `wasm_adapters::WasmSvmAdapter`, and the runtime's `NativeEvmAdapter` / `NativeSvmAdapter`, where Frontier's `create` treated the packet as init code and reported success for an empty contract. Regression tests `wasm_adapters::an_accepted_evm_payload_is_refused::an_accepted_evm_payload_is_refused_rather_than_reported_as_success` and `...::an_accepted_svm_payload_is_refused_by_name` are green and run by `test x3-kernel`; before the fix the first one failed with `the adapter reported success for a payload it cannot have executed`. **Still open is the integration itself**: the kernel's EVM/SVM payload is a packet and no adapter translates one into work, so those two arms are now inert (refused loudly) rather than functional, and the payload convention has to be settled — the X3 arm's answer was 'the payload is the artifact the adapter executes'. Report: `.ai/reports/evm-payload-never-executed-20260926.md`.",
  "**CLOSED 2026-09-26 — the receipt is read back from a validator that did not submit it.** This note used to say \"the network is one local node, so inclusion and finality are proven but *multi-validator* agreement is not\". `node/tests/x3lang_network_receipt.rs` (run by the `X3Lang across validators` gate) closes it on the built-in three-validator `local3` chain: it compiles the program from `.x3` source inside the test, submits `submit_comit_v2` to **Alice's** RPC endpoint only, waits for **Charlie** to finalize a block containing it, and then reads the receipt from Charlie — an observer that never saw the submission. Charlie's own `System::Events` at that extrinsic index says `ExtrinsicSuccess` (inclusion is not success), all three validators report the same hash at the same height, all three return byte-identical receipt bytes (return value 42, `gas_used` inside the runtime's own default limit, receipt version and protocol version as the adapter declares, and no invented EVM `from`/`to`/`value`), and the receipt is absent at Charlie's pre-submission finalized head and for a comit id that was never submitted. Measured: finalized height 94 at `0xfddc0947…`, three validators, one frozen node binary (sha256 printed by the test, because a rebuild mid-run splits the set on genesis). The witnesses beyond the three validators — the seven physical servers — are still absent.",
  "Still open on this row: the *live-chain* upgrade keeps its own open item — `scripts/mainnet/runtime_upgrade_rehearsal.sh` has not run, because it wants a release build and `subxt` (absent on this box) to submit the upgrade over RPC; and `submit_comit_v2`'s benchmark **now exists and runs — and stops on its payload fixtures**. It was absent (the kernel's module defined nine extrinsics, not this one); it is written now, with a compiled X3 artifact pinned by two tests (`pallets/x3-kernel/src/bench_fixtures.rs`: the bytes must equal `compile_source(source)`, and `X3VmAdapter::validate` must accept them). The EVM/SVM helpers were also wrong — raw `0xa9059cbb`-and-zeros payloads, refused as `InvalidEvmPacket` — and now build real packets. Both benchmarks then fail at the next stage, `SvmExecutionFailed`: their payloads are *shaped* right but not *executable* by the runtime's real adapters, which is why the weight entry stays a placeholder. Report: `.ai/reports/benchmark-regeneration-20260925.md`.",
]
