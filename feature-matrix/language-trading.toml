# Language / Trading feature matrix fragment.

[[feature]]
# Re-measured 2026-09-24 (TICKET-130). The row's blocker asked for a genuine E2E test and the chain
# it names did not actually work: the emitter wrote register operands as two bytes while the
# interpreter and the verifier read one, so every compiled program failed verification (measured:
# `fn main() -> i64 { return 42; }` compiled to `18 00 00 2a 05 00 00` and the verifier called byte 3
# an invalid opcode). Fixed in this commit together with the receipt's instruction count (always 0),
# the `main`-is-function-0 entry contract, and the crate's `no_std` build; the tests below are the
# evidence and were written to fail first.
# Scope of the claim (re-measured 2026-09-24, third pass): the pipeline is proven for the operand
# kinds the sweep covers — literal, arithmetic, local, constant-pool index, branch, function call —
# **and** for the compiler's own fixture corpus, which adds recursion (`fib(10)` = 55), several
# functions with parameters, comparison chains, constant-folded branches and, since `loop_sum.x3`
# (sum_to(5) = 15), `loop_break.x3` (21) and `loop_continue.x3` (12), a `while`/`loop` with a mutated
# local, `break` and `continue`: that needed four fixes under it (mutated locals lowered as
# register-model cells, DCE keeping stores, PRE not hoisting a computation above its own operand's
# definition, and break/continue lowered instead of dropped by an empty match arm). Both engines
# agree on every fixture. Floats have their own test and a policy: the backend now takes the float
# opcode from a flag the MIR sets (it used to emit an integer add for `1.5 + 2.5` and fail with a
# type error), the arithmetic is computed in simulation, and the on-chain path refuses float opcodes
# by design (`deny_float_arithmetic` — platform-dependent rounding is not a deterministic state
# transition), which the test asserts rather than assumes. Not proven: match statements, strings,
# host calls. That list is what keeps this row short of COMPLETE.
id = "X3-LANG-001"
name = "Compile→encode→decode→execute→receipt E2E"
subsystem = "language_trading"
source = "master"
paths = ["crates/x3-integration", "crates/x3-backend", "crates/x3-vm", "crates/x3-compiler", "crates/x3-mir", "crates/x3-opt"]
implemented = 72
tested = 78
mainnet_ready = 30
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = ["Proven for the swept operand kinds and the compiler's fixture corpus, including a `while` loop with a mutated local, `break`/`continue`, and float arithmetic with the on-chain refusal asserted; not proven for match statements, strings or host calls. The optimizer is order-sensitive: moving the entry function in front of it made four of the compiler's own e2e programs stop compiling"]
required_tests = [
  "compile_encode_decode_execute_receipt_end_to_end",
  "every_operand_kind_compiles_verifies_and_executes",
  "the_compiler_fixture_corpus_executes_to_the_value_its_source_states",
  "float_arithmetic_runs_in_simulation_and_is_refused_on_chain",
  "compile_source_emits_runtime_loadable_bytecode",
  "compile_source_rejects_invalid_source",
]
test_evidence = ["crates/x3-integration/tests/compiler_bridge.rs: six tests, green; the sweep drives eight program shapes through compile → both readers → on-chain executor → receipt and asserts the receipt reports the value the source states, and the float test asserts both the simulation result and the on-chain refusal"]
evidence = ["crates/x3-integration/tests/compiler_bridge.rs", "crates/x3-backend/src/emit.rs", "note: Trading Core v1 gap #10"]

