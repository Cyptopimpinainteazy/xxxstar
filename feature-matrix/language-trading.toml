blockers = ["Both readers enforce the version and min-version, and the body parity this row asked for now covers the whole body (function table with a call and arguments, global table, trailing debug/metadata, and the version cases) — the parity work found and fixed a real divergence: a patch bump was accepted by x3-backend and refused by the no-std reader (TICKET-137). Still true from the old note:  `x3-common::bytecode` now defines the envelope once and `mini_x3::parse_module` reads version, checksum and min-version instead of skipping them, so the literal `skip(20)` and the 'neither reader verifies it' claim no longer describe the tree; the regression is `test_a_corrupted_body_is_rejected` / `test_a_future_format_version_is_rejected` / `test_a_module_requiring_a_newer_loader_is_rejected`. What was still open on this row is that the body encoding is written twice - `x3-backend` (std) and `mini_x3` (no-std) - with nothing pinning the two together. That gap was real and is now closed for the constant pool: the string arm decoded to an empty value in no-std while std returned the real bytes, fixed 2026-09-24 in `mini_x3` with `crates/x3-integration/tests/bc_const_pool_parity.rs` as the regression. That gap is now closed for the rest of the body too: `bc_const_pool_parity.rs` drives the function table (a callee at index 1 with a longer name, called with two arguments), the global table (stored then loaded), the trailing debug and metadata sections, and the version bounds through both readers (added 2026-09-24, TICKET-137). The authentication note (a checksum is not authentication) is answered in X3-LANG-009: a standalone artifact carries a detached ed25519 attestation checked against a key registry (#537), and `x3 compile --sign-key-hex` / `x3 verify-artifact` make that a build step (#547). Added 2026-09-26 (TICKET-148, CLOSED): the envelope's second reader is also a second *interpreter*, and it was answering 44 opcodes it had no implementation for (see the test_evidence note and `.ai/runlogs/2026-09-26-onchain-interpreter-fail-closed.md`). That class is closed - nothing is fabricated any more. Added 2026-09-26 (TICKET-149, part 1 CLOSED): slot storage is the one divergence that was resolved rather than recorded. `mini_x3` - the interpreter a block runs - implements `evm_sstore`/`evm_sload` (0xB4/0xB3) against the same key and payload encoding `crates/x3-vm` journals (EVM domain tag + little-endian slot, then tag + length + at most 30 bytes), the atomic window unwinds a rolled-back window's writes in reverse, and `crates/x3-integration/tests/interpreter_agreement.rs::slot_storage_is_implemented_by_both_engines_and_names_the_same_slot` compares the two journals key for key and value for value instead of asserting that both merely work. **TICKET-149 closed 2026-09-28**, measured on both engines and on-chain validation: aggregates, `inc`/`dec` and `mod_f` were already refused by both (the note had gone stale). The numeric conversions `0x60`-`0x68` and `ctx_gas` (`0x84`) were the real divergence: the runtime interpreter executed them and `crates/x3-vm` refused them. The 32-bit conversions had no honest meaning in the runtime's `i64`/`f64` value model (`I64ToI32` returned its input untruncated, `F64ToF32` did not round). `ctx_gas` answered with a gas count the two engines are not held to agree on. Both engines now refuse them at intake: `mini_x3::verify_code` returns `UnsupportedOpcode`, and `x3-vm`'s on-chain verifier returns `ForbiddenOnChain`. The chain compiler emits none of them. `neither_interpreter_executes_an_opcode_the_other_one_refuses` covers them now, and restoring the identity conversions turns it red; `verify_conversions_and_ctx_gas_forbidden_on_chain` holds the verifier side."]
