[[feature]]
id = "X3-XCHAIN-001"
name = "BTC Fortress gateway"
subsystem = "cross_chain"
source = "master"
paths = ["pallets/x3-settlement-engine/src/btc_gateway.rs", "crates/x3-bitcoin-vault/src/lib.rs", "crates/x3-bridge/src/bitcoin_htlc.rs", "crates/x3-bridge/src/btc_spv.rs"]
implemented = 70
tested = 60
mainnet_ready = 35
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "No live Bitcoin run of any kind — not regtest, not testnet, not mainnet; the deposit/withdrawal path has never moved a coin",
  "Header bootstrap has no trusted source: `submit_btc_header` is root-only and requires each header to chain to one already in storage, but there is no checkpoint anchor and no peer-sourced header sync",
  "No BTC signer quorum for withdrawals",
  "BTC mainnet disabled by feature flag; no external audit",
]
# `crates/x3-gateway` used to be this row's only path. It is the REST/GraphQL API
# service for indexed data and contains no Bitcoin code beyond importing an HTLC
# type in one handler. The on-chain BTC path is the settlement engine's
# `btc_gateway` module (scripts, addresses, SPV proof, adaptor signatures), the
# header chain and proof-of-work check beside it, `crates/x3-bitcoin-vault`
# (deposits, withdrawals, PSBTs, header-chain verification) and the bridge's HTLC
# and SPV modules.
evidence = ["pallets/x3-settlement-engine/src/btc_gateway.rs", "pallets/x3-settlement-engine/src/lib.rs", "crates/x3-bitcoin-vault/src/lib.rs", "crates/x3-bridge/src/bitcoin_htlc.rs", "crates/x3-bridge/src/btc_spv.rs", "note: FEATURE_REGISTRY btc_fortress_gateway re-pointed at the on-chain path and raised 25->45 on 2026-09-22 with the named tests below"]
test_evidence = ["pallets/x3-settlement-engine/src/tests.rs", "crates/x3-bitcoin-vault/src/lib.rs", "note: the pallet's BTC tests (targets Bitcoin refuses, wire-header hash, merkle path, block binding) and the vault's 23 tests including header-chain linkage and tampered-signature rejection; `cargo test -p pallet-x3-settlement-engine --lib` = 135 passed, `cargo test -p x3-bitcoin-vault --lib` = 23 passed on 2026-09-22"]
registry_feature = "btc_fortress_gateway"

[[feature]]
id = "X3-XCHAIN-002"
name = "Bitcoin HTLC script logic"
subsystem = "cross_chain"
source = "master"
paths = ["crates/x3-bridge/src/bitcoin_htlc.rs", "pallets/x3-settlement-engine/src/btc_gateway.rs", "pallets/x3-settlement-engine/src/lib.rs", "crates/x3-crosschain-intent/src/proof/btc.rs"]
implemented = 85
tested = 75
mainnet_ready = 40
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "No live Bitcoin run: the script builder, the merkle walk and the header chain are exercised against fixtures, never against a chain",
  "The header chain the SPV check reads has no trusted bootstrap (root-submitted, chained to storage, no checkpoint anchor)",
  "No signer quorum for withdrawals; no external audit",
  "Three SPV implementations exist — this pallet's `btc_gateway`, `crates/x3-crosschain-intent/src/proof/btc.rs` and `crates/x3-bitcoin-vault` — and only the pallet's is on the runtime path; they agree on the wire layout after the 2026-09-22 fix, but consolidating them would remove a standing drift risk",
]
# The old note said "proof verification was placeholder". Half true, and the wrong
# half mattered: the txid and merkle checks were real, but the proof-of-work check
# hashed the SCALE encoding of a struct carrying a non-wire `height` field, so the
# value compared against the target was not the block's hash — and a target that
# overflowed 256 bits returned "any hash passes". Fixed 2026-09-22 (wire header +
# Bitcoin's CheckProofOfWork rejections); the tests below are the reproduction.
evidence = ["crates/x3-bridge/src/bitcoin_htlc.rs", "pallets/x3-settlement-engine/src/btc_gateway.rs", "pallets/x3-settlement-engine/src/lib.rs", "crates/x3-crosschain-intent/src/proof/btc.rs", "note: HTLC script/address derivation, double-SHA256 merkle path over the tx index, and proof-of-work over Bitcoin's 80 wire bytes with negative/overflow/zero targets rejected"]
test_evidence = ["crates/x3-bridge/src/bitcoin_htlc.rs", "pallets/x3-settlement-engine/src/tests.rs", "note: btc_htlc_redeem_script_has_correct_opcodes, btc_htlc_p2sh_address_derivation_is_deterministic, btc_settlement_proof_two_tx_block_with_merkle_path (+ wrong sibling refused), btc_settlement_proof_naming_a_different_block_is_refused, btc_submit_header_refuses_targets_bitcoin_refuses, btc_submit_header_refuses_a_header_that_misses_its_target; 135 pallet tests pass"]

[[feature]]
id = "X3-XCHAIN-003"
name = "Relayer framework"
subsystem = "cross_chain"
source = "master"
paths = ["crates/x3-relayer/src/submitter.rs", "crates/x3-relayer/src/relayer.rs", "crates/x3-relayer/src/watchers", "crates/x3-validator-attestation/src/lib.rs", "crates/x3-bridge/src/cross_chain_proofs.rs"]
implemented = 70
tested = 50
mainnet_ready = 35
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "The relayer signs with a single key and says so: `svm_required_signatures: 1` with the comment that quorum enforcement \"belongs at the aggregator layer\" — and no aggregator exists in this workspace, so the production path is one signature",
  "It cannot submit at all: the settlement engine accepts a proof only from the intent's maker or taker, so a relayer signature is refused (`NotAuthorized`) — the authority path is an open decision",
  "No live external-chain operation: the watchers have never run against a public chain, and the proof producer is exercised against anvil and solana-test-validator in local gates only",
  "No multi-operator relayer set: quorum is verified on the *verification* side (x3-validator-attestation, x3-bridge supermajority tests) but nothing in this crate produces one",
]
# The row used to cite `crates/x3-atomic-swap/src/relayer.rs`, a second watcher
# implementation used by the node-side swap tests. The production relayer is the
# `x3-relayer` crate; this points at it now, and at the crates that actually verify
# attestation quorum.
evidence = ["crates/x3-relayer/src/submitter.rs", "crates/x3-relayer/src/watchers/evm.rs", "crates/x3-relayer/src/watchers/svm.rs", "crates/x3-validator-attestation/src/lib.rs", "crates/x3-bridge/src/cross_chain_proofs.rs", "note: watchers compare confirmations to the configured finality threshold; EVM receipt proofs are produced by crates/x3-relayer/src/evm_receipt_proof.rs and verified through x3-verification-router; the submission path refuses with the origin rule rather than posting a payload no node accepts"]
test_evidence = ["crates/x3-relayer/src/submitter.rs", "crates/x3-bridge/src/cross_chain_proofs.rs", "crates/x3-verification-router/tests", "crates/x3-relayer/src/evm_receipt_proof.rs", "note: `cargo test -p x3-relayer --lib` covers the refusal path, the SVM attestation signature and the quorum check on an acquired proof; the bridge has supermajority threshold tests (exactly-at, one-below, duplicate-signature rejection); the receipt proof producer has an anvil-backed inclusion test"]

