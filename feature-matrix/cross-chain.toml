blockers = [
  "Needs Byzantine provider and partition tests",
  "**CLOSED 2026-09-27 \u2014 the in-memory oracle no longer manufactures a quorum.** `SimpleRpcQuorum::collect_votes` returned `TxStatus::Confirmed` with `agreement_count: 1` for every provider it was handed, with the comment \u201cSimulate a successful Confirmed response at block 1\u201d. It has no transport, so it had observed nothing, and a caller that wired it up would have got a 2-of-3 consensus out of an empty network. It now reports `Unknown` with a count of zero \u2014 what \u201cI do not know\u201d looks like to `verify_consensus`, which then fails closed and names every unobserved provider as a disagreement. Two tests that *required* the fabrication were rewritten rather than deleted: `rpc_quorum::tests::test_collect_votes_returns_proof_per_provider` and the `test_new_modules_integration` block in `crates/x3-atomic-swap/tests/atomic_swap_integration.rs` both used to assert that all three votes came back `Confirmed` and that the oracle therefore reached consensus. They now assert the honest contract (one vote per provider, none claiming an observation, no consensus) and say in the test why the old assertion was the problem.",
]
evidence = ["crates/x3-atomic-swap/src/rpc_quorum.rs", "note: Quorum types exported and used by security logic"]

