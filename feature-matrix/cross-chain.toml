  "The header chain the SPV check reads now bootstraps from a governance-anchored checkpoint (`anchor_btc_checkpoint`, spec_version 14) and extends only under Bitcoin's height/difficulty/timestamp rules, but no chain has anchored one yet, so the path is fail-closed and unexercised end to end",
  "No signer quorum for withdrawals; no external audit",
  "Three SPV implementations exist — this pallet's `btc_gateway`, `crates/x3-crosschain-intent/src/proof/btc.rs` and `crates/x3-bitcoin-vault` — and only the pallet's is on the runtime path; they agree on the wire layout after the 2026-09-22 fix, but consolidating them would remove a standing drift risk",
]
# The old note said "proof verification was placeholder". Half true, and the wrong
# half mattered: the txid and merkle checks were real, but the proof-of-work check
# hashed the SCALE encoding of a struct carrying a non-wire `height` field, so the
# value compared against the target was not the block's hash — and a target that
# overflowed 256 bits returned "any hash passes". Fixed 2026-09-22 (wire header +
# Bitcoin's CheckProofOfWork rejections); the tests below are the reproduction.
evidence = ["crates/x3-bridge/src/bitcoin_htlc.rs", "pallets/x3-settlement-engine/src/btc_gateway.rs", "pallets/x3-settlement-engine/src/lib.rs", "crates/x3-crosschain-intent/src/proof/btc.rs", "note: HTLC script/address derivation, double-SHA256 merkle path over the tx index, and proof-of-work over Bitcoin's 80 wire bytes with negative/overflow/zero targets rejected"]
test_evidence = ["crates/x3-bridge/src/bitcoin_htlc.rs", "pallets/x3-settlement-engine/src/tests.rs", "note: btc_htlc_redeem_script_has_correct_opcodes, btc_htlc_p2sh_address_derivation_is_deterministic, btc_settlement_proof_two_tx_block_with_merkle_path (+ wrong sibling refused), btc_settlement_proof_naming_a_different_block_is_refused, btc_submit_header_refuses_targets_bitcoin_refuses, btc_submit_header_refuses_a_header_that_misses_its_target; 135 pallet tests pass"]

