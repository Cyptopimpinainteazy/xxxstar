implemented = 80
tested = 85
mainnet_ready = 45
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "Regtest is now real, testnet and mainnet are not: a live Bitcoin Core v28.1.0 regtest node mined the blocks, transaction and merkle path the pallet's tests verify (`scripts/btc/capture-regtest-spv.py`, `.ai/reports/btc-regtest-capture-20260922.json`), but no coin has ever moved on a network anyone else can see, and no header from testnet or mainnet has been anchored",
  "A chain can now be born anchored — `X3SettlementEngine`'s genesis carries `btc_checkpoints`, pins `(height, hash)` and admits the header, and `X3_BTC_CHECKPOINTS=<header hex>@<height>` puts one in a spec (`scripts/testnet/btc-checkpoint-genesis-drill.sh`, 12/12, including a live node serving the anchor and refusing a spec that lies) — but no *public* network has one pinned, and the header still arrives by an operator copying a hash rather than from a header source",
  "Nothing pushes headers: `submit_btc_header` is root-only and there is no header relayer with a bond, so keeping the chain near Bitcoin's tip is an operator job",
  "No BTC signer quorum for withdrawals",
  "BTC mainnet disabled by feature flag; no external audit",
]
# `crates/x3-gateway` used to be this row's only path. It is the REST/GraphQL API
# service for indexed data and contains no Bitcoin code beyond importing an HTLC
# type in one handler. The on-chain BTC path is the settlement engine's
# `btc_gateway` module (scripts, addresses, SPV proof, adaptor signatures), the
# header chain and proof-of-work check beside it, `crates/x3-bitcoin-vault`
# (deposits, withdrawals, PSBTs, header-chain verification) and the bridge's HTLC
# and SPV modules.
evidence = ["pallets/x3-settlement-engine/src/btc_gateway.rs", "pallets/x3-settlement-engine/src/lib.rs", "crates/x3-bitcoin-vault/src/lib.rs", "crates/x3-bridge/src/bitcoin_htlc.rs", "crates/x3-bridge/src/btc_spv.rs", "note: FEATURE_REGISTRY btc_fortress_gateway re-pointed at the on-chain path and raised 25->45 on 2026-09-22 with the named tests below"]
