]

[[feature]]
id = "X3-XCHAIN-005"
name = "Finality proof model"
subsystem = "cross_chain"
source = "master"
paths = ["crates/x3-atomic-swap/src/finality.rs", "crates/x3-atomic-swap/src/relayer.rs", "crates/x3-atomic-swap/src/error.rs"]
implemented = 85
tested = 78
mainnet_ready = 45
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-26 — a finality claim is a certificate, not two numbers.** `verify_finality(chain, current_confirms, commitment)` took caller-supplied integers and `FinalityCheckData::block_height` was never read, so a swap's safety rested on a value the counterparty chose; `Relayer::verify_finality(required, current, chain_name)` compared two such numbers to each other. `FinalityCertificate` now carries `{ chain, block_height, block_hash, tx_id, confirmations, observed_at }` with private fields and two constructors, and `confirmations` is *derived* (`observed_at - block_height + 1`, the anchored block counting as one) — a reported count its own anchor does not imply is refused with `CertificateConfirmationsDisagree`, and an anchor above the tip it claims to be observed at with `CertificateBlockAfterObservation`. The verification path re-derives the depth rather than trusting the field, because a decoded certificate has not been through a constructor.",
  "**CLOSED 2026-09-26 — the oracle can refuse a rollback.** `FinalityOracle::verify_finality`/`is_finalized` take `&mut self` and the certificate. A certificate for another chain is refused (`CertificateChainMismatch`); a tip below the tallest tip this oracle already accepted is refused as a rewind (`CertificateRewindsAcceptedAnchor`) instead of being re-read as fresh; a tip more than the configured window behind the tallest tip the oracle has *witnessed* is refused as stale (`CertificateStale`, `DEFAULT_CERTIFICATE_STALENESS_BLOCKS`, overridable per chain). Witnessing is separate from accepting on purpose: a certificate refused for being too shallow still tells the oracle how far the chain has come, which is what makes a later, older certificate refusable as stale. The bare-count entry point on the swap path is gone — `Relayer::verify_finality` takes the certificate and delegates to an owned oracle, so the relayer inherits every refusal, with `min_confirmations` kept as a floor on top of the chain's rule.",
  "Still open, and it is the reason `mainnet_ready` does not follow `implemented`: nothing *produces* a certificate from a real chain. `block_hash` has to be bound to `chain` by a reader — an RPC quorum, a light client, a receipt proof — and no such producer is wired on this row, so what is proven is the shape and the refusals, not that the anchor is the chain's. The hash is believed.",
  "The oracle's tip memory is in the oracle, in memory. It does not survive a restart, so a rewind that spans a process restart is not caught; persisting the accepted tip belongs with the proof ledger.",
  "No public-chain run: the certificate stops at the crate's local gates. There is also no test that a real Ethereum or Bitcoin reorg produces a `CertificateRewindsAcceptedAnchor` from live data — only that a rewound certificate is refused once presented.",
