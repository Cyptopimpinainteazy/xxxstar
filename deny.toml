# cargo-deny configuration for X3 Atomic Star
# This file is used by Dockerfile.mainnet-check (Gate 5) and CI
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Skip downloading the advisory database if not needed
# (we use cargo-audit for advisories; cargo-deny handles bans/licenses)
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
# Ignored advisory IDs (with justification)
ignore = [
    # "RUSTSEC-2024-0001" — example: will be patched in next release
]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

[bans]
# Crate ban policy
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # No duplicate standard library wrappers
    # "libc",
]

[licenses]
# License policy
unlicensed = "deny"
allow-osi-fsi = false
default = "deny"
confidence-threshold = 0.8
deny = [
    # "AGPL-3.0",               # Uncomment to block AGPL
    # "AGPL-3.0-only",
    # "AGPL-3.0-or-later",
]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "BSD-2-Clause",
    "MPL-2.0",
    # Unicode-DFS-2016 (used by unicode-ident)
    "Unicode-DFS-2016",
]
skip = [
    # Allow ring's odd license setup
    { name = "ring", licenses = ["ISC", "OpenSSL"] },
    { name = "webpki", licenses = ["ISC"] },
    # wasm-bindgen license
    { name = "wasm-bindgen", licenses = ["Apache-2.0", "MIT"] },
]
skip-tree = [
    # wasm-bindgen-test has complex transitive deps
    { name = "wasm-bindgen-test" },
]

[version-git]
# Control behavior around git dependency version mismatches
enable = false