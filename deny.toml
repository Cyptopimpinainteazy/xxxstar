# cargo-deny configuration for X3 Atomic Star
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
yanked = "warn"
# Informational advisories are not failures, matching what `cargo audit` already does:
# it reports `unmaintained`/`unsound`/`notice` as warnings and fails only on
# vulnerabilities. Without this, cargo-deny fails on every unmaintained crate in the
# graph, so the ignore list has to name each one by hand -- which is how it came to hold
# 51 entries of which 39 no longer matched anything.
unmaintained = "none"
# `unsound` has no equivalent switch, so the four unsound advisories that are present in
# this graph are named in the list below. A new one still fails the gate.
#
# THIS LIST AND `.cargo/audit.toml`'s `ignore` MUST BE IDENTICAL; see that file's header
# for why, and for the rule that an entry which stops matching is removed rather than
# left in place.
#
# `-D advisory-not-detected` (used by the `dependency audit` gate) is what makes the
# second half of that rule real: an ignore entry that matches nothing becomes an error.
ignore = [
    # ---- Substrate / polkadot-sdk stable2512 pins ------------------------------
    "RUSTSEC-2022-0093",   # ed25519-dalek 1.0.1 via ed25519-zebra -> sp-core; 2.2.0 also resolved
    "RUSTSEC-2024-0344",   # curve25519-dalek 3.2.0, same Substrate path; timing side channel
    "RUSTSEC-2024-0437",   # protobuf 2.28.0 via prometheus 0.13.4 (cross-chain-gpu-validator, sc-utils)

    # ---- legacy JSON-RPC / ethers 2.x path ------------------------------------
    "RUSTSEC-2024-0421",   # idna 0.1.5 via url 1.7.2 -> jsonrpc-core-client 18 -> ethers 2.x
    "RUSTSEC-2025-0009",   # ring 0.16.20 via jsonwebtoken 8 -> ethers 2.x -> x3-bot

    # ---- rustls 0.21 / hyper-rustls 0.24 (reqwest 0.11) -----------------------
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",   # rustls-webpki 0.101.7; 0.103.15 is also resolved and clean

    # ---- hickory-proto 0.24.4 / 0.25.2 ----------------------------------------
    # Reachability per consumer: docs/security/GHSA-3v94-mw7p-v465.md and
    # docs/security/GHSA-q2qq-hmj6-3wpp.md, enforced by the `advisory scope` gate.
    "RUSTSEC-2026-0118",   # NSEC3 loop - not compiled here (no dnssec feature is enabled)
    "RUSTSEC-2026-0119",   # O(n^2) encoding - accepted; nothing here encodes attacker-shaped records

    # ---- h2 0.3.27 ------------------------------------------------------------
    "RUSTSEC-2026-0258",   # server-side DoS; this tree only runs the client half

    # ---- unsound, with no upgrade path from this tree -------------------------
    # cargo-deny treats `unsound` as an error and offers no policy switch for it, so
    # these are named individually instead of waved through: a *new* unsound advisory
    # still fails the gate.
    "RUSTSEC-2022-0034",   # pkcs11 0.5.0 via custody-service; the advisory says no safe upgrade exists
    "RUSTSEC-2026-0002",   # lru 0.12.5 IterMut aliasing; 0.12 is pinned by libp2p-identify 0.44/0.45
    "RUSTSEC-2026-0253",   # lru LruCache::pop panic safety; same pin
    "RUSTSEC-2026-0191",   # solana_rbpf 0.8.5 EbpfVm::invoke_function; dev/test-only path
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # GPL-3.0-only is used by a polkadot-sdk build-time code generator.
    # GPL-3.0 and GPL-3.0-or-later WITH Classpath-exception-2.0 are transitively
    # linked by node networking/executor crates. The Classpath Exception permits
    # linking without imposing GPL terms on the distributed Apache-2.0 binary.
    "GPL-3.0-only",
    "GPL-3.0",
    "BlueOak-1.0.0",
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
    "CDLA-Permissive-2.0",
]
