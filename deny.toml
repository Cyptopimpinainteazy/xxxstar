# cargo-deny configuration for X3 Atomic Star
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
yanked = "warn"
# Audit config at .cargo/audit.toml handles ignore list for cargo-audit.
# NOTE: severity-threshold was removed in cargo-deny 0.16+; use ignore list in
# .cargo/audit.toml to manage per-advisory severity instead.
#
# cargo-deny uses its own [advisories] ignore list below (NOT read from
# .cargo/audit.toml). Keep both lists in sync.
ignore = [
    # ===== wasmtime 8.0.1 + 35.0.0 cluster (polkadot-sdk stable2512) =====
    # Pinned via sp-wasm-interface v20.0.0 and vendored sc-executor-wasmtime.
    "RUSTSEC-2026-0006",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0114",
    "RUSTSEC-2026-0222",
    "RUSTSEC-2026-0269",

    # ===== h2 0.3.27 + 0.4.15 (HTTP/2 server DoS, client-only in our usage) =====
    "RUSTSEC-2026-0258",

    # ===== rkyv 0.7.46 (workspace resolution ghost, not compiled) =====
    "RUSTSEC-2026-0235",

    # ===== Previously-known transitive pins =====
    "RUSTSEC-2023-0091",
    "RUSTSEC-2024-0438",
    "RUSTSEC-2025-0118",
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2024-0344",
    "RUSTSEC-2025-0009",
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2024-0421",
    "RUSTSEC-2024-0437",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0178",
    "RUSTSEC-2025-0055",
    "RUSTSEC-2022-0093",

    # ===== Solana runtime transitive pins (solana-runtime v3.0.0) =====
    # These unmaintained/unsound crates are pulled by solana-runtime,
    # which is a dev-test-only dependency for x3-svm-integration tests.
    # Not compiled into production runtime. The solana_rbpf unsound is
    # in test-only EbpfVm::invoke_function (no production caller).
    "RUSTSEC-2026-0173",   # proc-macro-error2 (solana-runtime -> aquamarine)
    "RUSTSEC-2026-0251",   # sized-chunks (solana-runtime -> im)
    "RUSTSEC-2026-0191",   # solana_rbpf EbpfVm::invoke_function unsound (test-only)
    "RUSTSEC-2025-0134",   # rustls-pemfile (reqwest transitive; pem parsing only)
    "RUSTSEC-2024-0320",   # yaml-rust (config crate -> analytics-service only)
    "RUSTSEC-2024-0370",   # proc-macro-error 1.0.4 (frame-executive -> aquamarine -> proc-macro-error; pinned by polkadot-sdk stable2512)

    # ===== Unmaintained (RUSTSEC "unmaintained" advisories, not vulnerabilities) =====
    # All transitive deps pulled in by polkadot-sdk / solana-runtime / clap
    # chains; none are directly depended on by X3 code, and none have known
    # active CVEs — just no longer receiving upstream maintenance.
    "RUSTSEC-2021-0139",   # ansi_term (clap v2 transitive, dev/CLI-only)
    "RUSTSEC-2024-0384",   # instant (polkadot-sdk transitive timing shim)
    "RUSTSEC-2024-0388",   # derivative (polkadot-sdk transitive derive macro)
    "RUSTSEC-2024-0436",   # paste (polkadot-sdk/solana transitive derive macro)
    "RUSTSEC-2025-0057",   # fxhash (polkadot-sdk transitive hasher)
    "RUSTSEC-2025-0119",   # bincode 1.x (polkadot-sdk/solana transitive serialization)
    "RUSTSEC-2025-0141",   # bitmaps (polkadot-sdk transitive, via im)
    "RUSTSEC-2025-0161",   # im (polkadot-sdk transitive persistent collections)
    "RUSTSEC-2026-0247",   # libsecp256k1 (polkadot-sdk/solana transitive, superseded by k256/secp256k1)
    "RUSTSEC-2026-0248",   # number_prefix (indicatif transitive, CLI progress bars only)
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # GPL-3.0-only: polkadot-sdk stable2512 xcm-procedural macro uses this;
    # the produced code is consumed as a build-time codegen tool, not linked
    # into our runtime binary. Acceptable for build-deps. (For runtime binary
    # licensing we stay Apache-2.0 per workspace.package.license.)
    "GPL-3.0-only",
    # keccak-hash 0.1.2 (GPL-3.0-only variant tag used by parity-common):
    # transitive dev/test-only dependency, not linked into the production
    # runtime binary.
    "GPL-3.0",
    # BlueOak-1.0.0: minicbor / minicbor-derive, pulled in transitively by
    # pallet-x3-kernel for CBOR encoding. OSI-approved permissive license,
    # just not previously in the allow-list.
    "BlueOak-1.0.0",
    # GPL-3.0-or-later WITH Classpath-exception-2.0: substrate sc-* client
    # crates (sc-service, sc-network, sc-rpc, ...) from polkadot-sdk. The
    # Classpath exception explicitly permits linking without the resulting
    # binary being subject to GPL, so this is safe for our Apache-2.0 node
    # binary.
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
    # CDLA-Permissive-2.0: webpki-roots / webpki-root-certs (Mozilla CA
    # bundle republished under CDLA), pulled in transitively via reqwest /
    # ureq TLS stacks. Permissive data-license, not a code license.
    "CDLA-Permissive-2.0",
]
