# cargo-deny configuration for X3 Atomic Star
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
# Fail CI on medium severity or higher (ignore low/informational)
severity-threshold = "medium"
yanked = "warn"
# Audit config at .cargo/audit.toml handles ignore list

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "Unicode-DFS-2016",
]
